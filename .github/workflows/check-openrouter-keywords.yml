# 監視対象の OpenRouter が複合見出しの下で Cursor から消えないこと。
name: check-openrouter-keywords

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-openrouter-keywords.js'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: その他エージェントの OpenRouter 振り分けを検査する
        run: node scripts/check-openrouter-keywords.js
