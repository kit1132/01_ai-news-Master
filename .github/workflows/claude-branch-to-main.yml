# クラウドのスケジュールエージェントがセッション用ブランチ（claude/...）に
# push してしまった場合に、自動で main へマージして取り残しを防ぐ安全網。
# 経緯: 2026-06-10〜12 にダイジェストの取り残し事故が複数発生（CLAUDE.md「⚠️ ブランチ運用」参照）
#
# コンフリクトで自動マージできない場合、以前は job が赤くなるだけで気づきにくく、
# claude/... ブランチに変更が取り残されていた。現在はコンフリクト時に
# ① ブランチを削除せず温存し ② Issue を起票（既存なら追記）して可視化し ③ job を失敗させる。
name: claude-branch-to-main

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-to-main
  cancel-in-progress: false

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: claude ブランチを main にマージ
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "merging ${GITHUB_REF_NAME} into main"
          if git merge --ff-only "origin/${GITHUB_REF_NAME}"; then
            echo "fast-forward で取り込みました"
          elif git merge --no-edit "origin/${GITHUB_REF_NAME}"; then
            echo "マージコミットで取り込みました"
          else
            # コンフリクト。作業ツリーを元に戻し、後段の通知ステップに委ねる
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin main
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: マージ済みブランチを削除（成功時のみ）
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin --delete "${GITHUB_REF_NAME}" || true

      - name: コンフリクト時に Issue で通知（ブランチは温存）
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `⚠️ 自動マージ失敗: ${branch} が main とコンフリクト`;
            const body = [
              `ブランチ \`${branch}\` を main へ自動マージしようとしましたが、コンフリクトのため中断しました。`,
              ``,
              `- ブランチは削除せず温存しています（変更の取り残しを防ぐため）。`,
              `- 対応手順:`,
              `  1. \`git fetch origin\``,
              `  2. \`git checkout main && git pull --ff-only origin main\``,
              `  3. \`git merge origin/${branch}\` でコンフリクトを解消し main に push`,
              `  4. 解消後に \`git push origin --delete ${branch}\` でブランチを削除`,
              ``,
              `実行ログ: ${runUrl}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const dup = existing.data.find((i) => !i.pull_request && i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: dup.number,
                body: `再発しました。\n\n${body}`,
              });
              core.notice(`既存 Issue #${dup.number} にコメントしました`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.notice(`Issue #${created.data.number} を起票しました`);
            }

      - name: コンフリクト時はジョブを失敗させる
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error::${GITHUB_REF_NAME} は main とコンフリクトし取り残されています。起票された Issue を確認してください。"
          exit 1
