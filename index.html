<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
          integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
          crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:#0d1117; --panel:#161b22; --border:#30363d; --border2:#21262d;
      --fg:#c9d1d9; --fg-strong:#f0f6fc; --muted:#8b949e; --link:#58a6ff;
      --accent:#1f6feb; --side:260px; --topbar:48px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: var(--bg); color: var(--fg);
    }

    /* --- 通知帯 --- */
    .banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99;
      padding: 10px 14px; font-size: 13px; line-height: 1.5;
    }
    .b-err  { background: #da3633; color: #fff; }
    .b-warn { background: #9e6a03; color: #fff; }
    .banner button {
      margin-left: 10px; background: #0003; color: inherit;
      border: 1px solid #fff6; border-radius: 5px; padding: 3px 9px; cursor: pointer; font: inherit;
    }

    /* --- トップバー --- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar);
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 12px; z-index: 40;
    }
    #menu-btn {
      display: none; background: none; border: 1px solid var(--border); color: var(--fg);
      border-radius: 6px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; flex: none;
    }
    .brand { font-size: 12px; color: var(--muted); letter-spacing: .5px; white-space: nowrap; }
    #pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .pill {
      background: var(--border2); border: 1px solid var(--border); color: var(--fg);
      font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
      /* flex: none がないと幅が足りないときに潰れて文字が縦に折り返す */
      flex: none; white-space: nowrap; line-height: 1.4;
    }
    .pill:hover { border-color: var(--muted); }
    .pill[aria-current="true"] { background: #1f6feb33; border-color: var(--accent); color: var(--link); font-weight: 600; }

    /* --- レイアウト --- */
    .layout { display: flex; height: 100dvh; padding-top: var(--topbar); }
    .sidebar {
      width: var(--side); min-width: var(--side); background: var(--panel);
      border-right: 1px solid var(--border); overflow-y: auto;
    }
    .main { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 15px; }

    /* --- 月アコーディオン --- */
    #file-list { padding: 6px; }
    .month > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
      padding: 9px 10px; border-radius: 6px; font-size: 12px; color: var(--muted);
      position: sticky; top: 0; background: var(--panel); z-index: 1;
    }
    .month > summary::-webkit-details-marker { display: none; }
    .month > summary:hover { background: var(--border2); }
    .chev { display: inline-block; transition: transform .15s; color: #6e7681; }
    .month[open] > summary .chev { transform: rotate(90deg); }
    .m-label { font-weight: 600; }
    .m-count { margin-left: auto; font-size: 11px; color: #6e7681; }

    /* 入れ子 ul に padding が二重に付かないよう .items だけで完結させる */
    .items { list-style: none; padding: 0 0 6px 0; margin: 0; }
    .item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: none; border: none; color: var(--fg); font: inherit;
      padding: 9px 12px; border-radius: 6px; cursor: pointer;
    }
    .item:hover { background: var(--border2); }
    .item.is-active { background: #1f6feb33; color: var(--link); font-weight: 600; }
    .i-body { display: flex; flex-direction: column; min-width: 0; }
    .i-title { font-size: 14px; }
    .i-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
    .b-today { background: #238636; color: #fff; }
    .b-week  { background: #1f6feb; color: #fff; }
    .b-part  { background: #30363d; color: var(--muted); }

    /* --- 本文 --- */
    .content { max-width: 820px; margin: 0 auto; }
    .content h1 { font-size: 26px; color: var(--fg-strong); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .content h2 { font-size: 19px; color: var(--fg-strong); margin-top: 28px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border2); }
    .content h3 { font-size: 16px; color: #e6edf3; margin-top: 20px; margin-bottom: 8px; }
    .content p  { line-height: 1.8; margin-bottom: 10px; }
    .content ul, .content ol { padding-left: 22px; margin-bottom: 14px; }
    .content li { line-height: 1.8; margin-bottom: 5px; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .content a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
    .content a:hover { text-decoration: underline; }
    .content code { background: var(--panel); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #e6edf3; }
    .content pre { background: var(--panel); padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 14px; }
    .content pre code { background: none; padding: 0; }
    .content strong { color: #e6edf3; }
    .content em { color: var(--muted); }
    /* 02 は123件中69件が表を、05 は68件中51件が引用を使うが、これまで CSS が無かった */
    .content blockquote { border-left: 3px solid var(--border); padding-left: 14px; color: var(--muted); margin: 14px 0; }
    .content table { border-collapse: collapse; margin: 14px 0; display: block; overflow-x: auto; }
    .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .content th { background: var(--panel); color: var(--fg-strong); }
    .content img { max-width: 100%; height: auto; }

    /* --- モバイル：ドロワー --- */
    /* z-index は topbar(40) > sidebar(30) > scrim(20)。☰ がドロワーの下に隠れないための必須条件 */
    .scrim { display: none; }
    @media (max-width: 820px) {
      #menu-btn { display: block; }
      .brand { display: none; }  /* 375px ではピルの横幅を優先する */
      #pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      #pills::-webkit-scrollbar { display: none; }
      .sidebar {
        position: fixed; top: var(--topbar); bottom: 0; left: 0; z-index: 30;
        transform: translateX(-100%); transition: transform .2s ease;
        box-shadow: 0 0 24px #0008;
      }
      .sidebar.open { transform: none; }
      .scrim { display: block; position: fixed; inset: var(--topbar) 0 0 0; background: #0008; z-index: 20; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="fatal" class="banner b-err" hidden></div>
  <div id="warn" class="banner b-warn" hidden></div>

  <header class="topbar">
    <button id="menu-btn" type="button" aria-label="一覧を開く">☰</button>
    <span class="brand">AI NEWS</span>
    <nav id="pills" aria-label="ソース切り替え"></nav>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div id="file-list"></div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main">
      <div id="content" class="content">
        <div class="empty">読み込み中…</div>
      </div>
    </main>
  </div>

  <script>
    const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const p2 = (n) => String(n).padStart(2, '0');

    const SOURCES = [
      { id: 'master',   dir: '01_ai-news-Master',   name: 'Master'   },
      { id: 'copilot',  dir: '02_ai-news-Copilot',  name: 'Copilot'  },
      { id: 'industry', dir: '03_ai-news-industry', name: '業界'     },
      { id: 'weekly',   dir: '04_ai-news-weekly',   name: '週次'     },
      { id: 'daily',    dir: '05_ai-news-daily',    name: 'デイリー' },
    ];
    const srcOf  = (id) => SOURCES.find((s) => s.id === id) || SOURCES[0];
    const baseOf = (id) => `../${srcOf(id).dir}/`;

    // --- 日付ユーティリティ（UTC 固定でタイムゾーン差を排除する） ---
    const dateUTC = (ymd) => new Date(ymd + 'T00:00:00Z');
    const ymdOf   = (d) => `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`;

    // ISO 週番号 → その週の月曜日
    function isoMonday(year, week) {
      const jan4 = new Date(Date.UTC(year, 0, 4)); // 1月4日は必ず第1週に含まれる
      const dow = (jan4.getUTCDay() + 6) % 7;      // 月=0
      return new Date(jan4.getTime() + (week - 1) * 7 * 86400000 - dow * 86400000);
    }

    // 日付 → ISO 週番号
    function isoWeekOf(d) {
      const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // その週の木曜へ
      const ft = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
      ft.setUTCDate(ft.getUTCDate() - ((ft.getUTCDay() + 6) % 7) + 3);
      return { year: t.getUTCFullYear(), week: 1 + Math.round((t - ft) / (7 * 86400000)) };
    }

    // --- ファイルパス → 一覧エントリ ---
    // 旧実装の /ai-news-(\d{4}-\d{2}-\d{2})/ は 04（ai-news- を含まない）と
    // 05（ai-news- の直後が daily-）に一致せず、全件スキップで 0 件表示になっていた。
    const RE_DATE = /(\d{4})-(\d{2})-(\d{2})\.md$/;
    const RE_WEEK = /(?:^|\/)(\d{4})\/[^/]*W(\d{1,2})[^/]*\.md$/;

    function parseEntry(path) {
      const d = path.match(RE_DATE);
      if (d) {
        const ymd = `${d[1]}-${d[2]}-${d[3]}`;
        return {
          kind: 'date', path, id: ymd, ymd,
          sort: `${d[1]}${d[2]}${d[3]}`, bucket: `${d[1]}-${d[2]}`,
          label: ymd, sub: DAYS[dateUTC(ymd).getUTCDay()] + '曜日',
        };
      }
      const w = path.match(RE_WEEK);
      if (w) {
        let year = +w[1];
        const wk = +w[2];
        let mon = isoMonday(year, wk);
        // ディレクトリ年が %G ではなく %Y だった場合の未来日を無害化する
        if (mon.getTime() > Date.now() + 14 * 86400000) mon = isoMonday(--year, wk);
        return {
          kind: 'week', path, id: `${year}-W${p2(wk)}`, y: year, wk, mon,
          sort: ymdOf(mon).replace(/-/g, ''),
          bucket: `${mon.getUTCFullYear()}-${p2(mon.getUTCMonth() + 1)}`,
          label: `${year}-W${p2(wk)}`,
          // 日付レンジは表示しない。W19 は H1 が 04-28〜05-04（ISO ではなく直近7日間）で
          // 週番号から算出した月曜と食い違うため、算出値を出すと本文と矛盾する。
          sub: '週次サマリー',
        };
      }
      // 判定不能でも捨てない。捨てたことが 04/05 の無言故障の原因だった。
      return {
        kind: 'other', path, id: path, sort: '00000000', bucket: 'unknown',
        label: path.split('/').pop(), sub: '日付を判定できません',
      };
    }

    // --- 状態 ---
    const state = { sourceId: 'master', entries: [], activeId: null, token: 0 };
    const mdCache = new Map();

    const $ = (sel) => document.querySelector(sel);

    function showFatal(msg) {
      const el = $('#fatal');
      el.textContent = 'ビューアでエラーが発生しました: ' + msg;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '再読み込み';
      btn.addEventListener('click', () => location.reload());
      el.appendChild(btn);
      el.hidden = false;
    }

    function showWarn(msg) {
      const el = $('#warn');
      el.textContent = msg;
      el.hidden = false;
    }

    async function loadIndex(sourceId) {
      const my = ++state.token;
      const base = baseOf(sourceId);
      // Pages はプリフライトを拒否するためカスタムヘッダは付けられない。
      // cache:'no-store' も共有キャッシュを回避できないのでクエリで破る。
      const res = await fetch(`${base}files.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`files.json の取得に失敗しました (HTTP ${res.status})`);
      const files = await res.json();
      if (my !== state.token) return; // 連打時の競合ガード

      // files.json の並び順に依存せず、必ず日付降順にする
      state.entries = files.map(parseEntry).sort((a, b) => (a.sort < b.sort ? 1 : a.sort > b.sort ? -1 : 0));
      state.sourceId = sourceId;
      state.activeId = null;
      renderList();
      if (state.entries.length) {
        await selectEntry(state.entries[0].id);
      } else {
        $('#content').innerHTML = '<div class="empty">表示できるファイルがありません</div>';
      }
    }

    function renderList() {
      const list = $('#file-list');
      list.innerHTML = '';

      // 降順済みの entries を走査順にグループ化する（Map は挿入順を保つ）
      const groups = new Map();
      for (const e of state.entries) {
        if (!groups.has(e.bucket)) groups.set(e.bucket, []);
        groups.get(e.bucket).push(e);
      }

      // 件数が少ないソース（04_weekly の11件など）は全部開く
      const openAll = state.entries.length <= 20;
      let first = true;

      for (const [bucket, items] of groups) {
        const det = document.createElement('details');
        det.className = 'month';
        det.dataset.bucket = bucket;
        det.open = openAll || first;
        first = false;

        const sum = document.createElement('summary');
        sum.innerHTML = '<span class="chev" aria-hidden="true">▸</span>';
        const label = document.createElement('span');
        label.className = 'm-label';
        label.textContent = bucket === 'unknown' ? '日付不明' : `${bucket.slice(0, 4)}年${+bucket.slice(5)}月`;
        const count = document.createElement('span');
        count.className = 'm-count';
        count.textContent = items.length;
        sum.append(label, count);

        const ul = document.createElement('ul');
        ul.className = 'items';
        for (const e of items) ul.appendChild(itemNode(e));

        det.append(sum, ul);
        list.appendChild(det);
      }

      const dropped = state.entries.filter((e) => e.kind === 'other').length;
      if (dropped > 0) showWarn(`${dropped} 件のファイルの日付を判定できませんでした（ファイル名の形式が変わった可能性があります）`);
    }

    // JST で今日を求める（kit は日本時間で生活している）
    function todayJST() {
      const now = new Date(Date.now() + 9 * 3600000);
      return `${now.getUTCFullYear()}-${p2(now.getUTCMonth() + 1)}-${p2(now.getUTCDate())}`;
    }

    function badgeOf(e) {
      const today = todayJST();
      if (e.kind === 'date') return e.ymd === today ? { cls: 'b-today', text: '今日' } : null;
      if (e.kind === 'week') {
        const cur = isoWeekOf(dateUTC(today));
        if (cur.year !== e.y || cur.week !== e.wk) return null;
        // 週の途中なら「途中」と明示する（完結した週と区別する）
        const sun = new Date(e.mon.getTime() + 6 * 86400000);
        return dateUTC(today) < sun ? { cls: 'b-part', text: '今週(途中)' } : { cls: 'b-week', text: '今週' };
      }
      return null;
    }

    function itemNode(e) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item';
      btn.dataset.id = e.id;

      const body = document.createElement('span');
      body.className = 'i-body';
      const t = document.createElement('span');
      t.className = 'i-title';
      t.textContent = e.label;
      const s = document.createElement('span');
      s.className = 'i-sub';
      s.textContent = e.sub;
      body.append(t, s);
      btn.appendChild(body);

      const b = badgeOf(e);
      if (b) {
        const span = document.createElement('span');
        span.className = 'badge ' + b.cls;
        span.textContent = b.text;
        btn.appendChild(span);
      }

      li.appendChild(btn);
      return li;
    }

    async function selectEntry(id) {
      const e = state.entries.find((x) => x.id === id);
      if (!e) return;
      const my = state.token;
      state.activeId = id;
      markActive();

      const url = baseOf(state.sourceId) + e.path;
      let md = mdCache.get(url);
      if (md === undefined) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${e.label} の取得に失敗しました (HTTP ${res.status})`);
        md = await res.text();
        mdCache.set(url, md);
      }
      if (my !== state.token) return; // ソース切り替えと競合したら描画しない

      if (typeof marked === 'undefined') {
        showWarn('Markdown ライブラリを読み込めませんでした。整形なしで表示します。');
        const pre = document.createElement('pre');
        pre.textContent = md;
        $('#content').replaceChildren(pre);
      } else {
        $('#content').innerHTML = marked.parse(md);
        decorateLinks();
      }
      $('.main').scrollTop = 0;
    }

    function markActive() {
      document.querySelectorAll('.item').forEach((el) => {
        const on = el.dataset.id === state.activeId;
        el.classList.toggle('is-active', on);
        if (on) el.closest('.month')?.setAttribute('open', '');
      });
    }

    function decorateLinks() {
      for (const a of $('#content').querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        if (/^https?:/.test(href)) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          continue;
        }
        // digest 内の相対リンクはページ内遷移にする
        const m = href.match(RE_DATE);
        if (m) {
          const id = `${m[1]}-${m[2]}-${m[3]}`;
          if (state.entries.some((x) => x.id === id)) {
            a.addEventListener('click', (ev) => {
              ev.preventDefault();
              selectEntry(id).catch((err) => showFatal(String(err.message || err)));
            });
          }
        }
      }
    }

    function renderPills() {
      const nav = $('#pills');
      nav.innerHTML = '';
      for (const s of SOURCES) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill';
        b.dataset.id = s.id;
        b.textContent = s.name;
        b.setAttribute('aria-current', String(s.id === state.sourceId));
        nav.appendChild(b);
      }
    }

    function switchSource(id) {
      if (id === state.sourceId) return;
      state.sourceId = id;
      renderPills();
      $('#warn').hidden = true;
      $('#content').innerHTML = '<div class="empty">読み込み中…</div>';
      history.replaceState(null, '', '#' + id);
      loadIndex(id).catch((e) => showFatal(String(e.message || e)));
    }

    const isMobile = () => window.matchMedia('(max-width: 820px)').matches;

    function setDrawer(open) {
      $('.sidebar').classList.toggle('open', open);
      $('#scrim').hidden = !open;
    }

    function boot() {
      const fromHash = SOURCES.find((s) => s.id === location.hash.slice(1));
      if (fromHash) state.sourceId = fromHash.id;
      renderPills();

      // イベント委譲。要素を作り直しても listener を張り直さなくてよい
      $('#pills').addEventListener('click', (ev) => {
        const b = ev.target.closest('.pill');
        if (b) switchSource(b.dataset.id);
      });
      $('#file-list').addEventListener('click', (ev) => {
        const btn = ev.target.closest('.item');
        if (!btn) return;
        selectEntry(btn.dataset.id).catch((e) => showFatal(String(e.message || e)));
        if (isMobile()) setDrawer(false);
      });

      $('#menu-btn').addEventListener('click', () => setDrawer(!$('.sidebar').classList.contains('open')));
      $('#scrim').addEventListener('click', () => setDrawer(false));
      document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') setDrawer(false); });

      let lastDay = todayJST();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && todayJST() !== lastDay) {
          lastDay = todayJST();
          renderList();
          markActive();
        }
      });

      loadIndex(state.sourceId).catch((e) => showFatal(String(e.message || e)));
    }

    // Node からパーサだけを検証できるようブラウザ判定で囲む
    if (typeof window !== 'undefined') {
      window.addEventListener('error', (e) => showFatal(e.message));
      window.addEventListener('unhandledrejection', (e) => showFatal(String(e.reason)));
      try { boot(); } catch (e) { showFatal(String(e)); }
    }
  </script>
</body>
</html>
