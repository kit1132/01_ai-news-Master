<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 実効テーマ（dark/light）に合わせて JS が書き換える。初期値は暗色（既定プリファレンス） -->
  <meta name="color-scheme" content="dark">
  <title>AI News</title>
  <!-- 初回描画前にテーマを確定し、フラッシュを防ぐ。localStorage キーは about.html と共用 -->
  <script>
    (function () {
      var KEY = 'ai-news-theme';
      var pref = localStorage.getItem(KEY) || 'dark';
      if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'dark';
      var theme = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-theme-pref', pref);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = theme;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
          integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
          crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 既定はダーク。data-theme は head の即時スクリプトが必ず付ける。
       パレットは Notion 寄り（選択はグレー、青はリンク専用）。
       --brand / --muted は 18.66px 未満でも 4.5:1 を満たす */
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg:#191919; --panel:#202020; --border:#2f2f2f; --border2:#2c2c2c;
      --fg:#d4d4d4; --fg-strong:#ffffff; --muted:#9b9b9b; --link:#6cb6e0;
      --accent:#5b9fd6;
      --brand:#9b9b9b; --empty:#9b9b9b; --heading-soft:#ececec;
      --muted-strong:#b4b4b4;
      --code-bg:#2c2c2c; --code-border:#4a4a4a;
      --strong-long:#e8e8e8; --strong-hl:#3d5a6c; --active-bg:#2c2c2c;
      --badge-part-bg:#3d3d3d; --badge-part-fg:#d4d4d4;
      --shadow:#0007; --scrim:#0008;
      --callout-bg:#262626;
      /* 日付一覧の土日。本文リンク青・通知赤とは役割が違う（カレンダーの曜日） */
      --dow-sat:#6cb6e0; --dow-sun:#f07178;
      --side:240px;
      --topbar:45px;   /* 実際の高さは JS で測って上書きする */
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg:#ffffff; --panel:#f7f6f3; --border:#e8e7e4; --border2:#efeee9;
      --fg:#37352f; --fg-strong:#37352f; --muted:#6f6e69; --link:#0b6e99;
      --accent:#2383e2;
      --brand:#6f6e69; --empty:#6f6e69; --heading-soft:#37352f;
      --muted-strong:#6f6e69;
      --code-bg:#f1f1ef; --code-border:#d3d2ce;
      --strong-long:#37352f; --strong-hl:#d6eaf3; --active-bg:#ecebe9;
      --badge-part-bg:#e8e7e4; --badge-part-fg:#6f6e69;
      --shadow:#37352f40; --scrim:#37352f66;
      --callout-bg:#f7f6f3;
      --dow-sat:#0b6e99; --dow-sun:#c62828;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: var(--bg); color: var(--fg);
    }

    /* --- 通知帯 --- */
    /* ⚠️ 位置決めはラッパー側に持たせる。個々の .banner を fixed にすると
       #fatal と #warn が同じ top:0 で完全に重なり、後から出る #warn が
       **再読み込みボタンを持つ #fatal を隠す**（375px 実測・両方とも高さ59px）。
       さらにバナーはトップバーの上に乗るため、モバイルでは ☰（y 23〜57px）が
       押せなくなり、日付ドロワーを開く手段が無くなる。 */
    #banners { position: fixed; top: 0; left: 0; right: 0; z-index: 99; }
    .banner {
      padding: 10px 14px; font-size: 13px; line-height: 1.5;
    }
    .b-err  { background: #da3633; color: #fff; }
    .b-warn { background: #9e6a03; color: #fff; }
    .banner button {
      margin-left: 10px; background: #0003; color: inherit;
      border: 1px solid #fff6; border-radius: 5px; padding: 3px 9px; cursor: pointer; font: inherit;
    }

    /* --- トップバー（薄いパンくず。2段ピルはサイドバーへ移した） --- */
    .topbar {
      /* バナーが出ている間はその下へ退避する（--banner-h は syncTopbarHeight が測る） */
      position: fixed; top: var(--banner-h, 0px); left: 0; right: 0; z-index: 40;
      background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 45px;
    }
    #menu-btn {
      display: none; background: none; border: 1px solid var(--border); color: var(--fg);
      /* 44px はタップ領域の下限。モバイルで日付へ行く唯一の入口 */
      border-radius: 6px; width: 44px; height: 44px; font-size: 16px; cursor: pointer; flex: none;
    }
    .crumb {
      display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;
      font-size: 14px; color: var(--muted); overflow: hidden;
    }
    .crumb-sep { color: var(--muted); opacity: .55; flex: none; }
    .crumb-item {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; flex: none;
    }
    .crumb-item.crumb-current,
    .crumb-item.crumb-context { flex: 0 1 auto; min-width: 0; }
    .crumb-item.crumb-current { color: var(--fg); font-weight: 500; }
    .crumb-link {
      flex: none; background: none; border: none; color: var(--muted);
      font: inherit; font-size: 14px; line-height: 1.2;
      padding: 6px 8px; border-radius: 6px; cursor: pointer;
      white-space: nowrap; min-height: 36px;
    }
    .crumb-link:hover { color: var(--fg-strong); background: var(--border2); }
    .crumb-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .topbar-end {
      display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none;
    }

    /* 折りたたむ節が無い日に消すのは「すべて開く」ボタンだけ。
       `display:inline-flex` があるので hidden 属性ではなくクラスで制御する */
    #expand-all.hide { display: none; }

    /* 表示モード（ライト / システム / ダーク）。選択はグレー（ナビの青と分離） */
    .theme-switch {
      display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
      overflow: hidden; flex: none; background: var(--bg);
    }
    .theme-opt {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font: inherit; padding: 0; width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-opt + .theme-opt { border-left: 1px solid var(--border); }
    .theme-opt:hover { color: var(--fg); background: var(--border2); }
    .theme-opt[aria-checked="true"] {
      color: var(--fg-strong); background: var(--active-bg);
    }
    .theme-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
    .theme-opt svg { width: 16px; height: 16px; display: block; }

    #expand-all {
      background: none; border: none; color: var(--fg);
      font: inherit; font-size: 12px; padding: 6px 0; border-radius: 0; cursor: pointer;
      min-height: 36px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
    }
    /* 押すとどちらへ向かうかを三角で示す。閉じている状態＝これから開く＝▼
       ナビ選択の塗りにしない（操作トグル ≠ ナビ選択） */
    #expand-all::before { content: "▼"; font-size: 9px; color: var(--fg); }
    #expand-all[aria-pressed="true"]::before { content: "▲"; color: var(--fg-strong); }
    #expand-all[aria-pressed="true"] { color: var(--fg-strong); }
    #expand-all:hover { color: var(--fg-strong); }

    /* --- レイアウト --- */
    .layout { display: flex; height: 100dvh; padding-top: var(--topbar); }
    .sidebar {
      width: var(--side); min-width: var(--side); background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      height: 100%; min-height: 0;
    }
    .side-brand {
      flex: none; padding: 14px 16px 8px;
      font: inherit; font-size: 14px; font-weight: 600; color: var(--fg-strong);
      letter-spacing: .02em; background: none; border: none; text-align: left;
      width: 100%; cursor: pointer; min-height: 44px;
    }
    .side-brand:hover { color: var(--fg); }
    .side-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    #source-tree { flex: none; padding: 0 8px 8px; max-height: 62vh; overflow-y: auto; }
    .side-group { display: flex; flex-direction: column; gap: 2px; }
    .side-branch { display: flex; flex-direction: column; gap: 0; }
    /* 親行: twist（開閉）とラベル（ナビ）を分ける。展開だけでは本文を動かさない */
    .side-parent-row {
      display: grid; grid-template-columns: 28px 1fr; align-items: stretch; gap: 0;
    }
    .side-twist {
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: var(--muted-strong); font: inherit;
      font-size: 10px; padding: 0; border-radius: 6px; cursor: pointer;
      min-height: 36px; min-width: 28px;
    }
    .side-twist:hover { background: var(--border2); color: var(--fg-strong); }
    .side-twist:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .side-twist::before { content: "▸"; display: inline-block; transition: transform .12s; }
    .side-twist[aria-expanded="true"]::before { transform: rotate(90deg); }
    .side-src {
      display: flex; align-items: center; width: 100%; text-align: left;
      background: none; border: none; color: var(--fg); font: inherit;
      font-size: 14px; padding: 7px 10px; border-radius: 6px; cursor: pointer;
      min-height: 36px;
    }
    .side-parent-row .side-src { padding-left: 6px; }
    .side-src:hover { background: var(--border2); color: var(--fg-strong); }
    .side-src.is-active {
      background: var(--active-bg); color: var(--fg-strong); font-weight: 600;
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .side-src:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* 親の下: レールで親子を示す。元ソース小見出し → 葉 */
    .side-nest {
      margin: 0 2px 4px 14px; padding: 2px 0 4px 10px;
      border-left: 2px solid var(--border);
      display: flex; flex-direction: column; gap: 1px;
    }
    /* 小見出しはキャプション（11px muted）にしない。ソース名 14px の一段上の見出し */
    .side-subhead {
      font-size: 12px; color: var(--fg); font-weight: 600;
      padding: 6px 8px 2px; letter-spacing: .02em;
      display: flex; align-items: center; gap: 4px;
    }
    .side-subhead::before {
      content: "┗"; color: var(--muted-strong); font-weight: 400; font-size: 11px;
    }
    .side-children {
      display: flex; flex-direction: column; gap: 1px;
      margin: 0 0 2px 10px; padding-left: 8px;
      border-left: 2px solid color-mix(in srgb, var(--fg) 14%, var(--bg));
    }
    .side-children .side-src {
      font-size: 13px; padding: 6px 8px; min-height: 32px; gap: 6px;
    }
    .side-children .side-src::before {
      content: "┗"; color: var(--muted-strong); font-size: 11px; flex: none;
    }
    .side-divider { flex: none; height: 1px; background: var(--border); margin: 4px 12px; }
    .side-foot {
      flex: none; flex-shrink: 0; padding: 8px 8px 12px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
      background: var(--panel); z-index: 2;
    }
    .side-foot .theme-switch { width: 100%; }
    .side-foot .theme-opt { flex: 1; }
    .about-link {
      color: var(--fg); text-decoration: none; font-size: 13px;
      border: none; background: none; padding: 8px;
      min-height: 36px; display: flex; align-items: center;
      border-radius: 4px; width: 100%;
    }
    .about-link:hover, .about-link:focus-visible {
      background: var(--border2); color: var(--fg-strong); text-decoration: none;
    }
    .main { flex: 1; overflow-y: auto; padding: 40px 64px 96px; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--empty); font-size: 15px; }
    .cat-index { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .cat-index-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; text-align: left; background: none; border: none;
      color: inherit; font: inherit; cursor: pointer;
      padding: 10px 12px; border-radius: 8px; min-height: 44px;
    }
    .cat-index-item:hover { background: var(--border2); }
    .cat-index-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* ホームだけ Notion のページ。記事の見出しサイズには寄せない */
    .content:has(.home-page) { max-width: 740px; }
    .main:has(.home-page) { padding-top: 64px; }
    .content .home-head { margin: 0 0 36px; }
    .home-mark {
      width: 46px; height: 46px; margin: 0 0 14px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 14%, var(--callout-bg));
      color: var(--fg-strong);
      border: 1px solid var(--border);
    }
    .home-mark svg, .home-ico svg { display: block; }
    .content h1.page-when.home-title {
      font-size: 40px; font-weight: 700; letter-spacing: -.03em;
      line-height: 1.15; margin: 0 0 10px;
    }
    .content .home-head .page-overview {
      font-size: 16px; line-height: 1.65; color: var(--fg);
      max-width: 38em; margin: 0;
    }
    .home-block { margin: 0 0 32px; }
    .content h2.home-kicker {
      margin: 0 0 8px; font-size: 12px; font-weight: 600;
      color: var(--muted); letter-spacing: .04em; line-height: 1.4;
    }
    .home-table, .home-pages {
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
      background: var(--bg);
    }
    .home-tr {
      display: grid; grid-template-columns: 9em 1fr; gap: 16px;
      align-items: start; padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    .home-tr:first-child { border-top: none; }
    .home-th {
      background: var(--callout-bg);
      font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.4;
    }
    .home-name {
      font-size: 14px; font-weight: 600; color: var(--fg-strong); line-height: 1.45;
    }
    .home-kind {
      margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--muted);
      word-break: keep-all;
    }
    .home-picks { font-size: 14px; line-height: 1.55; color: var(--fg); word-break: keep-all; }
    .home-page-row {
      display: grid; grid-template-columns: 28px 1fr 16px; gap: 10px;
      align-items: center; width: 100%; text-align: left;
      background: none; border: none; border-top: 1px solid var(--border);
      color: inherit; font: inherit; cursor: pointer;
      padding: 10px 12px; min-height: 52px;
    }
    .home-page-row:first-child { border-top: none; }
    .home-page-row:hover { background: var(--border2); }
    .home-page-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .home-ico {
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: var(--callout-bg); color: var(--fg); flex: none;
    }
    .home-page-name {
      display: block; font-size: 15px; font-weight: 600;
      color: var(--fg-strong); line-height: 1.35;
    }
    .home-page-hint {
      display: block; margin-top: 2px; font-size: 13px;
      color: var(--muted); line-height: 1.45;
    }
    .home-page-row::after {
      content: "›"; color: var(--muted); font-size: 18px; line-height: 1;
      justify-self: end;
    }
    .home-callout {
      display: flex; gap: 10px; align-items: flex-start;
      margin: 0; padding: 12px 14px; border-radius: 4px;
      background: var(--callout-bg); color: var(--fg);
    }
    .home-callout-ico {
      flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--muted-strong);
    }
    .content .home-callout p {
      margin: 0; font-size: 14px; line-height: 1.6; color: var(--fg);
    }
    .cat-index-hint { font-size: 13px; color: var(--muted-strong); line-height: 1.4; }
    .cat-item { margin: 0; }
    .cat-item > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
      margin: 0; padding: 10px 8px; min-height: 40px; border-radius: 6px;
    }
    .cat-item > summary::-webkit-details-marker { display: none; }
    .cat-item > summary::before {
      content: "▶"; font-size: 10px; color: var(--muted-strong); flex: none;
      transition: transform .15s; display: inline-block; width: 1em; text-align: center;
    }
    .cat-item[open] > summary::before { transform: rotate(90deg); }
    .cat-item > summary:hover { background: var(--border2); }
    .content h2.cat-item-t {
      font-size: 15px; font-weight: 600; color: var(--fg-strong); line-height: 1.45;
      margin: 0; padding: 0; flex: 1; min-width: 0; overflow: hidden;
    }
    .cat-item-body {
      margin: 0 0 12px calc(8px + 1em + 8px);
      padding: 2px 0 12px 14px;
      border-left: 1px solid color-mix(in srgb, var(--fg) 16%, var(--bg));
    }

    /* 右ペイン共通クローム: 日時を主見出しにし、ナビ文脈はその上に小さく */
    .page-head { margin: 0 0 20px; }
    .page-context {
      font-size: 13px; font-weight: 600; color: var(--muted-strong);
      letter-spacing: .02em; margin: 0 0 6px; line-height: 1.4;
    }
    .content h1.page-when {
      font-size: 26px; font-weight: 700; color: var(--fg-strong);
      letter-spacing: -.01em; line-height: 1.25; margin: 0 0 8px;
    }
    .page-overview {
      font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 6px;
    }
    .page-meta {
      font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0;
    }
    /* カテゴリ: 月トグルの中が週トグル、その中が日付トグル。記事ごとには畳まない */
    .cat-timeline { margin-top: 4px; }
    .cat-month, .cat-week { margin: 0 0 4px; }
    .cat-month > summary,
    .cat-week > summary,
    .cat-day > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
      margin: 0; padding: 8px; min-height: 40px; border-radius: 6px;
    }
    .cat-month > summary::-webkit-details-marker,
    .cat-week > summary::-webkit-details-marker,
    .cat-day > summary::-webkit-details-marker { display: none; }
    .cat-month > summary::before,
    .cat-week > summary::before,
    .cat-day > summary::before {
      content: "▶"; font-size: 10px; color: var(--muted-strong); flex: none;
      width: 1em; text-align: center; transition: transform .15s;
    }
    .cat-month[open] > summary::before,
    .cat-week[open] > summary::before,
    .cat-day[open] > summary::before { transform: rotate(90deg); }
    .cat-month > summary:hover,
    .cat-week > summary:hover,
    .cat-day > summary:hover { background: var(--border2); }
    .cat-month-label { font-size: 20px; font-weight: 700; color: var(--fg-strong); letter-spacing: -.01em; }
    .cat-month .m-count, .cat-week .m-count { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted-strong); }
    .cat-month-days { margin: 0 0 8px 8px; }
    .cat-week-label { font-size: 18px; font-weight: 700; color: var(--fg-strong); letter-spacing: -.01em; line-height: 1.3; }
    .cat-week-range { font-size: 14px; font-weight: 500; color: var(--muted-strong); }
    .cat-week-days { margin: 0 0 8px 12px; }
    .cat-day { margin: 0; scroll-margin-top: 16px; }
    .content h2.cat-day-when {
      font-size: 16px; font-weight: 600; color: var(--fg-strong);
      letter-spacing: -.01em; line-height: 1.3; margin: 0; padding: 0; flex: 1;
    }
    .content h2.cat-day-when.dow-sat { color: var(--dow-sat); }
    .content h2.cat-day-when.dow-sun { color: var(--dow-sun); }
    .cat-day.is-focus > summary { background: var(--border2); }
    .cat-day-body {
      margin: 0 0 8px calc(8px + 1em + 8px);
      padding: 4px 0 8px 14px;
      border-left: 1px solid color-mix(in srgb, var(--fg) 16%, var(--bg));
    }
    .cat-piece + .cat-piece {
      margin-top: 16px; padding-top: 4px;
    }
    .content h3.cat-piece-t {
      font-size: 15px; font-weight: 600; color: var(--fg-strong);
      line-height: 1.45; margin: 0 0 8px;
    }
    .page-nav {
      display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0;
    }
    .page-nav button {
      background: none; border: none; color: var(--link); cursor: pointer;
      font: inherit; font-size: 13px; padding: 4px 0; min-height: 36px;
    }
    .page-nav button:hover { text-decoration: underline; }
    .page-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .page-nav button:disabled {
      color: var(--muted); cursor: default; opacity: .55; text-decoration: none;
    }
    .page-body { margin-top: 4px; }

    @media (max-width: 1100px) {
      .main { padding: 32px 28px 80px; }
    }

    /* --- 月アコーディオン --- */
    #file-list { flex: 1 1 0; overflow-y: auto; min-height: 0; padding: 4px 8px 8px; }
    .month > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
      padding: 8px 8px; border-radius: 4px; font-size: 16px; color: var(--fg);
      position: sticky; top: 0; background: var(--panel); z-index: 1;
    }
    .month > summary::-webkit-details-marker { display: none; }
    .month > summary:hover { background: var(--border2); }
    .chev { display: inline-block; transition: transform .15s; color: var(--muted-strong); }
    .month[open] > summary .chev { transform: rotate(90deg); }
    .m-label { font-weight: 700; }
    .m-count { margin-left: auto; font-size: 11px; color: var(--muted-strong); }

    /* 入れ子 ul に padding が二重に付かないよう .items だけで完結させる */
    .items { list-style: none; padding: 2px 0 8px 0; margin: 0; }
    .week-sep {
      padding: 14px 8px 2px; font-size: 11px; font-weight: 700;
      color: var(--muted-strong); letter-spacing: .14em;
    }
    .items > .week-sep:not(:first-child) {
      margin-top: 4px;
      border-top: 1px solid color-mix(in srgb, var(--fg) 12%, var(--bg));
    }
    .item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: none; border: none; color: var(--fg); font: inherit;
      padding: 8px 8px; border-radius: 6px; cursor: pointer; min-height: 36px;
    }
    .item:has(.i-date) {
      display: grid; grid-template-columns: 2.85em 1.2em 1fr auto;
      column-gap: 8px; align-items: center;
    }
    .item:has(.i-date) .badge { grid-column: 4; justify-self: end; }
    .item:has(.i-week) {
      display: grid; grid-template-columns: 2.85em minmax(0, 1fr) auto;
      column-gap: 8px; align-items: center;
    }
    .item:has(.i-week) .badge { grid-column: 3; justify-self: end; }
    .i-week {
      font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px;
      text-align: right; line-height: 1.2;
    }
    .i-range {
      font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 500;
      line-height: 1.2;
    }
    .item:hover { background: var(--border2); }
    .item.is-active { background: var(--active-bg); color: var(--fg-strong); font-weight: 600; }
    .i-date {
      font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px;
      text-align: right; line-height: 1.2;
    }
    .i-dow { font-size: 12px; font-weight: 400; color: var(--muted-strong); }
    .item.is-active .i-dow { color: var(--muted-strong); }
    .i-body { display: flex; flex-direction: column; min-width: 0; }
    .i-title { font-size: 12px; font-weight: 600; color: var(--muted-strong); }
    .item.is-active .i-title { color: var(--fg-strong); }
    .i-sub { font-size: 12px; color: var(--muted-strong); margin-top: 2px; }
    .i-sub .dow-sat, .i-sub .dow-sun { font-weight: 600; }
    /* 土日色は日付・曜・週範囲の末日で共通。active でもトークンを保つ */
    .dow-sat { color: var(--dow-sat); }
    .dow-sun { color: var(--dow-sun); }
    .item.is-active .dow-sat,
    .item.is-active .i-date.dow-sat,
    .item.is-active .i-dow.dow-sat { color: var(--dow-sat); }
    .item.is-active .dow-sun,
    .item.is-active .i-date.dow-sun,
    .item.is-active .i-dow.dow-sun { color: var(--dow-sun); }

    .badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
    .b-week, .b-part { background: var(--badge-part-bg); color: var(--badge-part-fg); }
    /* 「今日」は日付一覧で一番拾いたい印。週バッジと同居させると灰色に埋もれるので緑を維持する */
    .b-today { background: #238636; color: #fff; font-weight: 600; }

    /* --- 本文 --- */
    .content { max-width: 900px; margin: 0 auto; }

    .content h1 {
      font-size: 24px; font-weight: 600; line-height: 1.3; color: var(--fg);
      letter-spacing: -.01em; margin: 4px 0 12px;
    }
    /* 節見出し。節が1つ以下で折りたたみが適用されないファイルでも同じ見え方にする */
    .content h2 {
      font-size: 24px; font-weight: 700; color: var(--fg-strong); letter-spacing: 0; line-height: 1.3;
      margin-top: 2em; margin-bottom: 12px;
    }
    .content h3 { font-size: 20px; line-height: 1.4; color: var(--fg-strong); font-weight: 600; margin-top: 36px; margin-bottom: 14px; }
    .content h4 { font-size: 15px; color: var(--heading-soft); margin-top: 22px; margin-bottom: 8px; }
    .content p  { line-height: 1.75; margin-bottom: 16px; font-size: 16px; }
    .content ul, .content ol { padding-left: 1.6em; margin-bottom: 16px; }
    .content li { line-height: 1.75; margin-bottom: 6px; }
    /* 表示時の列挙分割。入れ子の内訳なので本体リストより詰める */
    .content ul.enum-split { margin: 8px 0 10px; padding-left: 20px; }
    .content ul.enum-split > li { margin-bottom: 6px; }
    /* 長い項目を句点で視覚ブロックに分ける。li は1つのまま件数は増やさない */
    .content .sent + .sent { margin-top: 12px; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .content a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
    .content a:hover { text-decoration: underline; }
    /* `code` の既定 monospace は、日本語が混じると環境によって明朝系へフォールバックし、
       本文（ゴシック）と書体が混在する（2026-07-31 実測: 日本語入り code が8箇所あった）。
       欧文は等幅のまま、CJK だけ確実にゴシックへ落とす順序で指定する */
    .content code, .content pre, .content kbd, .content samp {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono",
                   "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif;
    }
    .content code {
      background: var(--code-bg); border: 1px solid var(--code-border);
      padding: 1px 6px; border-radius: 4px; font-size: 13px; color: var(--heading-soft);
      overflow-wrap: anywhere;
    }
    .content pre {
      background: var(--code-bg); border: 1px solid var(--code-border);
      padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 20px;
    }
    .content pre code { background: none; border: none; padding: 0; }
    .content em { color: var(--fg); font-style: italic; }
    .content blockquote {
      border-left: 2px solid var(--border); padding-left: 14px; color: var(--fg);
      margin: 0 0 24px; font-size: 13px; line-height: 1.8;
    }
    /* 冒頭注記は 96% の日が定型文（2026-08-01 実測: 76日中ソース欠損は3日）。
       通常日は圧縮する。欠損があった日は .note-slim が付かず通常表示に戻る（decorateNote 参照） */
    /* ⚠️ 内側の <p> にも当てる。marked は blockquote の中身を <p> で包むので、
       blockquote だけに font-size を指定しても `.content p`（15px）に上書きされる */
    .content blockquote.note-slim { margin: 0 0 16px; padding-left: 10px; border-left-width: 1px; }
    .content blockquote.note-slim, .content blockquote.note-slim p {
      font-size: 11px; line-height: 1.6;
    }
    .content blockquote.note-slim p { margin-bottom: 0; }
    .content table { border-collapse: collapse; margin: 18px 0; display: block; overflow-x: auto; }
    .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .content th { background: var(--panel); color: var(--fg-strong); }
    .content img { max-width: 100%; height: auto; }

    /* --- `## セクション` の折りたたみ（Notion のトグル：▸＋見出し。左バーと横罫は使わない） --- */
    /* h2 は summary の「中に」入る（置き換えない）。押せることと節の始まりを視覚的に示す */
    .sec > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
      margin-top: 2.4em; margin-bottom: 8px; padding: 10px 8px; border-radius: 6px;
    }
    .sec > summary::-webkit-details-marker { display: none; }
    /* 節見出しは h2 要素のまま summary の中に入っている（見出し階層を壊さないため）。
       `.content h2`（特異性 0,1,1）に勝つ必要があるので `.content h2.sec-t` で指定する */
    .content h2.sec-t {
      font-size: 24px; font-weight: 700; color: var(--fg-strong); line-height: 1.35;
      letter-spacing: 0; margin: 0; padding: 0; border: none; display: block;
      /* ⚠️ 折り返す。畳んだ見出しの列がそのまま目次になる。
         overflow:hidden だけ残すのは、フレックス項目の自動最小サイズを0に保ち
         summary を押し広げないため。高さは auto なので行が増えても欠けない */
      overflow: hidden;
    }
    .sec-n { font-size: 12px; font-weight: 400; color: var(--muted-strong); flex: none; }
    .sec > summary::before {
      content: "▶"; font-size: 11px; color: var(--muted-strong); flex: none;
      transition: transform .15s; display: inline-block; width: 1em; text-align: center;
    }
    .sec[open] > summary::before { transform: rotate(90deg); }
    .sec > summary:hover { background: var(--border2); }
    .sec > summary:hover .sec-t { color: var(--fg-strong); }
    .sec > summary:hover::before { color: var(--fg); }

    /* --- `### 見出し` の折りたたみ（節の中の第2階層・groupSubsections 参照） --- */
    /* トグル行が親、中身はシェブロンの右にネストする。
       旧: padding-left 26px だけではタイトルより左に本文が始まり、
       項目見出し 600 / 本文 16px がカテゴリ名 500 / 16px より強く見えた（2026-09-21） */
    .sec > .sub {
      margin: 0;
    }
    .sub > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
      margin: 0; padding: 10px 8px; min-height: 40px; border-radius: 6px;
      border-bottom: none;
    }
    .sub[open] > summary { margin-bottom: 0; }
    .sub > summary::-webkit-details-marker { display: none; }
    .sub > summary::before {
      content: "▶"; font-size: 10px; color: var(--muted-strong); flex: none;
      transition: transform .15s; display: inline-block; width: 1em; text-align: center;
    }
    .sub[open] > summary::before { transform: rotate(90deg); }
    .sub > summary:hover { background: var(--border2); }
    .sub > summary:hover .sub-t { color: var(--fg-strong); }
    .sub > summary:hover::before { color: var(--fg); }
    /* 節 24 / カテゴリ 15 / 項目 14 / 本文 14。トグルが親で中身は一段落とす */
    .content h3.sub-t {
      font-size: 15px; font-weight: 600; color: var(--fg-strong); line-height: 1.45;
      margin: 0; padding: 0; flex: 1; min-width: 0; overflow: hidden;
    }
    .sub[open] > summary .sub-t { color: var(--fg-strong); }
    .sub-n { font-size: 12px; font-weight: 400; color: var(--muted-strong); flex: none; padding-left: 8px; }
    /* シェブロン列の右＝タイトル先頭に揃えてから、レール＋一段インデント。
       `.content .sub > ul` の方が特異性が高いので、ネスト指定はそちらに書く */
    .content .sub[open] > ul:not(.src),
    .content .sub[open] > ol {
      list-style: none;
      margin: 0 0 10px calc(8px + 1em + 8px);
      padding: 2px 0 12px 14px;
      border-left: 1px solid color-mix(in srgb, var(--fg) 16%, var(--bg));
    }
    .content .sub > ul:not(.src) > li,
    .content .sub > ol > li {
      margin: 0; padding: 12px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, var(--bg));
    }
    .content .sub > ul:not(.src) > li:last-child,
    .content .sub > ol > li:last-child {
      border-bottom: none; padding-bottom: 2px;
    }
    .cat-k {
      font-size: 14px; font-weight: 600; color: var(--fg-strong); line-height: 1.45;
      margin: 0 0 6px;
    }
    .content .sub .cat-v,
    .content .sub .cat-v p {
      line-height: 1.7; font-size: 14px; color: var(--fg);
      margin: 0 0 8px;
    }
    .content .sub .cat-v > :last-child { margin-bottom: 0; }
    .content .sub .cat-v ul, .content .sub .cat-v ol {
      margin: 6px 0 0; padding-left: 1.2em; font-size: 14px;
    }
    .content .sub .cat-v li { margin-bottom: 4px; line-height: 1.65; }
    .content .sub ul.src { margin: 8px 0 0; }

    /* 注目予定: 週トグルの中はカテゴリと同じネスト。日付列は M/D のみ */
    .content .sec[data-sched] .sub > ul:not(.src) > li,
    .content .sec[data-sched] .sub > ol > li,
    .content .sec[data-sched] > ul:not(.src) > li,
    .content .sec[data-sched] > ol > li {
      display: grid;
      grid-template-columns: 3.5rem minmax(0, 1fr);
      column-gap: 12px;
      align-items: start;
      margin: 0; padding: 12px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, var(--bg));
      line-height: 1.65;
    }
    .content .sec[data-sched] .sub > ul:not(.src) > li:last-child,
    .content .sec[data-sched] .sub > ol > li:last-child,
    .content .sec[data-sched] > ul:not(.src) > li:last-child,
    .content .sec[data-sched] > ol > li:last-child { border-bottom: none; padding-bottom: 2px; }
    .content .sec[data-sched] .sched-d {
      font-variant-numeric: tabular-nums;
      font-weight: 600; font-size: 14px; color: var(--fg-strong);
      line-height: 1.45; padding-top: 2px;
      text-align: right; white-space: nowrap;
    }
    .content .sec[data-sched] .sched-d.is-empty { color: transparent; }
    .content .sec[data-sched] .sched-b {
      min-width: 0; font-size: 14px; line-height: 1.7; color: var(--fg);
    }
    .content .sec[data-sched] .sched-b > :last-child { margin-bottom: 0; }
    .content .sec[data-sched] .sched-chip,
    .content .sec[data-sched] .sched-today {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 1px 7px; border-radius: 999px; margin-right: 6px;
      vertical-align: 1px; letter-spacing: .02em;
    }
    .content .sec[data-sched] .sched-chip {
      background: color-mix(in srgb, var(--fg) 12%, var(--bg));
      color: var(--muted-strong);
    }
    .content .sec[data-sched] .sched-today {
      background: #238636; color: #fff;
    }
    .content .sec[data-sched] .sched-b.sched-multi > .sched-chip,
    .content .sec[data-sched] .sched-b.sched-multi > .sched-today {
      margin-bottom: 6px;
    }
    .content .sec[data-sched] .sched-part + .sched-part { margin-top: 8px; }
    .content .sec[data-sched] .sched-b.sched-multi .sched-part {
      position: relative; padding-left: 14px;
    }
    .content .sec[data-sched] .sched-b.sched-multi .sched-part::before {
      content: "•"; position: absolute; left: 0; top: 0;
      color: var(--muted-strong); font-weight: 700;
    }

    /* --- 先頭へ戻る（画面幅によらず、スクロールしたときだけ出す） --- */
    #to-top {
      display: none; position: fixed; right: 18px; bottom: 20px; z-index: 45;
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border); color: var(--fg);
      font-size: 17px; line-height: 1; box-shadow: 0 3px 12px var(--shadow);
    }
    #to-top.show { display: block; }
    #to-top:hover { border-color: var(--muted); }
    #to-top:active { background: var(--border2); }

    /* 導入段落はリード文として落ち着かせる。下罫は置かない（タイトル〜本文をページとして地続きに） */
    .content .lede {
      color: var(--muted-strong); font-size: 15px; line-height: 1.65;
      margin-bottom: 16px; padding-bottom: 0;
    }

    /* 見出しの「— 含意」側を落として、タイトルを相対的に立てる。
       h3 は既に 700 なのでタイトル側を太くする余地がない（decorateHeadings 参照） */
    .content h3 .h3-sub {
      font-weight: 400; color: var(--fg); font-size: .88em; letter-spacing: 0;
    }

    /* 箇条書きは逆に、タイトル側を太くする（li の基本ウェイトは 400 なので余地がある）。
       `**ラベル**:` 形式は strong が担当するので、ここでは太字を重ねない（decorateListTitles 参照） */
    .content li .li-title, .content li > p > .li-title { font-weight: 600; color: var(--fg-strong); }

    /* 太字の減圧: 短い語は太字のまま、20字を超えるものは「文の強調」なのでウェイトを落とす */
    .content strong { color: var(--fg-strong); font-weight: 700; }
    .content strong.long {
      font-weight: 400; color: var(--strong-long);
      /* 行の下側だけ塗る（下線に見えるマーカー）。折り返し行にも付ける */
      background: linear-gradient(transparent 62%, var(--strong-hl) 62%);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* 要点/詳細/意味（旧: 事実/根拠/影響/行動指針）をラベル列＋色罫のコールアウトに。
       2026-09-21 以降の長ラベル（いま起きていること 等）は 72px 列に収まらないので
       キー幅は中身に合わせ、値側が縮むようにする */
    .lbl {
      display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px;
      margin: 0 0 14px; padding: 14px 16px;
      border-left: 3px solid var(--rail, var(--border));
      border-radius: 4px;
      background: var(--callout-bg);
      background: color-mix(in srgb, var(--rail, var(--border)) 9%, var(--bg));
    }
    .lbl > .k { font-size: 11px; font-weight: 700; color: var(--rail, var(--muted)); padding-top: 4px; letter-spacing: .02em; }
    .lbl > .v { line-height: 1.75; font-size: 16px; min-width: 0; }
    .lbl > .v > :last-child { margin-bottom: 0; }
    /* 値に吸収した箇条書き・続きの段落は、地の文より詰めて「同じ話の続き」に見せる */
    .lbl > .v > ul, .lbl > .v > ol { margin: 10px 0 14px; }
    .lbl > .v > ul > li, .lbl > .v > ol > li { margin-bottom: 6px; }
    .lbl > .v > p { margin-bottom: 14px; }
    /* ラベル色は「情報の種類」。リンク青(#58a6ff)・選択青(#1f6feb)とは共用しない */
    .lbl-key    { --rail:#39c5cf; }  /* 要点 / 事実（シアン＝情報種別） */
    .lbl-detail { --rail: var(--muted-strong); }  /* 詳細 / 根拠。旧 #6e7681 は AA 未達、#8b949e は種別として沈んでいた */
    .lbl-mean   { --rail:#d29922; }  /* 意味 / 影響 */
    .lbl-act    { --rail:#3fb950; }  /* 行動指針（旧フォーマットのみ） */
    ul.lbl-list { list-style: none; padding: 0; margin: 0 0 20px; }
    ul.lbl-list > li { margin: 0; }

    /* 裸URL → 出典ドメインのチップ */
    ul.src { list-style: none; padding: 0; margin: 4px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
    ul.src > li { margin: 0; line-height: 1; }
    ul.src a {
      display: inline-block; font-size: 12px; color: var(--fg); text-decoration: none;
      background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 999px; padding: 4px 10px;
    }
    ul.src a::before { content: "↗ "; opacity: .85; }
    ul.src a:hover { color: var(--link); border-color: var(--link); text-decoration: none; }

    /* --- モバイル：ドロワー --- */
    /* z-index は topbar(40) > sidebar(30) > scrim(20)。☰ がドロワーの下に隠れないための必須条件 */
    .scrim { display: none; }
    @media (max-width: 820px) {
      #menu-btn { display: block; }
      /* モバイルは途中の階層だけ隠す。ホームと、日付の直前の名前は残す */
      .crumb-group, .crumb-sep-group { display: none; }
      .sidebar {
        position: fixed; top: var(--topbar); bottom: 0; left: 0; z-index: 30;
        transform: translateX(-100%); transition: transform .2s ease, visibility .2s;
        box-shadow: 0 0 24px var(--scrim);
        /* visibility:hidden は支援技術のツリーとヒットテストの両方から外れる。
           JS で aria-hidden を張り替えるとイベントの発火漏れで
           デスクトップにも残る事故が起きるため、CSS だけで完結させる */
        visibility: hidden;
      }
      .sidebar.open { transform: none; visibility: visible; }
      /* ⚠️ hidden 属性ではなくクラスで出し分ける。

      .scrim.show { display: block; position: fixed; inset: var(--topbar) 0 0 0; background: var(--scrim); z-index: 20; }

      .lbl > .k { padding-top: 0; }

      /* 操作子のタップ領域を44px確保する（設計書の合格条件） */
      .about-link, #expand-all, .side-src, .side-twist, .item, .month > summary,
      .cat-index-item, .cat-item > summary, .cat-month > summary, .cat-week > summary, .cat-day > summary,
      .page-nav button, .crumb-link { min-height: 44px; }
      .theme-opt { width: 44px; height: 44px; }
      .topbar-end { gap: 8px; }

      /* 畳んだ見出しがそのまま目次になる。タップ領域を44px確保する */
      .sec > summary { display: flex; margin-top: 16px; margin-bottom: 10px; padding: 10px 8px; min-height: 44px; }
      .sub > summary { padding: 11px 6px; min-height: 44px; }
      .content .sec[data-sched] .sub > ul:not(.src) > li,
      .content .sec[data-sched] .sub > ol > li,
      .content .sec[data-sched] > ul:not(.src) > li,
      .content .sec[data-sched] > ol > li {
        grid-template-columns: 3.25rem minmax(0, 1fr);
        column-gap: 10px; padding: 10px 0;
      }
      .content .sec[data-sched] .sched-b { font-size: 14px; }
    }

    /* --- 横向きのスマホ：本文の縦を優先する ---
       2段ピルを廃したのでトップバーは約45pxのまま。見出しだけ小さくする */
    @media (max-width: 900px) and (max-height: 500px) {
      .topbar { padding: 0 8px; min-height: 40px; }
      .main { padding: 14px 16px 64px; }
      .content h1, .content h1.page-when { font-size: 22px; }
      .content h2, .content h2.sec-t { font-size: 18px; font-weight: 700; }
      .content h3 { font-size: 15px; }
      .content h3.sub-t { font-size: 14px; }
      .cat-k { font-size: 13px; }
    }

    /* --- 印刷 / PDF 保存 ---
       節の展開は JS の beforeprint で行う（CSS からは details の open を変えられないため）。
       提案資料の根拠として保存する用途があるので、本文が欠けないことを最優先にする */
    @media print {
      .topbar, .sidebar, .scrim, #to-top, #banners { display: none !important; }
      .layout { display: block; height: auto; padding-top: 0; }
      .main { overflow: visible; padding: 0; }
      .content { max-width: none; }
      body { background: #fff; color: #000; }
      .content h1, .content h2, .content h3, .content h4, .content th, .content strong, .cat-k { color: #000; }
      .sec > summary::before { content: none; }        /* 開閉の三角は印刷しない */
      .content a { color: #00e; text-decoration: underline; }
      .content strong.long { background: none; font-weight: 600; }
      .lbl { border-left-color: #999; background: #f7f7f7; page-break-inside: avoid; }
      .lbl > .k { color: #000; }
      .content blockquote { color: #333; border-left-color: #999; }
      .content code { background: #eee; border-color: #999; color: #000; }

      ul.src a { color: #333; background: none; border-color: #999; }
      .content h1, .content h2, .content h3, .sec > summary { page-break-after: avoid; }
    }
  </style>

  <script>
    const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const p2 = (n) => String(n).padStart(2, '0');

    // ============ 表示モード（ライト / システム / ダーク） ============
    // head の即時スクリプトと同じキー・解決規則。ここは UI 同期と OS 変更の追従を担当する
    const THEME_KEY = 'ai-news-theme';
    const THEME_PREFS = ['light', 'system', 'dark'];

    function resolveTheme(pref) {
      if (pref === 'light' || pref === 'dark') return pref;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function readThemePref() {
      const pref = localStorage.getItem(THEME_KEY) || 'dark';
      return THEME_PREFS.includes(pref) ? pref : 'dark';
    }

    function applyTheme(pref) {
      const theme = resolveTheme(pref);
      const root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-theme-pref', pref);
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = theme;
      document.querySelectorAll('.theme-opt').forEach((btn) => {
        btn.setAttribute('aria-checked', String(btn.dataset.themeSet === pref));
      });
    }

    function setThemePref(pref) {
      if (!THEME_PREFS.includes(pref)) return;
      localStorage.setItem(THEME_KEY, pref);
      applyTheme(pref);
    }

    function initThemeControls() {
      applyTheme(readThemePref());
      document.querySelector('.theme-switch')?.addEventListener('click', (ev) => {
        const btn = ev.target.closest('.theme-opt');
        if (btn) setThemePref(btn.dataset.themeSet);
      });
      // システム選択中だけ OS の配色変更を追従する
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (readThemePref() === 'system') applyTheme('system');
      });
    }

    // 表示順は親子ツリー（今日 → 今週 → カテゴリ）。ハッシュ ID は変えない。
    const SOURCES = [
      { id: 'daily',    dir: '05_ai-news-daily',    name: '今日のまとめ', group: 'digest' },
      { id: 'weekly',   dir: '04_ai-news-weekly',   name: '今週のまとめ', group: 'digest' },
      { id: 'master',   dir: '01_ai-news-Master',   name: '開発ツール',   group: 'source' },
      { id: 'copilot',  dir: '02_ai-news-Copilot',  name: '業務 Copilot', group: 'source' },
      { id: 'industry', dir: '03_ai-news-industry', name: '市場・規制',   group: 'source' },
    ];
    const CHILD_IDS = ['master', 'copilot', 'industry'];
    const SOURCE_SUBHEAD = '元ソース';
    const CATEGORY_TITLE = 'カテゴリ別まとめ';
    const CAT_FETCH_LIMIT = 6;
    const HOME_ENTRIES = [
      { nav: 'daily', name: '今日のまとめ', hint: 'その日の差分です。1日1回見るなら、ここからで足ります。', icon: 'daily' },
      { nav: 'weekly', name: '今週のまとめ', hint: '終わった1週間の流れです。数日空いたときに開きます。', icon: 'weekly' },
      { nav: 'category', name: 'カテゴリ別まとめ', hint: '話題ごとに、これまでの更新を新しい順で辿れます。', icon: 'category' },
    ];
    const HOME_SVG = {
      mark: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.8h6.4L18.2 8.6V19a1.2 1.2 0 0 1-1.2 1.2H7.2A1.2 1.2 0 0 1 6 19V5A1.2 1.2 0 0 1 7.2 3.8H7z"/><path d="M13.2 3.9V8.6h4.7"/><path d="M9 12.6h6M9 16h4"/></svg>',
      daily: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3"/></svg>',
      weekly: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="5" rx="1.4"/><rect x="3.5" y="13" width="17" height="5" rx="1.4"/></svg>',
      category: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg>',
      link: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.7.4l2.2-2.2a4 4 0 0 0-5.7-5.6L11 7.3"/><path d="M14 10.5a4 4 0 0 0-5.7-.4L6.1 12.3a4 4 0 0 0 5.7 5.6L13 16.7"/></svg>',
    };
    // ホームの「何を集めているか」。表示名はカテゴリと揃える。取得手順は書かない。
    const HOME_STREAMS = [
      {
        name: '開発ツール',
        picks: 'Claude、ChatGPT、Gemini、GitHub Copilot、Cursor、Grok、Devin、MCP、オープンウェイト',
        kind: '公式のリリースノートと製品発表。新機能、仕様変更、提供開始',
      },
      {
        name: '業務 Copilot',
        picks: 'Microsoft 365 Copilot、Copilot Studio、Power Platform、共有リンクや監査などの管理変更',
        kind: 'Word / Excel / Teams の機能追加、ライセンス、テナントへの展開',
      },
      {
        name: '市場・規制',
        picks: 'Apple、資金調達、市場シェア、各国の規制、調査レポート',
        kind: '数字、発表日、調査の要点',
      },
    ];
    const CAT_TITLE_MAX = 80;
    // 今日／今週／カテゴリで共通の短い一文。沈黙日数は書かない。
    const PAGE_OVERVIEW = {
      home: '毎朝、下の3分野の公式更新を日本語で短くまとめています。',
      daily: '3つの元ソースを1本にまとめた、当日の差分です。',
      weekly: '直近で完了した1週間の流れと帰結です。',
      categoryIndex: '話題を選ぶと、その更新を時系列で辿れます。',
      category: 'この話題の更新を、新しい順に並べています。',
    };
    const CATEGORIES = [
      { slug: 'claude', name: 'Claude / Anthropic', blurb: 'Claude Code、Claude 製品、Anthropic 発表' },
      { slug: 'openai', name: 'ChatGPT / OpenAI', blurb: 'ChatGPT、Codex、API' },
      { slug: 'google', name: 'Gemini / Google', blurb: 'Gemini、DeepMind、Antigravity、Workspace' },
      { slug: 'github-copilot', name: 'GitHub Copilot', blurb: 'Copilot 本体・CLI・changelog' },
      { slug: 'studio', name: 'Copilot Studio / Power Platform', blurb: 'Studio、Power Platform' },
      { slug: 'm365-copilot', name: 'M365 Copilot', blurb: 'Word / Excel / Chat 等の製品更新' },
      { slug: 'm365-admin', name: 'M365 管理', blurb: '共有リンク、監査、GCC、Purview' },
      { slug: 'cursor', name: 'Cursor / xAI', blurb: 'Cursor、Devin、Grok' },
      { slug: 'mcp', name: 'MCP / エージェント標準', blurb: 'MCP、エージェント標準、A2A 相当' },
      { slug: 'open-weight', name: 'オープンウェイト', blurb: 'HF、ローカル LLM' },
      { slug: 'apple', name: 'Apple', blurb: 'Developer News、Apple Intelligence、OS' },
      { slug: 'market', name: '市場・企業', blurb: 'GTM、規制、市場データ、M&A' },
    ];
    const catOf = (slug) => CATEGORIES.find((c) => c.slug === (slug === 'xai' ? 'cursor' : slug));
    const srcOf  = (id) => SOURCES.find((s) => s.id === id) || SOURCES[0];
    // 作業ブランチが main より古いときだけ .content-main/<repo> を読む。同日の下書きは作業ツリーを優先する。
    const contentPrefix = Object.create(null);
    const baseOf = (id) => `../${contentPrefix[id] || ''}${srcOf(id).dir}/`;
    const isChildId = (id) => CHILD_IDS.includes(id);

    function publishedStamp(path) {
      const text = String(path || '');
      const day = text.match(/(\d{4}-\d{2}-\d{2})/);
      if (day) return `D${day[1]}`;
      const week = text.match(/(\d{4}).*W(\d{2})/);
      if (week) return `W${week[1]}-${week[2]}`;
      return '';
    }

    async function readFileList(url) {
      try {
        const res = await fetch(`${url}?_=${Date.now()}`);
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data) ? data : null;
      } catch {
        return null;
      }
    }

    async function resolveContentSources() {
      await Promise.all(SOURCES.map(async (s) => {
        const local = await readFileList(`../${s.dir}/files.json`);
        const mirror = await readFileList(`../.content-main/${s.dir}/files.json`);
        const localStamp = publishedStamp(local?.[0]);
        const mirrorStamp = publishedStamp(mirror?.[0]);
        contentPrefix[s.id] = mirror && mirrorStamp && (!localStamp || mirrorStamp > localStamp)
          ? '.content-main/'
          : '';
      }));
    }

    // --- 日付ユーティリティ（UTC 固定でタイムゾーン差を排除する） ---
    const dateUTC = (ymd) => new Date(ymd + 'T00:00:00Z');
    const ymdOf   = (d) => `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`;

    // ISO 週番号 → その週の月曜日
    function isoMonday(year, week) {
      const jan4 = new Date(Date.UTC(year, 0, 4)); // 1月4日は必ず第1週に含まれる
      const dow = (jan4.getUTCDay() + 6) % 7;      // 月=0
      return new Date(jan4.getTime() + (week - 1) * 7 * 86400000 - dow * 86400000);
    }

    // 日付 → ISO 週番号
    function isoWeekOf(d) {
      const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // その週の木曜へ
      const ft = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
      ft.setUTCDate(ft.getUTCDate() - ((ft.getUTCDay() + 6) % 7) + 3);
      return { year: t.getUTCFullYear(), week: 1 + Math.round((t - ft) / (7 * 86400000)) };
    }

    // 1日を含む週はその月に入れる（月曜が前月でも 1週 になる）
    function weekBucketOf(mon) {
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon.getTime() + i * 86400000);
        if (d.getUTCDate() === 1) {
          return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}`;
        }
      }
      return `${mon.getUTCFullYear()}-${p2(mon.getUTCMonth() + 1)}`;
    }

    // --- ファイルパス → 一覧エントリ ---
    // 旧実装の /ai-news-(\d{4}-\d{2}-\d{2})/ は 04（ai-news- を含まない）と
    // 05（ai-news- の直後が daily-）に一致せず、全件スキップで 0 件表示になっていた。
    const RE_DATE = /(\d{4})-(\d{2})-(\d{2})\.md$/;
    const RE_WEEK = /(?:^|\/)(\d{4})\/[^/]*W(\d{1,2})[^/]*\.md$/;

    function parseEntry(path) {
      const d = path.match(RE_DATE);
      if (d) {
        const ymd = `${d[1]}-${d[2]}-${d[3]}`;
        const dow = DAYS[dateUTC(ymd).getUTCDay()];
        return {
          kind: 'date', path, id: ymd, ymd,
          sort: `${d[1]}${d[2]}${d[3]}`, bucket: `${d[1]}-${d[2]}`,
          label: `${+d[2]}/${+d[3]} ${dow}`,
          sub: '',
          fullLabel: ymd,
        };
      }
      const w = path.match(RE_WEEK);
      if (w) {
        let year = +w[1];
        const wk = +w[2];
        let mon = isoMonday(year, wk);
        // ディレクトリ年が %G ではなく %Y だった場合の未来日を無害化する
        if (mon.getTime() > Date.now() + 14 * 86400000) mon = isoMonday(--year, wk);
        return {
          kind: 'week', path, id: `${year}-W${p2(wk)}`, y: year, wk, mon,
          sort: ymdOf(mon).replace(/-/g, ''),
          bucket: weekBucketOf(mon),
          label: `W${p2(wk)}`,
          sub: '',
          fullLabel: `${year}-W${p2(wk)}`,
        };
      }
      // 判定不能でも捨てない。捨てたことが 04/05 の無言故障の原因だった。
      const name = path.split('/').pop();
      return {
        kind: 'other', path, id: path, sort: '00000000', bucket: 'unknown',
        label: name, sub: '日付を判定できません', fullLabel: name,
      };
    }

    // --- 運用向けセクションの除去 ---
    // 改善メモ（提案台帳）と欠損ファイル通知（入力の取得失敗一覧）は運用の内容なので
    // Web では表示しない。見出しから次の `## ` までを取り除く。
    const HIDDEN_SECTIONS = [
      /^##[^\S\n]*改善メモ.*$/m,
      /^##[^\S\n]*(?:⚠️?[^\S\n]*)?欠損ファイル通知.*$/m,
    ];
    function stripHiddenSections(md) {
      for (const re of HIDDEN_SECTIONS) {
        const m = md.match(re);
        if (!m) continue;
        const rest = md.slice(m.index + m[0].length);
        const next = rest.search(/^##[^\S\n]+\S/m);
        md = md.slice(0, m.index) + (next === -1 ? '' : rest.slice(next));
      }
      return md.trimEnd();
    }

    // --- カテゴリ履歴（05 の ### を12ページに畳む。Cursor と xAI は1件） ---
    // 過去日の見出しは閉集合ではない。別名はここに足し、余った見出しは捨てる（余り箱は作らない）。
    const CAT_ALIAS = {
      'Claude / Anthropic': 'claude', 'Anthropic / Claude': 'claude', 'Claude Code': 'claude',
      'Claude Code / Anthropic': 'claude', 'Anthropic / Claude Code': 'claude', 'Anthropic': 'claude',
      'Anthropic / Claude・規制': 'claude',
      'GitHub Copilot': 'github-copilot', 'GitHub Copilot CLI': 'github-copilot',
      'Copilot Studio / Power Platform': 'studio', 'Copilot Studio': 'studio', 'Power Platform': 'studio',

    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // 今日のまとめの ### は生成時の見出しのままなので、画面上だけカテゴリの表示名に寄せる。

    const CAT_DISPLAY_MIXED = {

    function categoryDisplayTitle(raw) {
      const text = String(raw || '').replace(/\s+/g, ' ').trim();
      if (CAT_DISPLAY_MIXED[text]) return CAT_DISPLAY_MIXED[text];
      const slug = catHeadingTarget(text);
      if (!slug || slug === '*') return '';
      const name = catOf(slug)?.name || '';
      return name && name !== text ? name : '';

    function catClassifyText(text) {
      const scores = {};
      const lower = text.toLowerCase();
      for (const [slug, kws] of Object.entries(CAT_ITEM_KW)) {
        let s = 0;
        for (const kw of kws) {
          if (lower.includes(kw.toLowerCase()) || text.includes(kw)) s++;
        }
        if (s) scores[slug] = s;
      }
      const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      if (!ranked.length) return null;
      if (ranked.length > 1 && ranked[0][1] === ranked[1][1]) return null;
      return ranked[0][0];
    }
    function catSliceH2(md, title) {
      const m = md.match(new RegExp(`^##[^\\S\\n]*${escapeRe(title)}\\s*$`, 'm'));
      if (!m) return null;
      const rest = md.slice(m.index + m[0].length);
      const n = rest.search(/^##[^\S\n]+\S/m);
      return (n === -1 ? rest : rest.slice(0, n)).trim();
    }
    function catSplitH3(section) {
      const parts = section.split(/^###[^\S\n]+/m);
      const out = [];
      for (let i = 1; i < parts.length; i++) {
        const nl = parts[i].indexOf('\n');
        out.push({
          title: (nl === -1 ? parts[i] : parts[i].slice(0, nl)).trim(),
          body: nl === -1 ? '' : parts[i].slice(nl + 1).trim(),
        });
      }
      return out;
    }
    function catSplitItems(body) {
      const parts = [];

          cur = line;
        } else {

      if (cur.trim()) parts.push(cur.trim());
      return parts.filter(Boolean);

    function catParseHighlights(md) {

      if (!sec) return {};
      const map = {};
      for (const { title, body } of catSplitH3(sec)) {
        const m = title.match(/^(\d+)\s*[.．、]/);

      const bold = (text.match(/\*\*([^*]+)\*\*/) || [])[1] || '';
      const t = `${head}\n${bold}`;
      if (/沈黙/.test(t)) return true;
      if (/\d+\s*日\s*(間|連続)?[^。\n]{0,24}(据え置き|動きなし|更新なし|新規なし)/.test(t)) return true;
      if (/(据え置き|動きなし|更新なし)[^。\n]{0,24}\d+\s*日/.test(t)) return true;
      if (/最上位のまま[^。\n]{0,28}(据え置き|動きなし|新規なし|新規はな)/.test(t)) return true;
      // 「〜の新規はない／新規告知なし」など、更新不在そのものが主題の報告
      if (/(新規はな[いい]|新規なし|新規告知はな|新規は無[いい]|動きなし)/.test(t)
          && !/(新機能|新規モデル|新規リリース|新規発表|新規対応|新規追加)/.test(t)) {
        return true;
      }
      return false;
    }

    function extractCategoryDay(md, slug) {
      const catSec = catSliceH2(md, CATEGORY_TITLE);
      const hlMap = catParseHighlights(md);
      const usedHl = new Set();
      const chunks = [];
      if (catSec) {
        for (const { title, body } of catSplitH3(catSec)) {
          const target = catHeadingTarget(title);
          const pieces = [];
          if (target === slug) {
            for (const item of catSplitItems(body)) pieces.push(item);
          } else if (target === '*') {
            for (const item of catSplitItems(body)) {
              if (catClassifyText(item) === slug) pieces.push(item);
            }
          }
          for (const p of pieces) {
            for (const n of catHlRefs(p)) usedHl.add(n);
            if (p.trim()) chunks.push(p.trim());
          }
        }
      }
      const highlights = [];
      for (const n of usedHl) {
        if (hlMap[n]) highlights.push(hlMap[n]);
      }
      for (const [n, block] of Object.entries(hlMap)) {
        if (usedHl.has(n)) continue;
        if (catClassifyText(block) === slug) highlights.push(block);
      }
      const hl = highlights.filter((b) => !isSilenceReport(b));
      const items = chunks.filter((c) => !isSilenceReport(c));
      if (!hl.length && !items.length) return null;
      return { highlights: hl, items };

    function parseHash() {

      if (!raw || raw === 'home') return { sourceId: 'home', entryId: null, categorySlug: null };
      const i = raw.indexOf('/');
      const sourcePart = i === -1 ? raw : raw.slice(0, i);

      if (!source) return { sourceId: null, entryId: null, categorySlug: null };
      const entryId = i === -1 ? null : decodeURIComponent(raw.slice(i + 1));
      return { sourceId: source.id, entryId: entryId || null, categorySlug: null };
    }

    async function loadIndex(sourceId, preferId) {

      const res = await fetch(`${base}files.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`files.json の取得に失敗しました (HTTP ${res.status})`);
      const files = await res.json();
      if (my !== state.token) return; // 連打時の競合ガード

      // files.json の並び順に依存せず、必ず日付降順にする
      let entries = files.map(parseEntry).sort((a, b) => (a.sort < b.sort ? 1 : a.sort > b.sort ? -1 : 0));

    // JST で今日を求める（kit は日本時間で生活している）
    function todayJST() {
      const now = new Date(Date.now() + 9 * 3600000);
      return `${now.getUTCFullYear()}-${p2(now.getUTCMonth() + 1)}-${p2(now.getUTCDate())}`;
    }

    function badgeOf(e) {
      const today = todayJST();
      if (e.kind === 'date') return e.ymd === today ? { cls: 'b-today', text: '今日' } : null;
      if (e.kind === 'week') {
        const cur = isoWeekOf(dateUTC(today));
        if (cur.year !== e.y || cur.week !== e.wk) return null;
        // 週の途中なら「途中」と明示する（完結した週と区別する）
        const sun = new Date(e.mon.getTime() + 6 * 86400000);
        return dateUTC(today) < sun ? { cls: 'b-part', text: '今週(途中)' } : { cls: 'b-week', text: '今週' };
      }
      return null;
    }

    function utcMonday(ymd) {
      const d = dateUTC(ymd);

      return new Date(d.getTime() - dow * 86400000);
    }
    function sideWeekLabel(mon, bucket) {
      const firstYmd = bucket && bucket !== 'unknown' ? `${bucket}-01` : ymdOf(mon);

      const sun = new Date(mon.getTime() + 6 * 86400000);
