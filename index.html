    function catDayPieces(extracted) {
      if (!extracted) return [];
      return [
        ...extracted.highlights.map((md) => ({ kind: 'hl', md })),
        ...extracted.items.map((md) => ({ kind: 'item', md })),
      ].filter((p) => !isSilenceReport(p.md));
    }

    function renderCategoryTimeline(focusId) {
      const cat = catOf(state.categorySlug);
      if (!cat || !state.entries.length) return;
      const want = (focusId && state.entries.some((x) => x.id === focusId))
        ? focusId
        : (state.activeId && state.entries.some((x) => x.id === state.activeId)
          ? state.activeId
          : state.entries[0].id);
      state.activeId = want;
      markActive();
      writeHash('category', want);
      syncBreadcrumb();

      const host = document.createElement('div');
      host.className = 'cat-timeline page-body';
      const months = new Map();
      let total = 0;
      for (const e of state.entries) {
        const pieces = catDayPieces(state.catExtracted[e.id]);
        if (!pieces.length || !e.ymd) continue;
        const bucket = e.ymd.slice(0, 7);
        if (!months.has(bucket)) months.set(bucket, []);
        months.get(bucket).push({ e, pieces });
        total += pieces.length;
      }
      const expand = wantExpandAll();
      let firstMonth = true;
      for (const [bucket, days] of months) {
        const month = document.createElement('details');
        month.className = 'cat-month';
        const containsFocus = days.some((d) => d.e.id === want);
        month.open = expand || firstMonth || containsFocus;
        firstMonth = false;
        const sum = document.createElement('summary');
        const label = document.createElement('span');
        label.className = 'cat-month-label';
        label.textContent = `${bucket.slice(0, 4)}年${+bucket.slice(5)}月`;
        const count = document.createElement('span');
        count.className = 'm-count';
        count.textContent = `${days.length}日`;
        sum.append(label, count);
        const box = document.createElement('div');
        box.className = 'cat-month-days';
        let week = null;
        let weekDays = null;
        let weekCount = null;
        let lastWeek = '';
        for (const { e, pieces } of days) {
          const mon = utcMonday(e.ymd);
          const weekKey = ymdOf(mon);
          if (weekKey !== lastWeek) {
            lastWeek = weekKey;
            week = document.createElement('details');
            week.className = 'cat-week';
            const sum = document.createElement('summary');
            const label = document.createElement('span');
            label.className = 'cat-week-label';
            label.textContent = sideWeekLabel(mon, bucket);
            const range = document.createElement('span');
            range.className = 'cat-week-range';
            range.textContent = weekRangeLabel(mon);
            weekCount = document.createElement('span');
            weekCount.className = 'm-count';
            weekCount.dataset.n = '0';
            sum.append(label, range, weekCount);
            weekDays = document.createElement('div');
            weekDays.className = 'cat-week-days';
            week.append(sum, weekDays);
            const thisWeek = week;
            const theseDays = weekDays;
            thisWeek.addEventListener('toggle', (ev) => {
              if (!thisWeek.open || !ev.isTrusted) return;
              for (const day of theseDays.querySelectorAll('.cat-day')) day.open = true;
            });
            box.appendChild(week);
          }
          weekCount.dataset.n = String(+weekCount.dataset.n + 1);
          weekCount.textContent = `${weekCount.dataset.n}日`;
          if (expand || e.id === want) week.open = true;
          const day = document.createElement('details');
          day.className = 'cat-day';
          day.id = `cat-day-${e.id}`;
          day.dataset.day = e.id;
          day.open = expand || e.id === want;
          if (e.id === want) day.classList.add('is-focus');
          const daySum = document.createElement('summary');
          const h = document.createElement('h2');
          h.className = 'cat-day-when';
          const dow = dateUTC(e.ymd).getUTCDay();
          if (dow === 0) h.classList.add('dow-sun');
          else if (dow === 6) h.classList.add('dow-sat');
          h.textContent = formatEntryWhen(e);
          daySum.appendChild(h);
          const body = document.createElement('div');
          body.className = 'cat-day-body';
          for (const p of pieces) body.appendChild(catPieceNode(p));
          day.append(daySum, body);
          weekDays.appendChild(day);
        }
        for (const openWeek of box.querySelectorAll('.cat-week[open]')) {
          for (const day of openWeek.querySelectorAll('.cat-day')) day.open = true;
        }
        month.append(sum, box);
        host.appendChild(month);
      }

      mountPage($('#content'), {
        context: CATEGORY_TITLE,
        when: cat.name,
        overview: PAGE_OVERVIEW.category,
        meta: total ? `更新 ${total}件` : 'この話題の更新はまだありません',
        body: host,
      });
      const target = document.getElementById(`cat-day-${want}`);
      if (target && focusId && focusId !== state.entries[0]?.id) {
        target.scrollIntoView({ block: 'start', behavior: 'auto' });
      } else {
        $('.main').scrollTop = 0;
      }
      syncExpandBtn();
    }

    function focusCategoryDay(id) {
      if (!state.entries.some((x) => x.id === id)) return;
      const el = document.getElementById(`cat-day-${id}`);
      if (el && state.categorySlug && $('#content').querySelector('.cat-timeline')) {
        state.activeId = id;
        markActive();
        writeHash('category', id);
        syncBreadcrumb();
        for (const d of $('#content').querySelectorAll('.cat-day.is-focus')) d.classList.remove('is-focus');
        el.classList.add('is-focus');
        const month = el.closest('.cat-month');
        if (month) month.open = true;
        const week = el.closest('.cat-week');
        if (week) {
          const wasOpen = week.open;
          week.open = true;
          if (!wasOpen) {
            for (const day of week.querySelectorAll('.cat-day')) day.open = true;
          }
        }
        el.open = true;
        el.scrollIntoView({ block: 'start', behavior: 'smooth' });
        return;
      }
      renderCategoryTimeline(id);
    }

    async function loadCategory(slug, preferDay) {
      const cat = catOf(slug);
      if (!cat) {
        showCategoryIndex();
        return;
      }
      slug = cat.slug;
      const my = ++state.token;
      state.navFocus = 'category';
      state.categorySlug = slug;
      state.weekFilter = null;
      state.sourceId = 'daily';
      state.entries = [];
      state.activeId = null;
      state.catExtracted = {};
      openTree('category');
      clearJumpSpacer();
      renderSourceTree();
      renderList();
      $('#warn').hidden = true;
      syncTopbarHeight();
      writeHash('category', null);
      if (isMobile()) setDrawer(false);

      const box = $('#content');
      mountPage(box, {
        context: CATEGORY_TITLE,
        when: cat.name,
        overview: PAGE_OVERVIEW.category,
        meta: '日次からこの話題の更新を集めています',
      });

      const setMeta = (text) => {
        const el = box.querySelector('.page-meta');
        if (el) el.textContent = text;
      };
      const setWhen = (text) => {
        const el = box.querySelector('h1.page-when');
        if (el) el.textContent = text;
      };

      const res = await fetch(`${baseOf('daily')}files.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`files.json の取得に失敗しました (HTTP ${res.status})`);
      const files = await res.json();
      if (my !== state.token) return;

      const days = files.map(parseEntry).filter((e) => e.kind === 'date')
        .sort((a, b) => (a.sort < b.sort ? 1 : a.sort > b.sort ? -1 : 0));
      if (!days.length) {
        setWhen(cat.name);
        setMeta('この話題の更新はまだありません');
        return;
      }
      const pending = new Array(days.length).fill(null);
      let nextFlush = 0;
      let failed = 0;
      const found = [];

      const maybeShow = () => {
        if (state.activeId) return;
        if (!found.length) return;
        if (preferDay && found.some((e) => e.id === preferDay)) renderCategoryTimeline(preferDay);
        else if (!preferDay) renderCategoryTimeline(found[0].id);
      };

      const flush = () => {
        while (nextFlush < pending.length && pending[nextFlush] !== null) {
          const row = pending[nextFlush++];
          if (!row) continue;
          found.push(row.entry);
          state.catExtracted[row.entry.id] = row.extracted;
          state.entries = found.slice();
          renderList();
          maybeShow();
          if (!state.activeId) {
            setMeta(`${found.length}日分を確認… ${nextFlush}/${days.length}`);
          }
        }
        if (nextFlush < days.length && !found.length) {
          setMeta(`読み込み中… ${nextFlush}/${days.length}`);
        }
      };

      let cursor = 0;
      const worker = async () => {
        while (cursor < days.length) {
          const i = cursor++;
          const e = days[i];
          try {
            const url = baseOf('daily') + e.path;
            let md = mdCache.get(url);
            if (md === undefined) {
              const r = await fetch(url);
              if (!r.ok) throw new Error(String(r.status));
              md = stripHiddenSections(await r.text());
              mdCache.set(url, md);
            }
            if (my !== state.token) return;
            const extracted = extractCategoryDay(md, slug);
            pending[i] = extracted ? { entry: e, extracted } : false;
          } catch (err) {
            console.warn('カテゴリ日の取得に失敗:', e.id, err);
            failed++;
            pending[i] = false;
          }
          if (my !== state.token) return;
          flush();
        }
      };

      await Promise.all(Array.from({ length: Math.min(CAT_FETCH_LIMIT, days.length) }, worker));
      if (my !== state.token) return;

      if (!found.length) {
        setWhen(cat.name);
        setMeta('この話題の更新はまだありません');
        syncBreadcrumb();
        return;
      }
      if (failed) showWarn(`${failed} 日分の取得に失敗したため、一覧から省いています。`);
      if (preferDay && !found.some((e) => e.id === preferDay)) {
        showWarn(`指定の日付（${preferDay}）にはこのカテゴリの項目がありません。最新を表示します。`);
      }
      // 初回描画は entries が1件のときがあり、完了後に同じ日を描き直す。
      const showId = (preferDay && found.some((e) => e.id === preferDay))
        ? preferDay
        : (state.activeId && found.some((e) => e.id === state.activeId) ? state.activeId : found[0].id);
      renderCategoryTimeline(showId);
      syncExpandBtn();
    }

    function beginLoad(sourceId, preferId) {
      state.sourceId = sourceId;
      state.categorySlug = null;
      state.catExtracted = {};
      clearJumpSpacer();
      renderSourceTree();
      $('#warn').hidden = true;
      syncTopbarHeight();
      $('#content').innerHTML = '<div class="empty">読み込み中…</div>';
      writeHash(sourceId, null);
      loadIndex(sourceId, preferId).catch((e) => showFatal(String(e.message || e)));
    }

    function sameWeekFilter(a, b) {
      if (!a && !b) return true;
      if (!a || !b) return false;
      return a.start === b.start && a.end === b.end;
    }

    function navigate(navFocus, from, slug) {
      if (navFocus === 'home') {
        showHome();
        return;
      }

      if (navFocus === 'daily') {
        const fromCat = state.navFocus === 'category' || !!state.categorySlug;
        const fromHome = state.navFocus === 'home';
        state.navFocus = 'daily';
        state.weekFilter = null;
        state.categorySlug = null;
        openTree('daily');
        if (state.sourceId === 'daily' && !fromCat && !fromHome) {
          $('#warn').hidden = true;
          syncTopbarHeight();
          clearJumpSpacer();
          renderSourceTree();
          applySectionOpen($('#content'));
          $('.main').scrollTop = 0;
          return;
        }
        beginLoad('daily');
        return;
      }

      if (navFocus === 'weekly') {
        const fromHome = state.navFocus === 'home';
        state.navFocus = 'weekly';
        state.weekFilter = null;
        state.categorySlug = null;
        openTree('weekly');
        if (state.sourceId === 'weekly' && !fromHome) {
          $('#warn').hidden = true;
          syncTopbarHeight();
          clearJumpSpacer();
          renderSourceTree();
          applySectionOpen($('#content'));
          $('.main').scrollTop = 0;
          return;
        }
        beginLoad('weekly');
        return;
      }

      if (navFocus === 'category') {
        openTree('category');
        showCategoryIndex();
        return;
      }

      if (navFocus === 'cat') {
        if (!slug || !catOf(slug)) {
          openTree('category');
          showCategoryIndex();
          return;
        }
        openTree('category');
        if (state.categorySlug === slug) {
          $('.main').scrollTop = 0;
          if (isMobile()) setDrawer(false);
          return;
        }
        loadCategory(slug).catch((e) => showFatal(String(e.message || e)));
        return;
      }

      if (!isChildId(navFocus)) return;

      const wantWeekly = from === 'weekly';
      openTree(wantWeekly ? 'weekly' : 'daily');
      const nextFilter = wantWeekly ? currentWeekRange() : null;
      if (
        state.sourceId === navFocus &&
        state.navFocus === navFocus &&
        !state.categorySlug &&
        sameWeekFilter(state.weekFilter, nextFilter)
      ) return;

      state.navFocus = navFocus;
      state.weekFilter = nextFilter;
      state.categorySlug = null;
      // 今週の子は週次 ID を preferId に渡さない。絞り込みは loadIndex 内の weekFilter。
      beginLoad(navFocus, wantWeekly ? undefined : currentDayId());
    }

    // トップバーの高さは固定値にできない。実測して CSS 変数に反映する。
    // バナー（0〜2本）とトップバーの高さを測り、本文・サイドバー・スクリムの
    // 上端をまとめて押し下げる。--topbar は .layout / .sidebar / .scrim が参照する
    function syncTopbarHeight() {
      const bh = $('#banners').offsetHeight;
      document.documentElement.style.setProperty('--banner-h', bh + 'px');
      const h = document.querySelector('.topbar').offsetHeight;
      if (h) document.documentElement.style.setProperty('--topbar', (h + bh) + 'px');
    }

    const isMobile = () => window.matchMedia('(max-width: 820px)').matches;

    // ドロワーの開閉。支援技術に状態を伝え、フォーカスも移す（2026-07-27 の指摘 3-2）
    let drawerOpener = null;

    function setDrawer(open) {
      const sb = $('#sidebar');
      sb.classList.toggle('open', open);
      $('#scrim').classList.toggle('show', open);
      $('#menu-btn').setAttribute('aria-expanded', String(open));
      // 一覧の露出は CSS の visibility が制御する（aria-hidden は使わない）

      if (open) {
        drawerOpener = document.activeElement;
        (sb.querySelector('.item.is-active') || sb.querySelector('.item'))?.focus();
      } else if (drawerOpener) {
        drawerOpener.focus();
        drawerOpener = null;
      }
    }

    async function boot() {
      try { await resolveContentSources(); } catch (err) { console.warn('掲載ミラーの選択に失敗:', err); }
      const { sourceId, entryId, categorySlug } = parseHash();
      if (sourceId === 'category') {
        state.navFocus = 'category';
        state.categorySlug = categorySlug;
        state.sourceId = 'daily';
      } else if (sourceId) {
        state.sourceId = sourceId;
        state.navFocus = sourceId;
      }
      openTree(navParent());
      initThemeControls();
      renderSourceTree();

      // イベント委譲。要素を作り直しても listener を張り直さなくてよい
      $('#home-brand').addEventListener('click', () => navigate('home'));
      $('#crumb').addEventListener('click', (ev) => {
        const back = ev.target.closest('.crumb-link');
        if (back && back.dataset.crumb === 'home') navigate('home');
      });
      $('#source-tree').addEventListener('click', (ev) => {
        const twist = ev.target.closest('.side-twist');
        if (twist && twist.dataset.twist) {
          toggleTree(twist.dataset.twist);
          return;
        }
        const b = ev.target.closest('.side-src');
        if (b) navigate(b.dataset.nav, b.dataset.from, b.dataset.slug);
      });
      $('#content').addEventListener('click', (ev) => {
        const home = ev.target.closest('.home-entry');
        if (home && home.dataset.nav) {
          navigate(home.dataset.nav);
          if (isMobile()) setDrawer(false);
          return;
        }
        const b = ev.target.closest('.cat-index-item');
        if (b && b.dataset.slug) {
          loadCategory(b.dataset.slug).catch((e) => showFatal(String(e.message || e)));
        }
      });
      $('#file-list').addEventListener('click', (ev) => {
        const btn = ev.target.closest('.item');
        if (!btn) return;
        selectEntry(btn.dataset.id).catch((e) => showFatal(String(e.message || e)));
        if (isMobile()) setDrawer(false);
      });

      $('#menu-btn').addEventListener('click', () => setDrawer(!$('#sidebar').classList.contains('open')));
      $('#scrim').addEventListener('click', () => setDrawer(false));
      $('#expand-all').addEventListener('click', toggleExpandAll);
      // 個別に節を開閉したときもボタンの表示を合わせる。
      // details の toggle イベントはバブルしないので capture で受ける
      $('#content').addEventListener('toggle', syncExpandBtn, true);
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && $('#sidebar').classList.contains('open')) setDrawer(false);
      });
      // resize と matchMedia の両方から張り直す（片方が発火しない環境への保険）
      window.addEventListener('resize', syncTopbarHeight);
      syncExpandBtn();

      // 印刷・PDF保存のときは畳んだ節を一時的に全部開く。
      // CSS からは details の open を変えられないので JS で行い、印刷後に元へ戻す
      let printClosed = [];
      window.addEventListener('beforeprint', () => {
        printClosed = [...document.querySelectorAll('details.sec:not([open]), details.sub:not([open]), details.month:not([open]), details.cat-month:not([open]), details.cat-week:not([open]), details.cat-day:not([open])')];
        printClosed.forEach((d) => { d.open = true; });
      });
      window.addEventListener('afterprint', () => {
        printClosed.forEach((d) => { d.open = false; });
        printClosed = [];
      });

      // 先頭へ戻る（モバイルで最大29画面スクロールするため）
      const main = $('.main');
      const toTop = $('#to-top');
      toTop.addEventListener('click', () => main.scrollTo({ top: 0, behavior: 'smooth' }));
      main.addEventListener('scroll', () => toTop.classList.toggle('show', main.scrollTop > 600), { passive: true });

      let lastDay = todayJST();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && todayJST() !== lastDay) {
          lastDay = todayJST();
          renderList();
          markActive();
        }
      });

      if (sourceId === 'category') {
        if (categorySlug) {
          loadCategory(categorySlug, entryId).catch((e) => showFatal(String(e.message || e)));
        } else {
          showCategoryIndex();
        }
      } else if (sourceId === 'home' || !sourceId) {
        showHome();
      } else {
        loadIndex(state.sourceId, entryId).catch((e) => showFatal(String(e.message || e)));
      }
    }

    // Node からパーサだけを検証できるようブラウザ判定で囲む
    if (typeof window !== 'undefined') {
      window.addEventListener('error', (e) => showFatal(e.message));
      window.addEventListener('unhandledrejection', (e) => showFatal(String(e.reason)));
      try { boot(); } catch (e) { showFatal(String(e)); }
    }
  </script>
</body>
</html>
