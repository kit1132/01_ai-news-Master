<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ダーク固定の配色なので OS 側にもそう伝える。
       未宣言だと OS がライトモードのときスクロールバーやフォーム部品だけ明色で描画される -->
  <meta name="color-scheme" content="dark">
  <title>AI News</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
          integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
          crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg:#0d1117; --panel:#161b22; --border:#30363d; --border2:#21262d;
      --fg:#c9d1d9; --fg-strong:#f0f6fc; --muted:#8b949e; --link:#58a6ff;
      --accent:#1f6feb; --side:260px;
      --topbar:78px;   /* 実際の高さは JS で測って上書きする */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: var(--bg); color: var(--fg);
    }

    /* --- 通知帯 --- */
    /* ⚠️ 位置決めはラッパー側に持たせる。個々の .banner を fixed にすると
       #fatal と #warn が同じ top:0 で完全に重なり、後から出る #warn が
       **再読み込みボタンを持つ #fatal を隠す**（375px 実測・両方とも高さ59px）。
       さらにバナーはトップバーの上に乗るため、モバイルでは ☰（y 23〜57px）が
       押せなくなり、日付ドロワーを開く手段が無くなる。 */
    #banners { position: fixed; top: 0; left: 0; right: 0; z-index: 99; }
    .banner {
      padding: 10px 14px; font-size: 13px; line-height: 1.5;
    }
    .b-err  { background: #da3633; color: #fff; }
    .b-warn { background: #9e6a03; color: #fff; }
    .banner button {
      margin-left: 10px; background: #0003; color: inherit;
      border: 1px solid #fff6; border-radius: 5px; padding: 3px 9px; cursor: pointer; font: inherit;
    }

    /* --- トップバー（2段：まとめ / 元ソース） --- */
    .topbar {
      /* バナーが出ている間はその下へ退避する（--banner-h は syncTopbarHeight が測る） */
      position: fixed; top: var(--banner-h, 0px); left: 0; right: 0; z-index: 40;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    }
    #menu-btn {
      display: none; background: none; border: 1px solid var(--border); color: var(--fg);
      /* 44px はタップ領域の下限。モバイルで他の日付へ行く唯一の入口なのに 34px だった。
         トップバーの内寸はピル2段（29px×2 + gap 6px = 64px）で既に 44px を超えているので
         バーの高さは変わらない。デスクトップでは display:none なので影響しない */
      border-radius: 6px; width: 44px; height: 44px; font-size: 16px; cursor: pointer; flex: none;
    }
    .brand { font-size: 11px; color: #6e7681; letter-spacing: .12em; white-space: nowrap; flex: none; }
    .groups { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .grp { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .glabel { font-size: 10px; color: #6e7681; flex: none; width: 46px; text-align: right; letter-spacing: .04em; }
    .pills { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--border2); border: 1px solid var(--border); color: var(--fg);
      font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
      flex: none; white-space: nowrap; line-height: 1.4;
    }
    .pill:hover { border-color: var(--muted); }
    .pill[aria-current="true"] { background: #1f6feb33; border-color: var(--accent); color: var(--link); font-weight: 600; }

    /* 節の一括開閉。折りたたみで本文がページ内検索に出ない問題の回避手段も兼ねる */
    .main-tools {
      max-width: 760px; margin: 0 auto 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    /* 折りたたむ節が無い日に消すのは「すべて開く」ボタンだけ。
       以前はこの行ごと（.main-tools）消していたが、概要リンクを同居させたため
       節が無い日にリンクまで消えてしまう。`display:inline-flex` があるので
       hidden 属性ではなくクラスで制御する */
    #expand-all.hide { display: none; }
    .about-link {
      color: var(--muted); text-decoration: none; font-size: 12px;
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px;
      min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap; flex: none;
    }
    .about-link:hover, .about-link:focus-visible { color: var(--link); background: var(--border2); }
    #expand-all {
      background: var(--border2); border: 1px solid var(--border); color: var(--fg);
      font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
      min-height: 36px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
    }
    /* 押すとどちらへ向かうかを三角で示す。閉じている状態＝これから開く＝▼ */
    #expand-all::before { content: "▼"; font-size: 9px; color: var(--muted); }
    #expand-all[aria-pressed="true"]::before { content: "▲"; color: var(--link); }
    #expand-all[aria-pressed="true"] { background: #1f6feb33; border-color: var(--accent); color: var(--link); }
    #expand-all:hover { border-color: var(--muted); }

    /* --- レイアウト --- */
    .layout { display: flex; height: 100dvh; padding-top: var(--topbar); }
    .sidebar {
      width: var(--side); min-width: var(--side); background: var(--panel);
      border-right: 1px solid var(--border); overflow-y: auto;
    }
    .main { flex: 1; overflow-y: auto; padding: 30px 32px 80px; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 15px; }

    /* --- 月アコーディオン --- */
    #file-list { padding: 6px; }
    .month > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
      padding: 9px 10px; border-radius: 6px; font-size: 12px; color: var(--muted);
      position: sticky; top: 0; background: var(--panel); z-index: 1;
    }
    .month > summary::-webkit-details-marker { display: none; }
    .month > summary:hover { background: var(--border2); }
    .chev { display: inline-block; transition: transform .15s; color: var(--muted); }
    .month[open] > summary .chev { transform: rotate(90deg); }
    .m-label { font-weight: 600; }
    .m-count { margin-left: auto; font-size: 11px; color: var(--muted); }

    /* 入れ子 ul に padding が二重に付かないよう .items だけで完結させる */
    .items { list-style: none; padding: 0 0 6px 0; margin: 0; }
    .item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: none; border: none; color: var(--fg); font: inherit;
      padding: 9px 12px; border-radius: 6px; cursor: pointer;
    }
    .item:hover { background: var(--border2); }
    .item.is-active { background: #1f6feb33; color: var(--link); font-weight: 600; }
    .i-body { display: flex; flex-direction: column; min-width: 0; }
    .i-title { font-size: 14px; }
    .i-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
    .b-today { background: #238636; color: #fff; }
    .b-week  { background: #1f6feb; color: #fff; }
    .b-part  { background: #30363d; color: #c9d1d9; }

    /* --- 本文 --- */
    .content { max-width: 760px; margin: 0 auto; }

    .content h1 { font-size: 30px; line-height: 1.35; color: var(--fg-strong); letter-spacing: .01em; margin-bottom: 6px; }
    /* 節見出し。節が1つ以下で折りたたみが適用されないファイルでも同じ見え方にする */
    .content h2 {
      font-size: 16px; font-weight: 700; color: var(--fg-strong); letter-spacing: .02em; line-height: 1.4;
      margin-top: 44px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
      border-left: 3px solid var(--accent); padding: 2px 0 2px 10px;
    }
    .content h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .content h3 { font-size: 20px; line-height: 1.55; color: var(--fg-strong); font-weight: 700; margin-top: 34px; margin-bottom: 14px; }
    .content h4 { font-size: 15px; color: #e6edf3; margin-top: 22px; margin-bottom: 8px; }
    .content p  { line-height: 1.9; margin-bottom: 20px; font-size: 15px; }
    .content ul, .content ol { padding-left: 20px; margin-bottom: 20px; }
    .content li { line-height: 1.9; margin-bottom: 8px; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .content a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
    .content a:hover { text-decoration: underline; }
    /* `code` の既定 monospace は、日本語が混じると環境によって明朝系へフォールバックし、
       本文（ゴシック）と書体が混在する（2026-07-31 実測: 日本語入り code が8箇所あった）。
       欧文は等幅のまま、CJK だけ確実にゴシックへ落とす順序で指定する */
    .content code, .content pre, .content kbd, .content samp {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono",
                   "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", sans-serif;
    }
    .content code { background: var(--panel); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #e6edf3; }
    .content pre { background: var(--panel); padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 20px; }
    .content pre code { background: none; padding: 0; }
    .content em { color: var(--muted); }
    .content blockquote { border-left: 2px solid var(--border); padding-left: 14px; color: var(--muted); margin: 0 0 24px; font-size: 13px; line-height: 1.8; }
    .content table { border-collapse: collapse; margin: 18px 0; display: block; overflow-x: auto; }
    .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .content th { background: var(--panel); color: var(--fg-strong); }
    .content img { max-width: 100%; height: auto; }

    /* --- `## セクション` の折りたたみ --- */
    /* h2 は summary の「中に」入る（置き換えない）。押せることと節の始まりを視覚的に示す */
    .sec > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
      margin-top: 44px; margin-bottom: 18px; border-radius: 0 6px 6px 0;
      /* 左のアクセントバーで節の始まりを明示する */
      border-left: 3px solid var(--accent); padding: 2px 0 2px 10px;
    }
    .sec > summary::-webkit-details-marker { display: none; }
    .sec > summary::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    /* 節見出しは h2 要素のまま summary の中に入っている（見出し階層を壊さないため）。
       `.content h2`（特異性 0,1,1）に勝つ必要があるので `.content h2.sec-t` で指定する */
    .content h2.sec-t {
      font-size: 16px; font-weight: 700; color: var(--fg-strong); line-height: 1.4;
      letter-spacing: .02em; margin: 0; padding: 0; border: none; display: block;
      /* ⚠️ 折り返す。以前は nowrap + ellipsis で1行に収めていたが、既定表示は
         「先頭節のみ開」なので**畳んだ見出しの列がそのまま目次**になる。
         375px 実測（2026-07-31）で5節が省略されており、`Microsoft 365 Copilot /
         Copilot Studio` は31px 欠けていた。title 属性も無いため全文を得る手段が無く、
         @media print も white-space を戻していないので PDF でも切れていた。
         overflow:hidden だけ残すのは、フレックス項目の自動最小サイズを0に保ち
         summary を押し広げないため。高さは auto なので行が増えても欠けない */
      overflow: hidden;
    }
    .content h2.sec-t::after { content: none; } /* h2 側の罫線は summary 側に任せる */
    .sec-n { font-size: 11px; font-weight: 400; color: var(--muted); flex: none; }
    /* 開閉の三角は全幅で出す。デスクトップで出していなかったため、
       節が畳まれていても「押せる」ことが分からなかった */
    .sec > summary::before {
      content: "▶"; font-size: 10px; color: var(--muted); flex: none;
      transition: transform .15s; display: inline-block; width: 1em; text-align: center;
    }
    .sec[open] > summary::before { transform: rotate(90deg); }
    .sec > summary:hover .sec-t { color: var(--link); }
    .sec > summary:hover::before { color: var(--link); }

    /* --- 先頭へ戻る（画面幅によらず、スクロールしたときだけ出す） --- */
    #to-top {
      display: none; position: fixed; right: 18px; bottom: 20px; z-index: 45;
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border); color: var(--fg);
      font-size: 17px; line-height: 1; box-shadow: 0 3px 12px #0007;
    }
    #to-top.show { display: block; }
    #to-top:hover { border-color: var(--muted); }
    #to-top:active { background: var(--border2); }

    /* 導入段落はリード文として落ち着かせる */
    .content .lede {
      color: var(--muted); font-size: 14px; line-height: 1.9;
      margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }

    /* 見出しの「— 含意」側を落として、タイトルを相対的に立てる。
       h3 は既に 700 なのでタイトル側を太くする余地がない（decorateHeadings 参照） */
    .content h3 .h3-sub {
      font-weight: 400; color: var(--muted); font-size: .82em; letter-spacing: 0;
    }

    /* 箇条書きは逆に、タイトル側を太くする（li の基本ウェイトは 400 なので余地がある）。
       `**ラベル**:` 形式は strong が担当するので、ここでは太字を重ねない（decorateListTitles 参照） */
    .content li .li-title, .content li > p > .li-title { font-weight: 600; color: var(--fg-strong); }

    /* 太字の減圧: 短い語は太字のまま、20字を超えるものは「文の強調」なのでウェイトを落とす */
    .content strong { color: var(--fg-strong); font-weight: 700; }
    .content strong.long {
      font-weight: 400; color: #dfe7ef;
      background: linear-gradient(transparent 62%, #1f6feb2e 62%);
    }

    /* 要点/詳細/意味（旧: 事実/根拠/影響/行動指針）をラベル列＋色罫に組み替える */
    .lbl {
      display: grid; grid-template-columns: 72px 1fr; gap: 14px;
      margin: 0 0 16px; padding-left: 12px; border-left: 2px solid var(--rail, var(--border));
    }
    .lbl > .k { font-size: 11px; font-weight: 700; color: var(--rail, var(--muted)); padding-top: 5px; letter-spacing: .06em; }
    .lbl > .v { line-height: 1.9; font-size: 15px; min-width: 0; }
    .lbl > .v > :last-child { margin-bottom: 0; }
    /* 値に吸収した箇条書き・続きの段落は、地の文より詰めて「同じ話の続き」に見せる */
    .lbl > .v > ul, .lbl > .v > ol { margin: 10px 0 14px; }
    .lbl > .v > ul > li, .lbl > .v > ol > li { margin-bottom: 6px; }
    .lbl > .v > p { margin-bottom: 14px; }
    .lbl-key    { --rail:#58a6ff; }  /* 要点 / 事実 */
    .lbl-detail { --rail:#8b949e; }  /* 詳細 / 根拠。#6e7681 は 4.12:1 で AA 未達だった */
    .lbl-mean   { --rail:#d29922; }  /* 意味 / 影響 */
    .lbl-act    { --rail:#3fb950; }  /* 行動指針（旧フォーマットのみ） */
    ul.lbl-list { list-style: none; padding: 0; margin: 0 0 20px; }
    ul.lbl-list > li { margin: 0; }

    /* 裸URL → 出典ドメインのチップ */
    ul.src { list-style: none; padding: 0; margin: 4px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
    ul.src > li { margin: 0; line-height: 1; }
    ul.src a {
      display: inline-block; font-size: 11px; color: var(--muted); text-decoration: none;
      background: var(--border2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
    }
    ul.src a::before { content: "↗ "; opacity: .5; }
    ul.src a:hover { color: var(--link); border-color: var(--link); text-decoration: none; }

    /* --- モバイル：ドロワー --- */
    /* z-index は topbar(40) > sidebar(30) > scrim(20)。☰ がドロワーの下に隠れないための必須条件 */
    .scrim { display: none; }
    @media (max-width: 820px) {
      #menu-btn { display: block; }
      .brand { display: none; }
      .glabel { width: 40px; font-size: 9px; }
      .sidebar {
        position: fixed; top: var(--topbar); bottom: 0; left: 0; z-index: 30;
        transform: translateX(-100%); transition: transform .2s ease, visibility .2s;
        box-shadow: 0 0 24px #0008;
        /* visibility:hidden は支援技術のツリーとヒットテストの両方から外れる。
           JS で aria-hidden を張り替えるとイベントの発火漏れで
           デスクトップにも残る事故が起きるため、CSS だけで完結させる */
        visibility: hidden;
      }
      .sidebar.open { transform: none; visibility: visible; }
      /* ⚠️ hidden 属性ではなくクラスで出し分ける。
         `.scrim { display:block }` は UA スタイルの `[hidden]{display:none}` に勝つため、
         hidden を付けても消えず、本文を覆って画面が暗くなりタッチも奪われる（2026-07-27 に発生） */
      .scrim.show { display: block; position: fixed; inset: var(--topbar) 0 0 0; background: #0008; z-index: 20; }
      .main { padding: 18px 16px 76px; }
      .content h1 { font-size: 24px; }
      .content h3 { font-size: 18px; }
      .lbl { grid-template-columns: 1fr; gap: 4px; padding-left: 10px; }
      .lbl > .k { padding-top: 0; }

      /* 本文上の操作子もタップ領域を44px確保する（設計書の合格条件）。
         デスクトップはマウス操作なので 36px のままでよい */
      .about-link, #expand-all { min-height: 44px; }

      /* 畳んだ見出しがそのまま目次になる。タップ領域を44px確保する */
      .sec > summary { display: flex; margin-top: 20px; margin-bottom: 12px; padding: 12px 10px; min-height: 44px; }
      .sec:not([open]) > summary { background: var(--panel); border: 1px solid var(--border); }
      .sec:not([open]) > summary::after { display: none; }
    }

    /* --- 横向きのスマホ：トップバーを1段に畳む ---
       812x375 実測でトップバー81px は画面高の 22% を占め、本文の可視高が294pxしか残らなかった。
       高さが足りないときはグループ見出しを隠し、2段を1段にまとめて縦を取り戻す */
    @media (max-width: 900px) and (max-height: 500px) {
      .groups { flex-direction: row; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; }
      .groups::-webkit-scrollbar { display: none; }
      .glabel { display: none; }
      /* 「まとめ」と「元ソース」の境目は区切り線で示す（案Aの階層表現を保つ） */
      .grp + .grp { border-left: 1px solid var(--border); padding-left: 10px; }
      .topbar { padding: 6px 10px; }
      .content h1 { font-size: 20px; }
      .content h3 { font-size: 17px; }
    }

    /* --- 印刷 / PDF 保存 ---
       節の展開は JS の beforeprint で行う（CSS からは details の open を変えられないため）。
       提案資料の根拠として保存する用途があるので、本文が欠けないことを最優先にする */
    @media print {
      .topbar, .sidebar, .scrim, #to-top, .main-tools, #banners { display: none !important; }
      .layout { display: block; height: auto; padding-top: 0; }
      .main { overflow: visible; padding: 0; }
      .content { max-width: none; }
      body { background: #fff; color: #000; }
      .content h1, .content h2, .content h3, .content h4, .content th, .content strong { color: #000; }
      .content h2, .content h2.sec-t { border-left-color: #666; }
      .sec > summary { border-left-color: #666; }
      .sec > summary::before { content: none; }        /* 開閉の三角は印刷しない */
      .content a { color: #00e; text-decoration: underline; }
      .content strong.long { background: none; font-weight: 600; }
      .lbl { border-left-color: #999; page-break-inside: avoid; }
      .lbl > .k { color: #000; }
      .content blockquote { color: #333; border-left-color: #999; }
      ul.src a { color: #333; background: none; border-color: #999; }
      .content h1, .content h2, .content h3, .sec > summary { page-break-after: avoid; }
    }
  </style>
</head>
<body>
  <div id="banners">
    <div id="fatal" class="banner b-err" hidden></div>
    <div id="warn" class="banner b-warn" hidden></div>
  </div>

  <header class="topbar">
    <button id="menu-btn" type="button" aria-label="日付の一覧を開く" aria-expanded="false" aria-controls="sidebar">☰</button>
    <span class="brand">AI NEWS</span>
    <div class="groups">
      <div class="grp">
        <span class="glabel">まとめ</span>
        <nav class="pills" id="pills-digest" aria-label="まとめ"></nav>
      </div>
      <div class="grp">
        <span class="glabel">元ソース</span>
        <nav class="pills" id="pills-source" aria-label="元ソース"></nav>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="日付の一覧">
      <div id="file-list"></div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <button id="to-top" type="button" aria-label="先頭へ戻る">↑</button>
    <main class="main">
      <!-- トップバーに置くとピルの幅を奪って「業界」が見えなくなったため本文側に置く -->
      <div class="main-tools">
        <a class="about-link" href="about.html">? このサイトについて</a>
        <button id="expand-all" type="button" aria-pressed="false">すべて開く</button>
      </div>
      <div id="content" class="content">
        <div class="empty">読み込み中…</div>
      </div>
    </main>
  </div>

  <script>
    const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const p2 = (n) => String(n).padStart(2, '0');

    // 表示順は「まとめ → 元ソース」。リポジトリ番号順ではなく実際に読む順に並べる。
    const SOURCES = [
      { id: 'daily',    dir: '05_ai-news-daily',    name: '今日のまとめ', group: 'digest' },
      { id: 'weekly',   dir: '04_ai-news-weekly',   name: '今週のまとめ', group: 'digest' },
      { id: 'master',   dir: '01_ai-news-Master',   name: '開発ツール',   group: 'source' },
      { id: 'copilot',  dir: '02_ai-news-Copilot',  name: 'Microsoft',   group: 'source' },
      { id: 'industry', dir: '03_ai-news-industry', name: '業界',        group: 'source' },
    ];
    const srcOf  = (id) => SOURCES.find((s) => s.id === id) || SOURCES[0];
    const baseOf = (id) => `../${srcOf(id).dir}/`;

    // --- 日付ユーティリティ（UTC 固定でタイムゾーン差を排除する） ---
    const dateUTC = (ymd) => new Date(ymd + 'T00:00:00Z');
    const ymdOf   = (d) => `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`;

    // ISO 週番号 → その週の月曜日
    function isoMonday(year, week) {
      const jan4 = new Date(Date.UTC(year, 0, 4)); // 1月4日は必ず第1週に含まれる
      const dow = (jan4.getUTCDay() + 6) % 7;      // 月=0
      return new Date(jan4.getTime() + (week - 1) * 7 * 86400000 - dow * 86400000);
    }

    // 日付 → ISO 週番号
    function isoWeekOf(d) {
      const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // その週の木曜へ
      const ft = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
      ft.setUTCDate(ft.getUTCDate() - ((ft.getUTCDay() + 6) % 7) + 3);
      return { year: t.getUTCFullYear(), week: 1 + Math.round((t - ft) / (7 * 86400000)) };
    }

    // --- ファイルパス → 一覧エントリ ---
    // 旧実装の /ai-news-(\d{4}-\d{2}-\d{2})/ は 04（ai-news- を含まない）と
    // 05（ai-news- の直後が daily-）に一致せず、全件スキップで 0 件表示になっていた。
    const RE_DATE = /(\d{4})-(\d{2})-(\d{2})\.md$/;
    const RE_WEEK = /(?:^|\/)(\d{4})\/[^/]*W(\d{1,2})[^/]*\.md$/;

    function parseEntry(path) {
      const d = path.match(RE_DATE);
      if (d) {
        const ymd = `${d[1]}-${d[2]}-${d[3]}`;
        return {
          kind: 'date', path, id: ymd, ymd,
          sort: `${d[1]}${d[2]}${d[3]}`, bucket: `${d[1]}-${d[2]}`,
          label: ymd, sub: DAYS[dateUTC(ymd).getUTCDay()] + '曜日',
        };
      }
      const w = path.match(RE_WEEK);
      if (w) {
        let year = +w[1];
        const wk = +w[2];
        let mon = isoMonday(year, wk);
        // ディレクトリ年が %G ではなく %Y だった場合の未来日を無害化する
        if (mon.getTime() > Date.now() + 14 * 86400000) mon = isoMonday(--year, wk);
        return {
          kind: 'week', path, id: `${year}-W${p2(wk)}`, y: year, wk, mon,
          sort: ymdOf(mon).replace(/-/g, ''),
          bucket: `${mon.getUTCFullYear()}-${p2(mon.getUTCMonth() + 1)}`,
          label: `${year}-W${p2(wk)}`,
          // 日付レンジは表示しない。W19 は H1 が 04-28〜05-04（ISO ではなく直近7日間）で
          // 週番号から算出した月曜と食い違うため、算出値を出すと本文と矛盾する。
          sub: '週次サマリー',
        };
      }
      // 判定不能でも捨てない。捨てたことが 04/05 の無言故障の原因だった。
      return {
        kind: 'other', path, id: path, sort: '00000000', bucket: 'unknown',
        label: path.split('/').pop(), sub: '日付を判定できません',
      };
    }

    // --- 運用向けセクションの除去 ---
    // 改善メモ（提案台帳）と欠損ファイル通知（入力の取得失敗一覧）は運用の内容なので
    // Web では表示しない。見出しから次の `## ` までを取り除く。
    const HIDDEN_SECTIONS = [
      /^##[^\S\n]*改善メモ.*$/m,
      /^##[^\S\n]*(?:⚠️?[^\S\n]*)?欠損ファイル通知.*$/m,
    ];
    function stripHiddenSections(md) {
      for (const re of HIDDEN_SECTIONS) {
        const m = md.match(re);
        if (!m) continue;
        const rest = md.slice(m.index + m[0].length);
        const next = rest.search(/^##[^\S\n]+\S/m);
        md = md.slice(0, m.index) + (next === -1 ? '' : rest.slice(next));
      }
      return md.trimEnd();
    }

    // --- 状態 ---
    // 既定は daily。3ソースを統合したまとめなので入口に適する。
    const state = { sourceId: 'daily', entries: [], activeId: null, token: 0 };
    const mdCache = new Map();

    const $ = (sel) => document.querySelector(sel);

    function showFatal(msg) {
      const el = $('#fatal');
      el.textContent = 'ビューアでエラーが発生しました: ' + msg;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '再読み込み';
      btn.addEventListener('click', () => location.reload());
      el.appendChild(btn);
      el.hidden = false;
      syncTopbarHeight();   // バナーのぶんトップバー以下を押し下げる
    }

    function showWarn(msg) {
      const el = $('#warn');
      el.textContent = msg;
      el.hidden = false;
      syncTopbarHeight();
    }

    async function loadIndex(sourceId) {
      const my = ++state.token;
      const base = baseOf(sourceId);
      // Pages はプリフライトを拒否するためカスタムヘッダは付けられない。
      // cache:'no-store' も共有キャッシュを回避できないのでクエリで破る。
      const res = await fetch(`${base}files.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`files.json の取得に失敗しました (HTTP ${res.status})`);
      const files = await res.json();
      if (my !== state.token) return; // 連打時の競合ガード

      // files.json の並び順に依存せず、必ず日付降順にする
      state.entries = files.map(parseEntry).sort((a, b) => (a.sort < b.sort ? 1 : a.sort > b.sort ? -1 : 0));
      state.sourceId = sourceId;
      state.activeId = null;
      renderList();
      if (state.entries.length) {
        await selectEntry(state.entries[0].id);
      } else {
        $('#content').innerHTML = '<div class="empty">表示できるファイルがありません</div>';
      }
    }

    function renderList() {
      const list = $('#file-list');
      list.innerHTML = '';

      // 降順済みの entries を走査順にグループ化する（Map は挿入順を保つ）
      const groups = new Map();
      for (const e of state.entries) {
        if (!groups.has(e.bucket)) groups.set(e.bucket, []);
        groups.get(e.bucket).push(e);
      }

      // 件数が少ないソース（04_weekly の11件など）は全部開く
      const openAll = state.entries.length <= 20;
      let first = true;

      for (const [bucket, items] of groups) {
        const det = document.createElement('details');
        det.className = 'month';
        det.dataset.bucket = bucket;
        det.open = openAll || first;
        first = false;

        const sum = document.createElement('summary');
        sum.innerHTML = '<span class="chev" aria-hidden="true">▸</span>';
        const label = document.createElement('span');
        label.className = 'm-label';
        label.textContent = bucket === 'unknown' ? '日付不明' : `${bucket.slice(0, 4)}年${+bucket.slice(5)}月`;
        const count = document.createElement('span');
        count.className = 'm-count';
        count.textContent = items.length;
        sum.append(label, count);

        const ul = document.createElement('ul');
        ul.className = 'items';
        for (const e of items) ul.appendChild(itemNode(e));

        det.append(sum, ul);
        list.appendChild(det);
      }

      const dropped = state.entries.filter((e) => e.kind === 'other').length;
      if (dropped > 0) showWarn(`${dropped} 件のファイルの日付を判定できませんでした（ファイル名の形式が変わった可能性があります）`);
    }

    // JST で今日を求める（kit は日本時間で生活している）
    function todayJST() {
      const now = new Date(Date.now() + 9 * 3600000);
      return `${now.getUTCFullYear()}-${p2(now.getUTCMonth() + 1)}-${p2(now.getUTCDate())}`;
    }

    function badgeOf(e) {
      const today = todayJST();
      if (e.kind === 'date') return e.ymd === today ? { cls: 'b-today', text: '今日' } : null;
      if (e.kind === 'week') {
        const cur = isoWeekOf(dateUTC(today));
        if (cur.year !== e.y || cur.week !== e.wk) return null;
        // 週の途中なら「途中」と明示する（完結した週と区別する）
        const sun = new Date(e.mon.getTime() + 6 * 86400000);
        return dateUTC(today) < sun ? { cls: 'b-part', text: '今週(途中)' } : { cls: 'b-week', text: '今週' };
      }
      return null;
    }

    function itemNode(e) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item';
      btn.dataset.id = e.id;

      const body = document.createElement('span');
      body.className = 'i-body';
      const t = document.createElement('span');
      t.className = 'i-title';
      t.textContent = e.label;
      const s = document.createElement('span');
      s.className = 'i-sub';
      s.textContent = e.sub;
      body.append(t, s);
      btn.appendChild(body);

      const b = badgeOf(e);
      if (b) {
        const span = document.createElement('span');
        span.className = 'badge ' + b.cls;
        span.textContent = b.text;
        btn.appendChild(span);
      }

      li.appendChild(btn);
      return li;
    }

    async function selectEntry(id) {
      const e = state.entries.find((x) => x.id === id);
      if (!e) return;
      const my = state.token;
      state.activeId = id;
      markActive();

      const url = baseOf(state.sourceId) + e.path;
      let md = mdCache.get(url);
      if (md === undefined) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${e.label} の取得に失敗しました (HTTP ${res.status})`);
        md = stripHiddenSections(await res.text());
        mdCache.set(url, md);
      }
      if (my !== state.token) return; // ソース切り替えと競合したら描画しない

      const box = $('#content');
      if (typeof marked === 'undefined') {
        showWarn('Markdown ライブラリを読み込めませんでした。整形なしで表示します。');
        const pre = document.createElement('pre');
        pre.textContent = md;
        box.replaceChildren(pre);
      } else {
        box.innerHTML = marked.parse(md);
        // 装飾は失敗しても素の本文を残す（本文が消えるより崩れたまま出す方が安全）
        try { decorate(box); } catch (err) { console.warn('装飾に失敗:', err); }
      }
      $('.main').scrollTop = 0;
    }

    function markActive() {
      document.querySelectorAll('.item').forEach((el) => {
        const on = el.dataset.id === state.activeId;
        el.classList.toggle('is-active', on);
        if (on) el.closest('.month')?.setAttribute('open', '');
      });
    }

    // ============ 本文の装飾 ============

    // 新フォーマット（2026-07-26 以降）と旧フォーマット（既存437ファイル）の両方に対応する
    const LABELS = {
      '要点': 'key',    '事実': 'key',
      '詳細': 'detail', '根拠': 'detail',
      '意味': 'mean',   '影響': 'mean',
      '行動指針': 'act',
    };

    function decorate(box) {
      decorateLinks(box);
      decorateLabels(box);
      decorateBold(box);
      decorateHeadings(box);
      decorateListTitles(box);
      decorateLede(box);
      groupSections(box); // ノードを移動するので必ず最後に実行する
      // groupSections は節が1つ以下だと早期 return するため、
      // ボタンの表示可否はここで必ず更新する
      syncExpandBtn();
    }

    // `## セクション` を折りたたみ可能にする。
    // 375×812 実測でデイリーは21.9画面・週次は29.3画面あり、うち「カテゴリ別まとめ」だけで
    // 15.7画面を占めていた。畳めば見出し一覧がそのまま目次になり、目的の節へ直接飛べる。
    function groupSections(box) {
      const kids = [...box.children];
      const idx = kids.map((el, i) => (el.tagName === 'H2' ? i : -1)).filter((i) => i >= 0);
      if (idx.length < 2) return; // 節が1つ以下なら畳む意味がない（fail-open）

      idx.forEach((start, n) => {
        const end = n + 1 < idx.length ? idx[n + 1] : kids.length;
        const h2 = kids[start];

        const det = document.createElement('details');
        det.className = 'sec';
        det.dataset.n = String(n);

        const sum = document.createElement('summary');
        sum.className = 'sec-h';
        // ⚠️ h2 を summary に「置き換えない」。h2 要素ごと summary の中に入れる。
        // 置き換えると文書から h2 が消え、見出し階層が h1 → h3 に飛んで
        // スクリーンリーダーの見出しジャンプでセクションに到達できなくなる（2026-07-27 の指摘 2-1）。
        // HTML 仕様上 summary の内容モデルは「phrasing content ＋ heading content」なので h2 を入れてよい。
        const t = h2.cloneNode(true);
        t.className = 'sec-t';
        const body = kids.slice(start + 1, end);
        const n3 = body.filter((el) => el.tagName === 'H3').length;
        // ⚠️ 数えるのは「最上位のリスト項目」だけ。
        // 旧実装は querySelectorAll('li') で**入れ子の内訳と出典チップまで**数えており、
        // 2026-07-31 実測で 01 Master の「コーディングエージェント / 開発ツール」節が
        // 本文4項目に対して「13件」と表示されていた（列挙の外形化で内訳が増えたため）。
        // 畳んだ見出しは目次であり、この数字が開くかどうかの唯一の量的手がかりになる。
        const nli = body.reduce((a, el) => {
          const lists = [el, ...el.querySelectorAll('ul, ol')].filter((n) =>
            (n.tagName === 'UL' || n.tagName === 'OL') &&
            !n.classList.contains('src') &&          // 出典チップは項目ではない
            !n.parentElement?.closest('li'));        // 入れ子の内訳は数えない
          return a + lists.reduce((b, l) => b + l.querySelectorAll(':scope > li').length, 0);
        }, 0);
        const cnt = n3 || nli;
        const c = document.createElement('span');
        c.className = 'sec-n';
        if (cnt) c.textContent = `${cnt}件`;
        sum.append(t, c);

        h2.replaceWith(det);
        det.appendChild(sum);
        for (const el of body) det.appendChild(el);
      });

      applySectionOpen(box);
    }

    // 節の開閉。既定は「先頭の節だけ開く」で、画面幅によらず同じ挙動にする。
    // デスクトップでも週次は 14.8画面（1440x900 実測）あり、畳む価値はモバイルと変わらない。
    // 「全開」を選んだ場合はその選択を localStorage に覚えて次回以降も維持する。
    // localStorage はプライベートブラウズ等で例外を投げることがあるのでメモリに退避する
    const EXPAND_KEY = 'ai-news-expand-all';
    let expandMem = false;
    const wantExpandAll = () => {
      try { return localStorage.getItem(EXPAND_KEY) === '1'; } catch { return expandMem; }
    };
    const setExpandAll = (v) => {
      expandMem = v;
      try { localStorage.setItem(EXPAND_KEY, v ? '1' : '0'); } catch { /* 保存できなくても動作は継続する */ }
    };

    function applySectionOpen(box) {
      const all = wantExpandAll();
      for (const det of (box || document).querySelectorAll('details.sec')) {
        det.open = all || det.dataset.n === '0';
      }
      syncExpandBtn();
    }

    const allSections = () => [...document.querySelectorAll('details.sec')];
    const isAllOpen = () => { const s = allSections(); return s.length > 0 && s.every((d) => d.open); };

    // ボタンの表示は保存値ではなく「今の DOM の状態」から導く。
    // 保存値を見ていたとき、「すべて閉じる」を押しても先頭の節（ハイライト）だけ開いたままで、
    // ラベルの約束と動作が食い違っていた
    function syncExpandBtn() {
      const btn = $('#expand-all');
      if (!btn) return;
      // 折りたたむ節が無い日は、このボタン自体を出さない。
      // 「今日だけ挙動が違う」ように見えるのを避けるため、機能の有無と操作子の有無を一致させる。
      // 消すのはボタンだけ。行ごと消すと同居する概要リンクまで巻き添えになる
      btn.classList.toggle('hide', allSections().length === 0);
      const all = isAllOpen();
      btn.setAttribute('aria-pressed', String(all));
      btn.textContent = all ? 'すべて閉じる' : 'すべて開く';
      btn.title = all
        ? 'すべての節を閉じて見出しだけにする'
        : 'すべての節を開く（ページ内検索をする前に押してください）';
    }

    // すべて開く／すべて閉じる。閉じるときは先頭の節も例外にしない
    function toggleExpandAll() {
      const open = !isAllOpen();
      setExpandAll(open);              // 次に開く記事にも引き継ぐ
      allSections().forEach((d) => { d.open = open; });
      syncExpandBtn();
    }

    // 裸URL（リンクテキストが URL そのもの）を出典ドメインのチップにする。
    // URL は可視文字の約2割を占め、意味を失わずに削れる唯一の要素。
    function decorateLinks(box) {
      for (const a of box.querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        if (!/^https?:/.test(href)) {
          // digest 内の相対リンクはページ内遷移にする
          const m = href.match(RE_DATE);
          if (m) {
            const id = `${m[1]}-${m[2]}-${m[3]}`;
            if (state.entries.some((x) => x.id === id)) {
              a.addEventListener('click', (ev) => {
                ev.preventDefault();
                selectEntry(id).catch((err) => showFatal(String(err.message || err)));
              });
            }
          }
          continue;
        }
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        if (href !== a.textContent.trim()) continue;   // 説明文付きリンクはそのまま
        let host;
        try { host = new URL(href).hostname.replace(/^www\./, ''); } catch { continue; }
        a.textContent = host;
        a.title = href;
        const li = a.closest('li');
        // li の中身がそのリンクだけなら「出典 li」として印を付ける。
        // ul をチップ列にするかは、本文 li を巻き込まないよう2パス目で決める
        if (li && li.textContent.trim() === host && li.parentElement?.tagName === 'UL') {
          li.dataset.srcOnly = '1';
        }
      }

      // ⚠️ 2パス目。本文の箇条書きと出典URLが同じ ul に入る日がある。
      // Markdown では項目間の空行はリストを終端しないため、
      //     - 本文
      //     （空行）
      //     - https://example.com
      // が1つの ul になる。1パス目で ul にクラスを付けていたときは、この日の
      // **本文まで出典チップの見た目（中黒なし・インデント0・横並び）になっていた**。
      // 2026-07-31 実測: 全5リポの 5,381 リストブロック中 705 箇所が混在。
      // 当日の 03_industry だけで4箇所・本文13行が巻き添えになっていた。
      for (const ul of box.querySelectorAll('ul')) {
        const items = [...ul.children];
        const srcItems = items.filter((li) => li.dataset.srcOnly === '1');
        if (!srcItems.length) continue;
        if (srcItems.length === items.length) { ul.classList.add('src'); continue; }
        // 混在している ul は、出典 li だけを直後の ul.src へ切り出す。
        // こうすると「崩れていない日」とまったく同じ描画に収束する
        const out = document.createElement('ul');
        out.className = 'src';
        for (const li of srcItems) out.appendChild(li);
        ul.after(out);
      }
    }

    const SEP_HEAD = /^[\s:：—–\-]+/;
    const SEP_TAIL = /[\s:：—–\-]+$/;

    // ラベル太字をラベル列に組み替える。実データには3つの書き方が混在している。
    //   1) `**要点**: 本文`            … 段落＝1ラベル（デイリー。ラベル間に空行あり）
    //   2) `- **事実**: 本文`          … リスト項目形式（デイリー6ファイル・各18件）
    //   3) `**事実**: …\n**根拠**: …`  … 空行がないため marked が1段落にまとめる（週次）
    // 3) を取りこぼすと週次は1件目の「事実」しか組めないので、段落内を走査して分割する。
    // 変換するのは「段落がラベルで始まる」場合だけ。文中の強調を誤ってラベル化しないため。
    // 段落がラベルで始まるか（`**詳細**: …` の形）
    function isLabelHead(el) {
      const n = el.firstChild;
      return !!n && n.nodeName === 'STRONG' && !!LABELS[n.textContent.replace(SEP_TAIL, '').trim()];
    }

    // ラベルの値をどこまで伸ばすか。次のラベル段落・見出し・区切り線・出典チップの手前で止める。
    // `**詳細**: 本文` の後ろに箇条書きを続ける書き方（「列挙の外形化」ルール）をすると、
    // marked は <p> と <ul> を別要素にする。吸収しないと箇条書きがラベルの枠の外へ落ち、
    // 「別の話題が始まった」ように見えてしまう（2026-07-31 の kit 指摘）。
    const isLabelStop = (el) =>
      !el || /^H[1-6]$/.test(el.tagName) || el.tagName === 'HR' ||
      (el.tagName === 'UL' && el.classList.contains('src')) ||
      (el.tagName === 'P' && isLabelHead(el));

    function decorateLabels(box) {
      // 走査対象は開始時点のスナップショット。吸収した要素も後で回ってくるが、
      // 吸収は「次のラベル段落の手前」で止まるのでラベルとして二重処理されることはない
      for (const el of [...box.querySelectorAll('p, li')]) {
        const nodes = [...el.childNodes];
        const marks = [];
        nodes.forEach((n, i) => {
          if (n.nodeName !== 'STRONG') return;
          const key = n.textContent.replace(SEP_TAIL, '').trim();
          if (LABELS[key]) marks.push({ i, key });
        });
        if (!marks.length || marks[0].i !== 0) continue;

        const frag = document.createDocumentFragment();
        let lastV = null; // 最後のラベルの値。後続の兄弟要素はここへ吸収する
        marks.forEach((m, mi) => {
          const end = mi + 1 < marks.length ? marks[mi + 1].i : nodes.length;
          const wrap = document.createElement('div');
          wrap.className = 'lbl lbl-' + LABELS[m.key];
          const k = document.createElement('div');
          k.className = 'k';
          k.textContent = m.key;
          const v = document.createElement('div');
          v.className = 'v';
          // slice したノードを移すと el から外れるが、参照は nodes に確保済み
          for (const n of nodes.slice(m.i + 1, end)) v.appendChild(n);
          if (v.firstChild?.nodeType === 3) v.firstChild.textContent = v.firstChild.textContent.replace(SEP_HEAD, '');
          if (v.lastChild?.nodeType === 3) v.lastChild.textContent = v.lastChild.textContent.replace(/\s+$/, '');
          wrap.append(k, v);
          frag.appendChild(wrap);
          lastV = v;
        });

        if (el.tagName === 'LI') {
          el.replaceChildren(frag);
          el.parentElement?.classList.add('lbl-list');
        } else {
          // 後続の兄弟（箇条書き・続きの段落）を最後のラベルの値に取り込む。
          // 参照を先に控えてから差し替える（差し替え後は el が DOM から外れるため）
          const cont = [];
          for (let n = el.nextElementSibling; !isLabelStop(n); n = n.nextElementSibling) cont.push(n);
          el.replaceWith(frag);
          for (const n of cont) lastV.appendChild(n);
        }
      }
    }

    // 20字を超える太字は「キーワード強調」ではなく「文まるごとの強調」なのでウェイトを落とす。
    // 2026-07-26 実測でデイリーは本文の18.7%が太字、うち4割が20字超だった。
    function decorateBold(box) {
      for (const s of box.querySelectorAll('strong')) {
        if (s.textContent.trim().length > 20) s.classList.add('long');
      }
    }

    // 見出しの「タイトル — 含意」を分け、含意側を弱める。
    // h3 は既に font-weight:700 なのでタイトルをこれ以上太くはできない。
    // 代わりに後半を落として、結果としてタイトルが立つようにする。
    //
    // 区切りは3形式が混在している（2026-07-28 実測・全ソース）:
    //   ` — `   現行の標準形式               例) Opus 5 が GA — 翌日には既定が切り替わった
    //   `）— `  weekly のリポタグ（前空白なし）例) Codex CLI 0.145.0（7/21）— [master]
    //   `——`    industry の旧ファイル         例) Pew調査（6月）——米成人の49%が…
    // そのため `\s*—+\s*` で拾う。ハイフン `-` は区切りではない
    // （`Cursor 3.6 - Auto-review` のようにタイトル内の文字）ので対象外。
    const RE_H3SEP = /\s*—+\s*/;

    function decorateHeadings(box) {
      for (const h of box.querySelectorAll('h3')) {
        // タイトル内に `code` やリンクが入る見出しがあるため、innerHTML の文字列置換はしない。
        // 区切りを含むテキストノードを見つけて、そこから後ろのノードごと span へ移す
        for (const node of [...h.childNodes]) {
          if (node.nodeType !== Node.TEXT_NODE) continue;
          const m = node.nodeValue.match(RE_H3SEP);
          if (!m) continue;

          // 区切りが2つある旧形式（タイトル — 詳細 — 含意）は最初の区切りで分ける。
          // 立てたいのはタイトルなので、2つ目以降は含意側にまとめてよい
          const tail = node.splitText(m.index);
          const sub = document.createElement('span');
          sub.className = 'h3-sub';
          // appendChild は移動なので、先に対象を控えてから動かす
          const move = [];
          for (let n = tail; n; n = n.nextSibling) move.push(n);
          for (const n of move) sub.appendChild(n);
          h.appendChild(sub);
          break; // 1見出しにつき1回だけ
        }
      }
    }

    // 箇条書きの「タイトル — 説明」も分ける。h3 とは扱いが逆で、
    // li の基本ウェイトは 400 なのでタイトル側を太くできる（h3 は既に 700 で余地がなかった）。
    //
    // `**ラベル**: 説明` 形式は strong が既に太字なので触らない。
    // 2026-07-28 実測では箇条書きの多数派がこの形式（Copilot 135/168・weekly 519/816）。
    // ただし `**Claude Security** プラグインが public beta — …` のように
    // 「太字を含むタイトル」もあるため、strong の直後が `:` のときだけ除外する。
    function decorateListTitles(box) {
      for (const li of box.querySelectorAll('li')) {
        // ⚠️ 緩いリスト（項目の間に空行があるもの）は marked が中身を <p> で包むため、
        // li の直下にテキストノードが無い。01 Master が緩いリスト、05 daily が密なリストで
        // 実際に両方が混在する。包まれている場合は <p> 側を対象にする
        const firstEl = li.firstElementChild;
        const host = (firstEl && firstEl.tagName === 'P' && li.firstChild === firstEl) ? firstEl : li;

        const head = host.firstChild;
        if (head && head.nodeType === Node.ELEMENT_NODE && head.tagName === 'STRONG') {
          const after = head.nextSibling;
          if (after && after.nodeType === Node.TEXT_NODE && /^\s*[:：]/.test(after.nodeValue)) continue;
        }

        for (const node of [...host.childNodes]) {
          if (node.nodeType !== Node.TEXT_NODE) continue;
          const m = node.nodeValue.match(RE_H3SEP);
          if (!m) continue;

          node.splitText(m.index); // node は区切りの直前までになる
          // 先頭から node までを span へ移す。appendChild は移動なので先に控える
          const move = [];
          for (let n = host.firstChild; n; n = n.nextSibling) { move.push(n); if (n === node) break; }
          const title = document.createElement('span');
          title.className = 'li-title';
          host.insertBefore(title, host.firstChild);
          for (const n of move) title.appendChild(n);
          break; // 1項目につき1回だけ
        }
      }
    }

    // H1 直後の導入段落はリード文として落ち着かせる
    function decorateLede(box) {
      const h1 = box.querySelector('h1');
      if (!h1) return;
      let n = h1.nextElementSibling;
      while (n && n.tagName === 'BLOCKQUOTE') n = n.nextElementSibling;
      if (n && n.tagName === 'P') n.classList.add('lede');
    }

    // ============ ナビゲーション ============

    function renderPills() {
      for (const g of ['digest', 'source']) {
        const nav = document.getElementById('pills-' + g);
        nav.innerHTML = '';
        for (const s of SOURCES.filter((x) => x.group === g)) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'pill';
          b.dataset.id = s.id;
          b.textContent = s.name;
          b.setAttribute('aria-current', String(s.id === state.sourceId));
          nav.appendChild(b);
        }
      }
      syncTopbarHeight();
    }

    // トップバーが2段になったため高さは固定値にできない。実測して CSS 変数に反映する。
    // バナー（0〜2本）とトップバーの高さを測り、本文・サイドバー・スクリムの
    // 上端をまとめて押し下げる。--topbar は .layout / .sidebar / .scrim が参照する
    function syncTopbarHeight() {
      const bh = $('#banners').offsetHeight;
      document.documentElement.style.setProperty('--banner-h', bh + 'px');
      const h = document.querySelector('.topbar').offsetHeight;
      if (h) document.documentElement.style.setProperty('--topbar', (h + bh) + 'px');
    }

    function switchSource(id) {
      if (id === state.sourceId) return;
      state.sourceId = id;
      renderPills();
      $('#warn').hidden = true;
      syncTopbarHeight();   // 消えたバナーのぶん押し戻す
      $('#content').innerHTML = '<div class="empty">読み込み中…</div>';
      history.replaceState(null, '', '#' + id);
      loadIndex(id).catch((e) => showFatal(String(e.message || e)));
    }

    const isMobile = () => window.matchMedia('(max-width: 820px)').matches;

    // ドロワーの開閉。支援技術に状態を伝え、フォーカスも移す（2026-07-27 の指摘 3-2）
    let drawerOpener = null;

    function setDrawer(open) {
      const sb = $('#sidebar');
      sb.classList.toggle('open', open);
      $('#scrim').classList.toggle('show', open);
      $('#menu-btn').setAttribute('aria-expanded', String(open));
      // 一覧の露出は CSS の visibility が制御する（aria-hidden は使わない）

      if (open) {
        drawerOpener = document.activeElement;
        (sb.querySelector('.item.is-active') || sb.querySelector('.item'))?.focus();
      } else if (drawerOpener) {
        drawerOpener.focus();
        drawerOpener = null;
      }
    }

    function boot() {
      const fromHash = SOURCES.find((s) => s.id === location.hash.slice(1));
      if (fromHash) state.sourceId = fromHash.id;
      renderPills();

      // イベント委譲。要素を作り直しても listener を張り直さなくてよい
      for (const g of ['digest', 'source']) {
        document.getElementById('pills-' + g).addEventListener('click', (ev) => {
          const b = ev.target.closest('.pill');
          if (b) switchSource(b.dataset.id);
        });
      }
      $('#file-list').addEventListener('click', (ev) => {
        const btn = ev.target.closest('.item');
        if (!btn) return;
        selectEntry(btn.dataset.id).catch((e) => showFatal(String(e.message || e)));
        if (isMobile()) setDrawer(false);
      });

      $('#menu-btn').addEventListener('click', () => setDrawer(!$('#sidebar').classList.contains('open')));
      $('#scrim').addEventListener('click', () => setDrawer(false));
      $('#expand-all').addEventListener('click', toggleExpandAll);
      // 個別に節を開閉したときもボタンの表示を合わせる。
      // details の toggle イベントはバブルしないので capture で受ける
      $('#content').addEventListener('toggle', syncExpandBtn, true);
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && $('#sidebar').classList.contains('open')) setDrawer(false);
      });
      // resize と matchMedia の両方から張り直す（片方が発火しない環境への保険）
      window.addEventListener('resize', syncTopbarHeight);
      syncExpandBtn();

      // 印刷・PDF保存のときは畳んだ節を一時的に全部開く。
      // CSS からは details の open を変えられないので JS で行い、印刷後に元へ戻す
      let printClosed = [];
      window.addEventListener('beforeprint', () => {
        printClosed = [...document.querySelectorAll('details.sec:not([open]), details.month:not([open])')];
        printClosed.forEach((d) => { d.open = true; });
      });
      window.addEventListener('afterprint', () => {
        printClosed.forEach((d) => { d.open = false; });
        printClosed = [];
      });

      // 先頭へ戻る（モバイルで最大29画面スクロールするため）
      const main = $('.main');
      const toTop = $('#to-top');
      toTop.addEventListener('click', () => main.scrollTo({ top: 0, behavior: 'smooth' }));
      main.addEventListener('scroll', () => toTop.classList.toggle('show', main.scrollTop > 600), { passive: true });

      let lastDay = todayJST();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && todayJST() !== lastDay) {
          lastDay = todayJST();
          renderList();
          markActive();
        }
      });

      loadIndex(state.sourceId).catch((e) => showFatal(String(e.message || e)));
    }

    // Node からパーサだけを検証できるようブラウザ判定で囲む
    if (typeof window !== 'undefined') {
      window.addEventListener('error', (e) => showFatal(e.message));
      window.addEventListener('unhandledrejection', (e) => showFatal(String(e.reason)));
      try { boot(); } catch (e) { showFatal(String(e)); }
    }
  </script>
</body>
</html>
