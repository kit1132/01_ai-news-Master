        const nLabel = sideWeekLabel(e.mon, e.bucket);
        const sun = new Date(e.mon.getTime() + 6 * 86400000);
        const monD = e.mon.getUTCDay();
        const sunD = sun.getUTCDay();
        const monCls = monD === 0 ? 'dow-sun' : monD === 6 ? 'dow-sat' : '';
        const sunCls = sunD === 0 ? 'dow-sun' : sunD === 6 ? 'dow-sat' : '';
        const when = `${nLabel}（${weekRangeLabel(e.mon)}）`;
        btn.title = when;
        btn.setAttribute('aria-label', when);
        const week = document.createElement('span');
        week.className = 'i-week';
        week.textContent = nLabel;
        const range = document.createElement('span');
        range.className = 'i-range';
        const a = document.createElement('span');
        if (monCls) a.className = monCls;
        a.textContent = `${e.mon.getUTCMonth() + 1}/${e.mon.getUTCDate()}`;
        const sep = document.createTextNode('–');
        const b = document.createElement('span');
        if (sunCls) b.className = sunCls;
        b.textContent = `${sun.getUTCMonth() + 1}/${sun.getUTCDate()}`;
        range.append(a, sep, b);
        btn.append(week, range);
      } else {
        btn.setAttribute('aria-label', e.fullLabel || e.label);
        const body = document.createElement('span');
        body.className = 'i-body';
        const t = document.createElement('span');
        t.className = 'i-title';
        t.textContent = e.label;
        body.appendChild(t);
        if (e.sub) {
          const s = document.createElement('span');
          s.className = 'i-sub';
          s.textContent = e.sub;
          body.appendChild(s);
        }
        btn.appendChild(body);
      }

      const b = badgeOf(e);
      if (b) {
        const span = document.createElement('span');
        span.className = 'badge ' + b.cls;
        span.textContent = b.text;
        btn.appendChild(span);
      }

      li.appendChild(btn);
      return li;
    }

    // 右ペイン共通クローム（日時を主見出しにする）
    function formatEntryWhen(e) {
      if (!e) return '';
      if (e.kind === 'date') {
        const d = dateUTC(e.ymd);
        const dow = DAYS[d.getUTCDay()];
        return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日（${dow}）`;
      }
      if (e.kind === 'week') {
        return `${sideWeekLabel(e.mon, e.bucket)}（${weekRangeLabel(e.mon)}）`;
      }
      return e.fullLabel || e.label || '';
    }

    function navContextLabel() {
      if (state.categorySlug) {
        const cat = catOf(state.categorySlug);
        return cat ? cat.name : CATEGORY_TITLE;
      }
      if (state.navFocus === 'daily' || state.navFocus === 'weekly') {
        return srcOf(state.navFocus).name;
      }
      if (isChildId(state.navFocus)) {
        const parent = state.weekFilter ? 'weekly' : 'daily';
        return `${srcOf(parent).name} / ${srcOf(state.navFocus).name}`;
      }
      return srcOf(state.sourceId).name;
    }

    function buildPageHead(opts) {
      const head = document.createElement('header');
      head.className = 'page-head' + (opts.variant === 'home' ? ' home-head' : '');
      if (opts.variant === 'home') {
        const mark = document.createElement('div');
        mark.className = 'home-mark';
        mark.setAttribute('aria-hidden', 'true');
        mark.innerHTML = HOME_SVG.mark;
        head.appendChild(mark);
      }
      if (opts.context) {
        const ctx = document.createElement('p');
        ctx.className = 'page-context';
        ctx.textContent = opts.context;
        head.appendChild(ctx);
      }
      const when = document.createElement('h1');
      when.className = 'page-when' + (opts.variant === 'home' ? ' home-title' : '');
      when.textContent = opts.when || '';
      head.appendChild(when);
      if (opts.overview) {
        const ov = document.createElement('p');
        ov.className = 'page-overview';
        ov.textContent = opts.overview;
        head.appendChild(ov);
      }
      if (opts.meta != null && opts.meta !== '') {
        const meta = document.createElement('p');
        meta.className = 'page-meta';
        meta.textContent = opts.meta;
        head.appendChild(meta);
      }
      if (opts.nav) head.appendChild(opts.nav);
      return head;
    }

    function mountPage(box, opts) {
      const nodes = [buildPageHead(opts)];
      if (opts.body) nodes.push(opts.body);
      box.replaceChildren(...nodes);
    }

    // entries は新しい順。隣の日／週へ。
    function buildDayNav(entries, activeId, onPick) {
      if (!entries || entries.length < 2) return null;
      const i = entries.findIndex((x) => x.id === activeId);
      if (i < 0) return null;
      const newer = i > 0 ? entries[i - 1] : null;
      const older = i < entries.length - 1 ? entries[i + 1] : null;
      const unit = (entries[i].kind === 'week') ? '週' : '日';
      const nav = document.createElement('div');
      nav.className = 'page-nav';
      nav.setAttribute('role', 'navigation');
      nav.setAttribute('aria-label', `${unit}の移動`);

      const mk = (e, label, rel) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        if (!e) {
          b.disabled = true;
          return b;
        }
        b.dataset.id = e.id;
        b.setAttribute('aria-label', `${rel}: ${formatEntryWhen(e)}`);
        b.addEventListener('click', () => onPick(e.id));
        return b;
      };

      nav.append(
        mk(newer, `← 新しい${unit}`, `新しい${unit}`),
        mk(older, `古い${unit} →`, `古い${unit}`),
      );
      return nav;
    }

    async function selectEntry(id) {
      if (state.categorySlug) {
        focusCategoryDay(id);
        return;
      }
      const e = state.entries.find((x) => x.id === id);
      if (!e) return;
      const my = state.token;
      state.activeId = id;
      markActive();

      const url = baseOf(state.sourceId) + e.path;
      let md = mdCache.get(url);
      if (md === undefined) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${e.label} の取得に失敗しました (HTTP ${res.status})`);
        md = stripHiddenSections(await res.text());
        mdCache.set(url, md);
      }
      if (my !== state.token) return; // ソース切り替えと競合したら描画しない

      const box = $('#content');
      const frag = document.createElement('div');
      if (typeof marked === 'undefined') {
        showWarn('Markdown ライブラリを読み込めませんでした。整形なしで表示します。');
        const pre = document.createElement('pre');
        pre.textContent = md;
        frag.appendChild(pre);
      } else {
        frag.innerHTML = marked.parse(md);
        // 装飾は失敗しても素の本文を残す（本文が消えるより崩れたまま出す方が安全）
        try {
          decorate(frag);
        } catch (err) {
          console.warn('装飾に失敗:', err);
          showWarn('本文の装飾に失敗しました。素の表示のまま読めます。');
        }
      }
      // 文書内 h1（日付入りタイトル）は共通クロームの日時見出しに一本化する
      frag.querySelector('h1')?.remove();
      const body = document.createElement('div');
      body.className = 'page-body';
      while (frag.firstChild) body.appendChild(frag.firstChild);
      const overview = (state.navFocus === 'daily' || state.navFocus === 'weekly')
        ? PAGE_OVERVIEW[state.navFocus]
        : null;
      mountPage(box, {
        context: navContextLabel(),
        when: formatEntryWhen(e),
        overview,
        nav: buildDayNav(state.entries, id, (nextId) => {
          selectEntry(nextId).catch((err) => showFatal(String(err.message || err)));
        }),
        body,
      });
      writeHash(state.sourceId, id);
      syncBreadcrumb();
      syncExpandBtn();
      $('.main').scrollTop = 0;
    }

    function markActive() {
      document.querySelectorAll('.item').forEach((el) => {
        const on = el.dataset.id === state.activeId;
        el.classList.toggle('is-active', on);
        if (on) el.closest('.month')?.setAttribute('open', '');
      });
    }

    // ============ 本文の装飾 ============

    // 新フォーマット（2026-07-26 以降）と旧フォーマット（既存437ファイル）の両方に対応する
    const LABELS = {
      '要約': 'key',
      '要点': 'key',    '事実': 'key',
      '詳細': 'detail', '根拠': 'detail',
      '意味': 'mean',   '影響': 'mean',
      '行動指針': 'act',
      /* 2026-09-21 午前の多段ラベル（廃止済み）。過去日ダイジェスト用に残す */
      'いま起きていること': 'key',
      '関係ある人': 'mean',
      '関係が薄い人': 'detail',
      '通知が出る人（関係あり）': 'mean',
      '通知が出ない人': 'detail',
      'まずやること': 'act',
      '一次（検証用）': 'detail',
    };

    function decorate(box, opts) {
      decorateLinks(box);
      decorateLabels(box);
      splitClosedCircledLists(box);
      decorateBold(box);
      decorateHeadings(box);
      decorateListTitles(box);
      splitLongItemsByPeriod(box);
      decorateNote(box);
      decorateLede(box);
      if (opts && opts.group === false) {
        syncExpandBtn();
        return;
      }
      groupSections(box); // ノードを移動するので必ず最後に実行する
      decorateSchedule(box); // data-sched 付与後に日付／本文を2列化し、週トグルへ分ける
      applySectionOpen(box);
      // groupSections は節が1つ以下だと早期 return するため、
      // ボタンの表示可否はここで必ず更新する
      syncExpandBtn();
    }

    // `## セクション` を折りたたみ可能にする。
    // 375×812 実測でデイリーは21.9画面・週次は29.3画面あり、うち「カテゴリ別まとめ」だけで
    // 15.7画面を占めていた。畳めば見出し一覧がそのまま目次になり、目的の節へ直接飛べる。
    function groupSections(box) {
      const kids = [...box.children];
      const idx = kids.map((el, i) => (el.tagName === 'H2' ? i : -1)).filter((i) => i >= 0);
      if (idx.length < 2) return; // 節が1つ以下なら畳む意味がない（fail-open）

      idx.forEach((start, n) => {
        const end = n + 1 < idx.length ? idx[n + 1] : kids.length;
        const h2 = kids[start];

        const det = document.createElement('details');
        det.className = 'sec';
        det.dataset.n = String(n);

        const sum = document.createElement('summary');
        sum.className = 'sec-h';
        // ⚠️ h2 を summary に「置き換えない」。h2 要素ごと summary の中に入れる。
        // 置き換えると文書から h2 が消え、見出し階層が h1 → h3 に飛んで
        // スクリーンリーダーの見出しジャンプでセクションに到達できなくなる（2026-07-27 の指摘 2-1）。
        // HTML 仕様上 summary の内容モデルは「phrasing content ＋ heading content」なので h2 を入れてよい。
        const t = h2.cloneNode(true);
        t.className = 'sec-t';
        // 日付一覧節は先頭太字を日付列として揃える（表記ゆれで目が滑るのを防ぐ）
        if (/注目予定|注目スケジュール|今後の期限/.test(h2.textContent || '')) {
          det.dataset.sched = '1';
        }
        const body = kids.slice(start + 1, end);
        const n3 = body.filter((el) => el.tagName === 'H3').length;
        // ⚠️ 数えるのは「最上位のリスト項目」だけ。
        // 旧実装は querySelectorAll('li') で**入れ子の内訳と出典チップまで**数えており、
        // 2026-07-31 実測で 01 Master の「コーディングエージェント / 開発ツール」節が
        // 本文4項目に対して「13件」と表示されていた（列挙の外形化で内訳が増えたため）。
        // 畳んだ見出しは目次であり、この数字が開くかどうかの唯一の量的手がかりになる。
        const nli = body.reduce((a, el) => {
          const lists = [el, ...el.querySelectorAll('ul, ol')].filter((n) =>
            (n.tagName === 'UL' || n.tagName === 'OL') &&
            !n.classList.contains('src') &&          // 出典チップは項目ではない
            !n.parentElement?.closest('li'));        // 入れ子の内訳は数えない
          return a + lists.reduce((b, l) => b + l.querySelectorAll(':scope > li').length, 0);
        }, 0);
        const cnt = n3 || nli;
        const c = document.createElement('span');
        c.className = 'sec-n';
        if (cnt) c.textContent = `${cnt}件`;
        sum.append(t, c);

        h2.replaceWith(det);
        det.appendChild(sum);
        for (const el of body) det.appendChild(el);
        groupSubsections(det, n);
      });

      applySectionOpen(box);
    }

    // 節の中の `### 見出し` も畳む。
    // 節を1つ畳めても、開いた瞬間に中身が全部出るのでは目次にならない。
    // 2026-08-01 実測（375×812）: 05 daily の「カテゴリ別まとめ」は H3 が9個・13.7画面あり、
    // 節を開くと 13.7画面が一度に展開されていた。
    //
    // ⚠️ H3 の意味はソースによって違う。安易に全部畳むと逆効果になる。
    //   05 daily「カテゴリ別まとめ」→ H3 は**カテゴリ名**（9個）。畳むと9行の目次になる
    //   04 weekly のカテゴリ節      → H3 は**個別ニュース**（2〜6個）。畳むと見出し一覧になる
    //   03 industry のカテゴリ節    → H3 は個別ニュース（1〜2個）。畳んでも1クリック増えるだけ
    //   01/02 のカテゴリ節          → H3 なし（項目は箇条書き）
    // そこで「H3 が3個以上ある節」だけを対象にする。
    // 先頭節（ハイライト）は**読むためのもの**なので、件数にかかわらず畳まない。
    const SUB_MIN = 3;

    function groupSubsections(det, n) {
      if (n === 0) return;                       // 先頭節（ハイライト）は畳まない
      const kids = [...det.children].filter((el) => el.tagName !== 'SUMMARY');
      const idx = kids.map((el, i) => (el.tagName === 'H3' ? i : -1)).filter((i) => i >= 0);
      if (idx.length < SUB_MIN) return;          // 少数なら畳む価値がない（fail-open）

      idx.forEach((start, m) => {
        const end = m + 1 < idx.length ? idx[m + 1] : kids.length;
        const h3 = kids[start];

        const sub = document.createElement('details');
        sub.className = 'sub';

        const sum = document.createElement('summary');
        sum.className = 'sub-h';
        // h2 と同じ理由で h3 を「置き換えない」。見出し階層を保つため要素ごと summary に入れる
        const t = h3.cloneNode(true);
        t.className = 'sub-t';
        const secTitle = det.querySelector('.sec-t')?.textContent || '';
        if (secTitle.includes('カテゴリ別まとめ')) {
          const shown = categoryDisplayTitle(h3.textContent);
          if (shown) t.textContent = shown;
        }

        const body = kids.slice(start + 1, end);
        // 数え方は節バッジと同じ（最上位のリスト項目のみ・出典チップと入れ子は除く）
        const cnt = body.reduce((a, el) => {
          const lists = [el, ...el.querySelectorAll('ul, ol')].filter((x) =>
            (x.tagName === 'UL' || x.tagName === 'OL') &&
            !x.classList.contains('src') &&
            !x.parentElement?.closest('li'));
          return a + lists.reduce((b, l) => b + l.querySelectorAll(':scope > li').length, 0);
        }, 0);
        const c = document.createElement('span');
        c.className = 'sub-n';
        if (cnt) c.textContent = `${cnt}件`;
        sum.append(t, c);

        h3.replaceWith(sub);
        sub.appendChild(sum);
        for (const el of body) sub.appendChild(el);
        decorateSubItems(sub);
      });
    }

    // `.sub` 直下の `**タイトル**: 本文` だけを見出し／本文に分ける。
    // decorateListTitles は strong 直後の `:` を意図的にスキップしている（多数派の形式）。
    // ハイライトは H3＋要点なので対象外。週次の .lbl を含む li も触らない。
    function decorateSubItems(sub) {
      for (const list of [...sub.children]) {
        if (list.tagName !== 'UL' && list.tagName !== 'OL') continue;
        if (list.classList.contains('src')) continue;
        for (const li of [...list.children]) {
          if (li.tagName === 'LI') decorateSubLi(li);
        }
      }
    }

    function decorateSubLi(li) {
      if (li.querySelector('.lbl') || li.querySelector('.cat-k')) return;
      let start = li.firstChild;
      while (start && start.nodeType === 3 && !/\S/.test(start.nodeValue)) start = start.nextSibling;
      const firstEl = (start && start.nodeType === 1) ? start : li.firstElementChild;
      const wrapped = firstEl && (firstEl.tagName === 'P' || firstEl.classList.contains('sent'));
      const host = wrapped ? firstEl : li;
      let head = host.firstChild;
      while (head && head.nodeType === 3 && !/\S/.test(head.nodeValue)) head = head.nextSibling;
      if (!head || head.nodeType !== 1 || head.tagName !== 'STRONG') return;
      const after = head.nextSibling;
      if (!after || after.nodeType !== 3 || !/^\s*[:：]/.test(after.nodeValue)) return;

      const k = document.createElement('div');
      k.className = 'cat-k';
      while (head.firstChild) k.appendChild(head.firstChild);

      const v = document.createElement('div');
      v.className = 'v';
      after.nodeValue = after.nodeValue.replace(SEP_HEAD, '');
      const rest = [];
      for (let n = after; n; n = n.nextSibling) rest.push(n);
      for (const n of rest) v.appendChild(n);
      head.remove();

      if (host !== li) {
        const follow = [];
        for (let n = host.nextSibling; n; n = n.nextSibling) follow.push(n);
        host.remove();
        for (const n of follow) {
          if (n.nodeType === 1 && n.classList.contains('src')) continue;
          v.appendChild(n);
        }
      }

      const chips = [...v.querySelectorAll(':scope > ul.src')];
      for (const c of chips) c.remove();

      li.insertBefore(k, li.firstChild);
      if (v.childNodes.length) {
        // 色箱（.lbl）にしない。ハイライトの要約／詳細コールアウトと序列を分ける。
        // 旧実装はここに `詳細` ラベル付きコールアウトを付けていたが、
        // カテゴリまで枠が並びハイライトが埋もれた（2026-09-21）
        v.className = 'cat-v';
        k.after(v);
        let at = v;
        for (const c of chips) { at.after(c); at = c; }
      }
    }

    // 節の開閉。既定は「先頭の節だけ開く」で、画面幅によらず同じ挙動にする。
    // デスクトップでも週次は 14.8画面（1440x900 実測）あり、畳む価値はモバイルと変わらない。
    // 「全開」を選んだ場合はその選択を localStorage に覚えて次回以降も維持する。
    // localStorage はプライベートブラウズ等で例外を投げることがあるのでメモリに退避する
    // ⚠️ キーに v2 が付いているのは意図的。2026-07-31 に項目単位の折りたたみを入れたとき、
    // 既に「すべて開く」を保存していた利用者には**新機能が最初から開いた状態で描画され、
    // 機能していないように見えた**（同日撤去）。第2階層（.sub）の導入でも同じことが起きるため、
    // キー名を変えて保存値を一度リセットし、全員が既定（先頭節のみ開・.sub は閉）から始まるようにする。
    const EXPAND_KEY = 'ai-news-expand-all-v2';
    let expandMem = false;
    const wantExpandAll = () => {
      try { return localStorage.getItem(EXPAND_KEY) === '1'; } catch { return expandMem; }
    };
    const setExpandAll = (v) => {
      expandMem = v;
      try { localStorage.setItem(EXPAND_KEY, v ? '1' : '0'); } catch { /* 保存できなくても動作は継続する */ }
    };

    function applySectionOpen(box) {
      const all = wantExpandAll();
      // .sub は既定クローズ。注目予定の「今週・来週」だけ data-near で開く
      for (const det of (box || document).querySelectorAll('details.sec, details.sub')) {
        det.open = all || det.dataset.n === '0' || det.dataset.near === '1';
      }
      syncExpandBtn();
    }

    // 「すべて開く」は第2階層（.sub）も対象にする。
    // 畳んだ中身はブラウザのページ内検索に掛からないため、検索前に全部開ける必要がある
    const allSections = () => [...document.querySelectorAll('details.sec, details.sub, details.cat-month, details.cat-week, details.cat-day')];
    const isAllOpen = () => { const s = allSections(); return s.length > 0 && s.every((d) => d.open); };

    // ボタンの表示は保存値ではなく「今の DOM の状態」から導く。
    // 保存値を見ていたとき、「すべて閉じる」を押しても先頭の節（ハイライト）だけ開いたままで、
    // ラベルの約束と動作が食い違っていた
    function syncExpandBtn() {
      const btn = $('#expand-all');
      if (!btn) return;
      // 折りたたむ節が無い日は、このボタン自体を出さない。
      // 「今日だけ挙動が違う」ように見えるのを避けるため、機能の有無と操作子の有無を一致させる。
      // 消すのはボタンだけ。行ごと消すと同居する概要リンクまで巻き添えになる
      btn.classList.toggle('hide', allSections().length === 0);
      const all = isAllOpen();
      btn.setAttribute('aria-pressed', String(all));
      btn.textContent = all ? 'すべて閉じる' : 'すべて開く';
      btn.title = all
        ? 'すべての節を閉じて見出しだけにする'
        : 'すべての節を開く（ページ内検索をする前に押してください）';
    }

    // すべて開く／すべて閉じる。閉じるときは先頭の節も例外にしない
    function toggleExpandAll() {
      const open = !isAllOpen();
      setExpandAll(open);              // 次に開く記事にも引き継ぐ
      allSections().forEach((d) => { d.open = open; });
      syncExpandBtn();
    }

    // 裸URL（リンクテキストが URL そのもの）を出典ドメインのチップにする。
    // URL は可視文字の約2割を占め、意味を失わずに削れる唯一の要素。
    function decorateLinks(box) {
      for (const a of box.querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        if (!/^https?:/.test(href)) {
          // digest 内の相対リンクはページ内遷移にする
          const m = href.match(RE_DATE);
          if (m) {
            const id = `${m[1]}-${m[2]}-${m[3]}`;
            if (state.entries.some((x) => x.id === id)) {
              a.addEventListener('click', (ev) => {
                ev.preventDefault();
                if (state.categorySlug) focusCategoryDay(id);
                else selectEntry(id).catch((err) => showFatal(String(err.message || err)));
              });
            }
          }
          continue;
        }
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        if (href !== a.textContent.trim()) continue;   // 説明文付きリンクはそのまま
        let host;
        try { host = new URL(href).hostname.replace(/^www\./, ''); } catch { continue; }
        a.textContent = host;
        a.title = href;
        const li = a.closest('li');
        // li の中身がそのリンクだけなら「出典 li」として印を付ける。
        // ul をチップ列にするかは、本文 li を巻き込まないよう2パス目で決める
        if (li && li.textContent.trim() === host && li.parentElement?.tagName === 'UL') {
          li.dataset.srcOnly = '1';
        }
      }

      // ⚠️ 2パス目。本文の箇条書きと出典URLが同じ ul に入る日がある。
      // Markdown では項目間の空行はリストを終端しないため、
      //     - 本文
      //     （空行）
      //     - https://example.com
      // が1つの ul になる。1パス目で ul にクラスを付けていたときは、この日の
      // **本文まで出典チップの見た目（中黒なし・インデント0・横並び）になっていた**。
      // 2026-07-31 実測: 全5リポの 5,381 リストブロック中 705 箇所が混在。
      // 当日の 03_industry だけで4箇所・本文13行が巻き添えになっていた。
      for (const ul of box.querySelectorAll('ul')) {
        const items = [...ul.children];
        const srcItems = items.filter((li) => li.dataset.srcOnly === '1');
        if (!srcItems.length) continue;
        if (srcItems.length === items.length) { ul.classList.add('src'); continue; }
        // 混在している ul は、出典 li だけを直後の ul.src へ切り出す。
        // こうすると「崩れていない日」とまったく同じ描画に収束する
        const out = document.createElement('ul');
        out.className = 'src';
        for (const li of srcItems) out.appendChild(li);
        ul.after(out);
      }
    }

    const SEP_HEAD = /^[\s:：—–\-]+/;
    const SEP_TAIL = /[\s:：—–\-]+$/;

    // ラベル太字をラベル列に組み替える。実データには3つの書き方が混在している。
    //   1) `**要点**: 本文`            … 段落＝1ラベル（デイリー。ラベル間に空行あり）
    //   2) `- **事実**: 本文`          … リスト項目形式（デイリー6ファイル・各18件）
    //   3) `**事実**: …\n**根拠**: …`  … 空行がないため marked が1段落にまとめる（週次）
    // 3) を取りこぼすと週次は1件目の「事実」しか組めないので、段落内を走査して分割する。
    // 変換するのは「段落がラベルで始まる」場合だけ。文中の強調を誤ってラベル化しないため。
    // 段落がラベルで始まるか（`**詳細**: …` の形）
    function isLabelHead(el) {
      const n = el.firstChild;
      return !!n && n.nodeName === 'STRONG' && !!LABELS[n.textContent.replace(SEP_TAIL, '').trim()];
    }

    // ラベルの値をどこまで伸ばすか。次のラベル段落・見出し・区切り線・出典チップの手前で止める。
    // `**詳細**: 本文` の後ろに箇条書きを続ける書き方（「列挙の外形化」ルール）をすると、
    // marked は <p> と <ul> を別要素にする。吸収しないと箇条書きがラベルの枠の外へ落ち、
    // 「別の話題が始まった」ように見えてしまう（2026-07-31 の kit 指摘）。
    const isLabelStop = (el) =>
      !el || /^H[1-6]$/.test(el.tagName) || el.tagName === 'HR' ||
      (el.tagName === 'UL' && el.classList.contains('src')) ||
      (el.tagName === 'P' && isLabelHead(el));

    function decorateLabels(box) {
      // 走査対象は開始時点のスナップショット。吸収した要素も後で回ってくるが、
      // 吸収は「次のラベル段落の手前」で止まるのでラベルとして二重処理されることはない
      for (const el of [...box.querySelectorAll('p, li')]) {
        const nodes = [...el.childNodes];
        const marks = [];
        nodes.forEach((n, i) => {
          if (n.nodeName !== 'STRONG') return;
          const key = n.textContent.replace(SEP_TAIL, '').trim();
          if (LABELS[key]) marks.push({ i, key });
        });
        if (!marks.length || marks[0].i !== 0) continue;

        const frag = document.createDocumentFragment();
        let lastV = null; // 最後のラベルの値。後続の兄弟要素はここへ吸収する
        marks.forEach((m, mi) => {
          const end = mi + 1 < marks.length ? marks[mi + 1].i : nodes.length;
          const wrap = document.createElement('div');
          wrap.className = 'lbl lbl-' + LABELS[m.key];
          const k = document.createElement('div');
          k.className = 'k';
          k.textContent = m.key;
          const v = document.createElement('div');
          v.className = 'v';
          // slice したノードを移すと el から外れるが、参照は nodes に確保済み
          for (const n of nodes.slice(m.i + 1, end)) v.appendChild(n);
          if (v.firstChild?.nodeType === 3) v.firstChild.textContent = v.firstChild.textContent.replace(SEP_HEAD, '');
          if (v.lastChild?.nodeType === 3) v.lastChild.textContent = v.lastChild.textContent.replace(/\s+$/, '');
          wrap.append(k, v);
          frag.appendChild(wrap);
          lastV = v;
        });

        if (el.tagName === 'LI') {
          el.replaceChildren(frag);
          el.parentElement?.classList.add('lbl-list');
        } else {
          // 後続の兄弟（箇条書き・続きの段落）を最後のラベルの値に取り込む。
          // 参照を先に控えてから差し替える（差し替え後は el が DOM から外れるため）
          const cont = [];
          for (let n = el.nextElementSibling; !isLabelStop(n); n = n.nextElementSibling) cont.push(n);
          el.replaceWith(frag);
          for (const n of cont) lastV.appendChild(n);
        }
      }
    }

    // 表示時の列挙分割。git の Markdown は触らない。
    // 丸数字: ①〜⑨ が2個以上、末項が `。` で閉じる。`、の` が末項に含まれる型は切らない。
    // 中黒: measure-density.py の NAKAGURO3（6字×3、空白・読点・句点・括弧なし）に加え、
    // マッチした終端列の直後が `。` のときだけ切る。JetBrains 型（で A・B・Cを統制する）と
    // 読点の目的語内並列は切らない。
    const CIRCLED_RE = /[①-⑨]/g;
    const NAKAGURO3_RE = /[^・\s、。（）()]{6,}・[^・\s、。（）()]{6,}・[^・\s、。（）()]{6,}/g;
    const NAKAGURO_CHUNK_RE = /[^・\s、。（）()]{6,}/g;
    const NAKAGURO_MORE_RE = /・[^・\s、。（）()]{6,}/y;

    function splitClosedCircledLists(box) {
      const hosts = [];
      for (const el of box.querySelectorAll('li, .lbl .v')) {
        if (el.closest('ul.src, ul.enum-split')) continue;
        if (el.tagName === 'LI' && el.querySelector(':scope > .lbl')) continue;
        // 出典チップ（ul.src）は「既に子リストがある」とみなさない。08-12 の成功サンプルは
        // 本文 li の直下に出典 ul を持つので、それを除外すると割れなくなる
        if (el.querySelector(':scope > ul:not(.src):not(.enum-split), :scope > ol')) continue;
        hosts.push(el);
      }
      for (const el of hosts) {
        const backup = el.cloneNode(true);
        try {
          splitOneCircledHost(el);
          if (!el.querySelector(':scope > ul.enum-split')) {
            splitOneNakaguroHost(el);
          }
        } catch (err) {
          console.warn('列挙分割に失敗:', err);
          el.replaceChildren(...backup.childNodes);
        }
      }
    }

    function splitOneCircledHost(el) {
      // 出典 ul はオフセット計算と抽出の対象外。いったん外し、組み立て後に末尾へ戻す
      const srcLists = [...el.children].filter((c) => c.matches?.('ul.src, ol.src'));
      for (const s of srcLists) s.remove();
      const restoreSrc = () => { for (const s of srcLists) el.appendChild(s); };

      const text = el.textContent || '';
      const marks = [];
      CIRCLED_RE.lastIndex = 0;
      let m;
      while ((m = CIRCLED_RE.exec(text))) marks.push(m.index);
      if (marks.length < 2) { restoreSrc(); return; }

      const lastMark = marks[marks.length - 1];
      const period = text.indexOf('。', lastMark + 1);
      if (period < 0) { restoreSrc(); return; }
      if (text.slice(lastMark, period).includes('、の')) { restoreSrc(); return; }

      const slices = [];
      for (let i = 0; i < marks.length; i++) {
        const from = marks[i] + 1;
        const to = (i === marks.length - 1) ? period + 1 : marks[i + 1];
        if (to <= from) { restoreSrc(); return; }
        slices.push({ from, to });
      }

      const coda = extractOffsetRange(el, period + 1, text.length);
      const itemFrags = [];
      for (let i = slices.length - 1; i >= 0; i--) {
        itemFrags.unshift(extractOffsetRange(el, slices[i].from, slices[i].to));
        extractOffsetRange(el, marks[i], marks[i] + 1);
      }
      const parentFrag = document.createDocumentFragment();
      while (el.firstChild) parentFrag.appendChild(el.firstChild);

      const ul = document.createElement('ul');
      ul.className = 'enum-split';
      for (const f of itemFrags) {
        trimNodeEdges(f);
        if (!f.textContent.replace(/\s/g, '')) continue;
        const item = document.createElement('li');
        item.appendChild(f);
        ul.appendChild(item);
      }
      if (ul.childElementCount < 2) {
        throw new Error('enum-split: fewer than 2 items');
      }

      trimNodeEdges(parentFrag);
      if (parentFrag.textContent.replace(/\s/g, '')) el.appendChild(parentFrag);
      el.appendChild(ul);
      if (coda.textContent.replace(/\s/g, '')) {
        trimNodeEdges(coda);
        el.appendChild(coda);
      }
      restoreSrc();
    }

    // NAKAGURO3 と同じ文字クラス・6字×3。3つ目以降の6字句の直後が `。` の終端列だけ切る。
    function findNakaguroEndList(text) {
      NAKAGURO3_RE.lastIndex = 0;
      let m;
      while ((m = NAKAGURO3_RE.exec(text))) {
        let end = m.index + m[0].length;
        while (true) {
          NAKAGURO_MORE_RE.lastIndex = end;
          const more = NAKAGURO_MORE_RE.exec(text);
          if (!more) break;
          end = NAKAGURO_MORE_RE.lastIndex;
        }
        let period = end;
        while (period < text.length && /\s/.test(text[period])) period++;
        if (text[period] !== '。') continue;

        const run = text.slice(m.index, end);
        NAKAGURO_CHUNK_RE.lastIndex = 0;
        const chunks = [];
        let cm;
        while ((cm = NAKAGURO_CHUNK_RE.exec(run))) {
          chunks.push({
            from: m.index + cm.index,
            to: m.index + cm.index + cm[0].length,
          });
        }
        if (chunks.length < 3) continue;
        return { chunks, period };
      }
      return null;
    }

    function splitOneNakaguroHost(el) {
      const srcLists = [...el.children].filter((c) => c.matches?.('ul.src, ol.src'));
      for (const s of srcLists) s.remove();
      const restoreSrc = () => { for (const s of srcLists) el.appendChild(s); };

      const text = el.textContent || '';
      const hit = findNakaguroEndList(text);
      if (!hit) { restoreSrc(); return; }

      const { chunks, period } = hit;
      const last = chunks[chunks.length - 1];
      const coda = extractOffsetRange(el, period + 1, text.length);
      const itemFrags = [];
      itemFrags.unshift(extractOffsetRange(el, last.from, period + 1));
      for (let i = chunks.length - 2; i >= 0; i--) {
        extractOffsetRange(el, chunks[i].to, chunks[i + 1].from);
        itemFrags.unshift(extractOffsetRange(el, chunks[i].from, chunks[i].to));
      }

      const parentFrag = document.createDocumentFragment();
      while (el.firstChild) parentFrag.appendChild(el.firstChild);
      trimTrailingNakaguro(parentFrag);

      const ul = document.createElement('ul');
      ul.className = 'enum-split';
      for (const f of itemFrags) {
        trimNodeEdges(f);
        if (!f.textContent.replace(/\s/g, '')) continue;
        const item = document.createElement('li');
        item.appendChild(f);
        ul.appendChild(item);
      }
      if (ul.childElementCount < 3) {
        throw new Error('enum-split: fewer than 3 nakaguro items');
      }

      trimNodeEdges(parentFrag);
      if (parentFrag.textContent.replace(/\s/g, '')) el.appendChild(parentFrag);
      el.appendChild(ul);
      if (coda.textContent.replace(/\s/g, '')) {
        trimNodeEdges(coda);
        el.appendChild(coda);
      }
      restoreSrc();
    }

    function trimTrailingNakaguro(node) {
      const walk = (n) => {
        const kids = [...n.childNodes].reverse();
        for (const c of kids) {
          if (c.nodeType === 3) {
            c.nodeValue = c.nodeValue.replace(/[・\s]+$/, '');
            if (!c.nodeValue) { c.remove(); continue; }
            return;
          }
          if (c.nodeType === 1) {
            walk(c);
            if (!c.textContent) { c.remove(); continue; }
            return;
          }
        }
      };
      walk(node);
    }

    function extractOffsetRange(root, start, end) {
      const frag = document.createDocumentFragment();
      if (end <= start) return frag;
      const r = rangeFromTextOffsets(root, start, end);
      if (!r || r.collapsed) return frag;
      return r.extractContents();
    }

    function rangeFromTextOffsets(root, start, end) {
      const points = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let pos = 0;
      let n;
      while ((n = walker.nextNode())) {
        const len = n.nodeValue.length;
        points.push({ n, pos, len });
        pos += len;
      }
      if (!points.length) return null;
      const total = pos;
      if (start < 0) start = 0;
      if (end > total) end = total;
      if (end <= start) return null;

      const at = (off, asEnd) => {
        if (off >= total) {
          const last = points[points.length - 1];
          return { n: last.n, o: last.len };
        }
        for (const p of points) {
          if (off < p.pos + p.len || (asEnd && off === p.pos + p.len)) {
            return { n: p.n, o: off - p.pos };
          }
        }
        const last = points[points.length - 1];
        return { n: last.n, o: last.len };
      };

      const a = at(start, false);
      const b = at(end, true);
      const r = document.createRange();
      r.setStart(a.n, a.o);
      r.setEnd(b.n, b.o);
      return r;
    }

    function trimNodeEdges(node) {
      const walk = (n, fromEnd) => {
        const kids = [...n.childNodes];
        const seq = fromEnd ? kids.reverse() : kids;
        for (const c of seq) {
          if (c.nodeType === 3) {
            c.nodeValue = fromEnd ? c.nodeValue.replace(/\s+$/, '') : c.nodeValue.replace(/^\s+/, '');
            if (!c.nodeValue) c.remove();
            else return;
          } else if (c.nodeType === 1) {
            walk(c, fromEnd);
            if (!c.textContent) c.remove();
            else return;
          }
        }
      };
      walk(node, false);
      walk(node, true);
    }

    // 長い項目を句点 `。` で視覚ブロックに分ける。ラッパー li は残す（件数を増やさない）。
    // 下限 160 は industry の項目平均上限（161）に合わせ、それを超える項目だけ対象にする。
    // 列挙分割済み（ul.enum-split）は既に改行があるので触らない。Markdown は触らない。
    const PERIOD_MIN_LEN = 160;

    function splitLongItemsByPeriod(box) {
      const hosts = [];
      for (const el of box.querySelectorAll('li, .lbl .v')) {
        if (el.closest('ul.src, ul.enum-split, .sent')) continue;
        if (el.tagName === 'LI' && el.querySelector(':scope > .lbl')) continue;
        if (el.querySelector(':scope > ul.enum-split')) continue;
        if (el.querySelector(':scope > ul:not(.src), :scope > ol')) continue;
        hosts.push(el);
      }
      for (const el of hosts) {
        const backup = el.cloneNode(true);
        try {
          splitOnePeriodHost(el);
        } catch (err) {
          console.warn('句点分割に失敗:', err);
          el.replaceChildren(...backup.childNodes);
        }
      }
    }

    function periodSlices(text) {
      const cuts = [];
      for (let i = 0; i < text.length; i++) {
        if (text[i] === '。') cuts.push(i + 1);
      }
      if (!cuts.length) return null;
      const slices = [];
      let from = 0;
      for (const to of cuts) {
        if (to > from) slices.push({ from, to });
        from = to;
      }
      if (from < text.length && text.slice(from).replace(/\s/g, '')) {
        slices.push({ from, to: text.length });
      }
      if (slices.length < 2) return null;
      return slices;
    }

    function splitOnePeriodHost(el) {
      const srcLists = [...el.children].filter((c) => c.matches?.('ul.src, ol.src'));
      for (const s of srcLists) s.remove();
      const restoreSrc = () => { for (const s of srcLists) el.appendChild(s); };

      const text = el.textContent || '';
      if (text.replace(/\s/g, '').length < PERIOD_MIN_LEN) { restoreSrc(); return; }
      const slices = periodSlices(text);
      if (!slices) { restoreSrc(); return; }

      const later = [];
      for (let i = slices.length - 1; i >= 1; i--) {
        later.unshift(extractOffsetRange(el, slices[i].from, slices[i].to));
      }
      const first = document.createDocumentFragment();
      while (el.firstChild) first.appendChild(el.firstChild);

      const blocks = [];
      for (const f of [first, ...later]) {
        trimNodeEdges(f);
        if (!f.textContent.replace(/\s/g, '')) continue;
        const d = document.createElement('div');
        d.className = 'sent';
        d.appendChild(f);
        blocks.push(d);
      }
      if (blocks.length < 2) throw new Error('period-split: fewer than 2 sentences');
      for (const d of blocks) el.appendChild(d);
      restoreSrc();
    }

    // 20字を超える太字は「キーワード強調」ではなく「文まるごとの強調」なのでウェイトを落とす。
    // 2026-07-26 実測でデイリーは本文の18.7%が太字、うち4割が20字超だった。
    function decorateBold(box) {
      for (const s of box.querySelectorAll('strong')) {
        if (s.textContent.trim().length > 20) s.classList.add('long');
      }
    }

    // 見出しの「タイトル — 含意」を分け、含意側を弱める。
    // h3 は既に font-weight:700 なのでタイトルをこれ以上太くはできない。
    // 代わりに後半を落として、結果としてタイトルが立つようにする。
    //
    // 区切りは3形式が混在している（2026-07-28 実測・全ソース）:
    //   ` — `   現行の標準形式               例) Opus 5 が GA — 翌日には既定が切り替わった
    //   `）— `  weekly のリポタグ（前空白なし）例) Codex CLI 0.145.0（7/21）— [master]
    //   `——`    industry の旧ファイル         例) Pew調査（6月）——米成人の49%が…
    // そのため `\s*—+\s*` で拾う。ハイフン `-` は区切りではない
    // （`Cursor 3.6 - Auto-review` のようにタイトル内の文字）ので対象外。
    const RE_H3SEP = /\s*—+\s*/;

    function decorateHeadings(box) {
      for (const h of box.querySelectorAll('h3')) {
        // タイトル内に `code` やリンクが入る見出しがあるため、innerHTML の文字列置換はしない。
        // 区切りを含むテキストノードを見つけて、そこから後ろのノードごと span へ移す
        for (const node of [...h.childNodes]) {
          if (node.nodeType !== Node.TEXT_NODE) continue;
          const m = node.nodeValue.match(RE_H3SEP);
          if (!m) continue;

          // 区切りが2つある旧形式（タイトル — 詳細 — 含意）は最初の区切りで分ける。
          // 立てたいのはタイトルなので、2つ目以降は含意側にまとめてよい
          const tail = node.splitText(m.index);
          const sub = document.createElement('span');
          sub.className = 'h3-sub';
          // appendChild は移動なので、先に対象を控えてから動かす
          const move = [];
          for (let n = tail; n; n = n.nextSibling) move.push(n);
          for (const n of move) sub.appendChild(n);
          h.appendChild(sub);
          break; // 1見出しにつき1回だけ
        }
      }
    }

    // 箇条書きの「タイトル — 説明」も分ける。h3 とは扱いが逆で、
    // li の基本ウェイトは 400 なのでタイトル側を太くできる（h3 は既に 700 で余地がなかった）。
    //
    // `**ラベル**: 説明` 形式は strong が既に太字なので触らない。
    // 2026-07-28 実測では箇条書きの多数派がこの形式（Copilot 135/168・weekly 519/816）。
    // ただし `**Claude Security** プラグインが public beta — …` のように
    // 「太字を含むタイトル」もあるため、strong の直後が `:` のときだけ除外する。
    function decorateListTitles(box) {
      for (const li of box.querySelectorAll('li')) {
        // ⚠️ 緩いリスト（項目の間に空行があるもの）は marked が中身を <p> で包むため、
        // li の直下にテキストノードが無い。01 Master が緩いリスト、05 daily が密なリストで
        // 実際に両方が混在する。包まれている場合は <p> 側を対象にする
        const firstEl = li.firstElementChild;
        const host = (firstEl && firstEl.tagName === 'P' && li.firstChild === firstEl) ? firstEl : li;

        const head = host.firstChild;
        if (head && head.nodeType === Node.ELEMENT_NODE && head.tagName === 'STRONG') {
          const after = head.nextSibling;
          if (after && after.nodeType === Node.TEXT_NODE && /^\s*[:：]/.test(after.nodeValue)) continue;
        }

        for (const node of [...host.childNodes]) {
          if (node.nodeType !== Node.TEXT_NODE) continue;
          const m = node.nodeValue.match(RE_H3SEP);
          if (!m) continue;

          node.splitText(m.index); // node は区切りの直前までになる
          // 先頭から node までを span へ移す。appendChild は移動なので先に控える
          const move = [];
          for (let n = host.firstChild; n; n = n.nextSibling) { move.push(n); if (n === node) break; }
          const title = document.createElement('span');
          title.className = 'li-title';
          host.insertBefore(title, host.firstChild);
          for (const n of move) title.appendChild(n);
          break; // 1項目につき1回だけ
        }
      }
    }

    // 冒頭注記（h1 直後の blockquote）を圧縮する。
    // 「本サマリーは 01_…・02_…・03_… の3ソース（M/D分）を統合して作成。」は
    // 仕様上**欠損があった日だけ情報を持つ**注記で、2026-08-01 の実測では
    // 76日中 欠損は3日（4%）。残る96%は定型文が 375px 幅で 86px を占めていた。
    // 欠損の合図があれば圧縮しない（そこが読ませたい情報なので）。
    // ⚠️ 「欠損なし」を「欠損」で拾ってはいけない。04 weekly の定型行が
    // `入力: 取得成功 21 / 21（欠損なし）` で、素朴に /欠損/ と書くと**正常な週まで通常表示**になる。
    const NOTE_ALERT = /※|未取得|取得できず|欠損(?!なし)/;

    function decorateNote(box) {
      const h1 = box.querySelector('h1');
      if (!h1) return;
      const n = h1.nextElementSibling;
      if (!n || n.tagName !== 'BLOCKQUOTE') return;
      if (!NOTE_ALERT.test(n.textContent)) n.classList.add('note-slim');
    }

    // H1 直後の導入段落はリード文として落ち着かせる
    function decorateLede(box) {
      const h1 = box.querySelector('h1');
      if (!h1) return;
      let n = h1.nextElementSibling;
      while (n && n.tagName === 'BLOCKQUOTE') n = n.nextElementSibling;
      if (n && n.tagName === 'P') n.classList.add('lede');
    }

    function digestYear() {
      const id = String(state.activeId || '');
      const m = id.match(/^(\d{4})/);
      if (m) return Number(m[1]);
      const t = document.querySelector('.content h1')?.textContent || '';
      const m2 = t.match(/(20\d{2})/);
      return m2 ? Number(m2[1]) : new Date().getFullYear();
    }
    function schedMD(month, day) { return `${Number(month)}/${Number(day)}`; }
    function finishSchedLabel(out, digestY) {
      const quals = [...out.quals];
      if (out.year && out.year !== digestY && !quals.includes(String(out.year))) {
        quals.unshift(String(out.year));
      }
      return { day: out.day, quals, year: out.year || null };
    }
    function parseScheduleLabel(raw) {
      const s = String(raw || '').trim();
      const y = digestYear();
      const out = { day: '', year: null, quals: [] };

      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*〜\s*・\s*(\d{1,2})-(\d{1,2})\s*〜$/);
      if (m) {
        out.day = schedMD(m[2], m[3]); out.year = Number(m[1]);
        out.quals.push('以降', `・${schedMD(m[4], m[5])}`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*〜$/);
      if (m) {
        out.day = schedMD(m[2], m[3]); out.year = Number(m[1]); out.quals.push('以降');
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*・\s*(?:(\d{4})-)?(\d{1,2})-(\d{1,2})\s*〜?$/);
      if (m) {
        out.day = schedMD(m[2], m[3]); out.year = Number(m[1]);
        out.quals.push(`・${schedMD(m[5], m[6])}`);
        if (/〜$/.test(s)) out.quals.push('以降');
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m) {
        out.day = schedMD(m[2], m[3]); out.year = Number(m[1]);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})-(\d{1,2})\s*〜$/);
      if (m) {
        out.year = Number(m[1]); out.quals.push(`${Number(m[2])}月〜`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})-(\d{1,2})$/);
      if (m) {
        out.year = Number(m[1]); out.quals.push(`${Number(m[2])}月`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{4})年末$/);
      if (m) { out.year = Number(m[1]); out.quals.push('年末'); return finishSchedLabel(out, y); }
      m = s.match(/^(\d{4})$/);
      if (m) return { day: '', quals: [m[1]], year: Number(m[1]) };

      m = s.match(/^(\d{1,2})\/(\d{1,2})\s*[–—−-]\s*(\d{1,2})\/(\d{1,2})$/);
      if (m) {
        out.day = schedMD(m[1], m[2]); out.quals.push(`–${schedMD(m[3], m[4])}`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{1,2})\/(\d{1,2})\s*[–—−-]\s*(\d{1,2})$/);
      if (m) {
        out.day = schedMD(m[1], m[2]); out.quals.push(`–${schedMD(m[1], m[3])}`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{1,2})\/(\d{1,2})\s*・\s*(\d{1,2})\/(\d{1,2})$/);
      if (m) {
        out.day = schedMD(m[1], m[2]); out.quals.push(`・${schedMD(m[3], m[4])}`);
        return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{1,2})\/(\d{1,2})\s*頃$/);
      if (m) { out.day = schedMD(m[1], m[2]); out.quals.push('頃'); return finishSchedLabel(out, y); }
      m = s.match(/^(\d{1,2})\/(\d{1,2})\s*〜$/);
      if (m) { out.day = schedMD(m[1], m[2]); out.quals.push('以降'); return finishSchedLabel(out, y); }
      m = s.match(/^(\d{1,2})\/(\d{1,2})$/);
      if (m) { out.day = schedMD(m[1], m[2]); return finishSchedLabel(out, y); }

      m = s.match(/^(\d{1,2})月末$/);
      if (m) { out.quals.push(`${Number(m[1])}月末`); return finishSchedLabel(out, y); }
      m = s.match(/^(\d{1,2})月(.+)$/);
      if (m) { out.quals.push(`${Number(m[1])}月${m[2]}`); return finishSchedLabel(out, y); }
      m = s.match(/^(\d{1,2})月$/);
      if (m) { out.quals.push(`${Number(m[1])}月`); return finishSchedLabel(out, y); }
      if (/^(年末|年内|今秋|今冬|今春|今夏|今年度内)$/.test(s)) {
        out.quals.push(s); return finishSchedLabel(out, y);
      }
      m = s.match(/^(\d{1,2})\/(\d{1,2})(.*)$/);
      if (m) {
        out.day = schedMD(m[1], m[2]);
        const rest = m[3].trim().replace(/^〜$/, '以降');
        if (rest) out.quals.push(rest);
        return finishSchedLabel(out, y);
      }
      if (s) out.quals.push(s);
      return finishSchedLabel(out, y);
    }

    // 注目予定の「**日付**: 本文」を日付列＋本文列に組み替える。
    // groupSections が data-sched を付けるので、その後に呼ぶこと。
    function decorateSchedule(box) {
      for (const sec of box.querySelectorAll('details.sec[data-sched]')) {
        for (const li of sec.querySelectorAll(':scope > ul:not(.src) > li, :scope > ol > li')) {
          if (li.querySelector(':scope > .sched-d')) continue;

          const firstEl = li.firstElementChild;
          const host = (firstEl && firstEl.tagName === 'P' && li.firstChild === firstEl) ? firstEl : li;

          const strong = host.firstElementChild;
          if (!strong || strong.tagName !== 'STRONG') continue;
          const after = strong.nextSibling;
          if (!after || after.nodeType !== Node.TEXT_NODE || !/^\s*[:：]/.test(after.nodeValue || '')) continue;

          after.nodeValue = after.nodeValue.replace(/^\s*[:：]\s*/, '');
          const parsed = parseScheduleLabel(strong.textContent);

          const date = document.createElement('span');
          date.className = 'sched-d' + (parsed.day ? '' : ' is-empty');
          date.textContent = parsed.day || '–';
          date.title = strong.textContent;

          const body = document.createElement('span');
          body.className = 'sched-b';

          const move = [];
          for (let n = strong.nextSibling; n; n = n.nextSibling) move.push(n);
          strong.remove();
          for (const n of move) body.appendChild(n);

          const firstText = body.firstChild;
          if (firstText && firstText.nodeType === Node.TEXT_NODE) {
            const tm = firstText.nodeValue.match(/^（本日）\s*/);
            if (tm) {
              const badge = document.createElement('span');
              badge.className = 'sched-today';
              badge.textContent = '本日';
              firstText.nodeValue = firstText.nodeValue.slice(tm[0].length);
              body.insertBefore(badge, firstText);
            }
          }

          splitScheduleParts(body);

          const today = body.querySelector('.sched-today');
          const ref = today ? today.nextSibling : body.firstChild;
          for (const q of parsed.quals) {
            const chip = document.createElement('span');
            chip.className = 'sched-chip';
            chip.textContent = q;
            body.insertBefore(chip, ref);
          }

          if (host !== li) {
            host.replaceWith(date, body);
          } else {
            host.prepend(date, body);
          }
        }
        groupScheduleWeeks(sec);
      }
    }

    function digestDate() {
      const id = String(state.activeId || '');
      let m = id.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      m = id.match(/^(\d{4})-W(\d{2})$/);
      if (m) {
        const jan4 = new Date(Number(m[1]), 0, 4);
        const mon = mondayOf(jan4);
        mon.setDate(mon.getDate() + (Number(m[2]) - 1) * 7);
        return mon;
      }
      return new Date();
    }
    function mondayOf(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return x;
    }
    function ymd(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function schedAnchor(parsed, digest) {
      const y0 = digest.getFullYear();
      const year = parsed.year || y0;
      if (parsed.day) {
        const md = parsed.day.match(/^(\d{1,2})\/(\d{1,2})$/);
        if (md) return { kind: 'day', y: year, m: Number(md[1]), d: Number(md[2]) };
      }
      const joined = parsed.quals.join(' ');
      const mm = joined.match(/(\d{1,2})月/);
      if (mm) return { kind: 'month', y: year, m: Number(mm[1]) };
      if (parsed.year && !parsed.day) return { kind: 'year', y: parsed.year };
      const per = parsed.quals.find((q) => /^(年内|年末|今秋|今冬|今春|今夏|今年度内)$/.test(q));
      if (per) return { kind: 'period', y: y0, label: per };
      return { kind: 'period', y: y0, label: parsed.quals[0] || '時期' };
    }
    function weekTitle(monday, digest) {
      const thisMon = mondayOf(digest);
      const diff = Math.round((monday - thisMon) / 86400000 / 7);
      const sun = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
      const range = `${schedMD(monday.getMonth() + 1, monday.getDate())}–${schedMD(sun.getMonth() + 1, sun.getDate())}`;
      const y = monday.getFullYear() !== digest.getFullYear() ? `${monday.getFullYear()} ` : '';
      if (diff === 0) return y + '今週';
      if (diff === 1) return y + '来週';
      if (diff === 2) return y + '再来週';
      if (diff === -1) return y + '先週';
      return y + range;
    }

    // 注目予定を週（月・年内）のトグルに分ける。カテゴリ節と同じ外形にする（2026-09-21）
    function groupScheduleWeeks(sec) {
      const digest = digestDate();
      const thisMon = ymd(mondayOf(digest));
      const next = mondayOf(digest); next.setDate(next.getDate() + 7);
      const nextMon = ymd(next);

      for (const ul of [...sec.querySelectorAll(':scope > ul:not(.src), :scope > ol')]) {
        const groups = [];
        const map = new Map();
        for (const li of [...ul.children]) {
          if (li.tagName !== 'LI') continue;
          const raw = li.querySelector('.sched-d')?.title || '';
          const a = schedAnchor(parseScheduleLabel(raw), digest);
          let rec;
          if (a.kind === 'day') {
            const dt = new Date(a.y, a.m - 1, a.d);
            const mon = mondayOf(dt);
            const key = 'w:' + ymd(mon);
            rec = map.get(key);
            if (!rec) {
              rec = { type: 'week', key, monday: mon, sort: ymd(mon), items: [] };
              map.set(key, rec); groups.push(rec);
            }
          } else if (a.kind === 'month') {
            const key = `m:${a.y}-${String(a.m).padStart(2, '0')}`;
            rec = map.get(key);
            if (!rec) {
              rec = { type: 'month', key, y: a.y, m: a.m, sort: `${a.y}-${String(a.m).padStart(2, '0')}-32`, items: [] };
              map.set(key, rec); groups.push(rec);
            }
          } else if (a.kind === 'year') {
            const key = `y:${a.y}`;
            rec = map.get(key);
            if (!rec) {
              rec = { type: 'year', key, y: a.y, sort: `${a.y}-12-32`, items: [] };
              map.set(key, rec); groups.push(rec);
            }
          } else {
            const key = 'p:' + a.label;
            rec = map.get(key);
            if (!rec) {
              rec = { type: 'period', key, label: a.label, sort: `${a.y}-12-31`, items: [] };
              map.set(key, rec); groups.push(rec);
            }
          }
          rec.items.push(li);
        }
        groups.sort((a, b) => (a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0));

        for (const g of groups) {
          const sub = document.createElement('details');
          sub.className = 'sub';
          if (g.key === 'w:' + thisMon || g.key === 'w:' + nextMon) sub.dataset.near = '1';

          const sum = document.createElement('summary');
          sum.className = 'sub-h';
          const t = document.createElement('h3');
          t.className = 'sub-t';
          t.textContent = g.type === 'week' ? weekTitle(g.monday, digest)
            : g.type === 'month' ? (g.y !== digest.getFullYear() ? `${g.y}年${g.m}月` : `${g.m}月`)
            : g.type === 'year' ? String(g.y)
            : g.label;
          const c = document.createElement('span');
          c.className = 'sub-n';
          c.textContent = `${g.items.length}件`;
          sum.append(t, c);

          const inner = document.createElement(ul.tagName);
          for (const li of g.items) inner.appendChild(li);
          sub.append(sum, inner);
          ul.before(sub);
        }
        ul.remove();
      }
    }

    // 本文中の「 ／ 」を境に .sched-part へ分ける。code 等を跨がない素朴な実装。
    // 区切りが無い・1件だけのときは何もしない（余計なラッパを増やさない）。
    function splitScheduleParts(body) {
      const nodes = [...body.childNodes];
      if (!nodes.some((n) => n.nodeType === Node.TEXT_NODE && /／/.test(n.nodeValue || ''))) return;

      const parts = [[]];
      for (const n of nodes) {
        if (n.nodeType === Node.TEXT_NODE && /／/.test(n.nodeValue || '')) {
          const chunks = n.nodeValue.split(/／/);
          chunks.forEach((chunk, i) => {
            if (i > 0) parts.push([]);
            const t = chunk.replace(/^\s+|\s+$/g, '');
            if (t) parts[parts.length - 1].push(document.createTextNode(t));
          });
        } else {
          parts[parts.length - 1].push(n);
        }
      }
      if (parts.length < 2) return;

      body.replaceChildren();
      for (const nodes of parts) {
        if (!nodes.length) continue;
        const part = document.createElement('div');
        part.className = 'sched-part';
        for (const n of nodes) part.appendChild(n);
        body.appendChild(part);
      }
      if (body.querySelectorAll('.sched-part').length >= 2) {
        body.classList.add('sched-multi');
      }
    }

    // ============ ナビゲーション ============

    function currentDayId() {
      const id = String(state.activeId || '');
      return /^\d{4}-\d{2}-\d{2}$/.test(id) ? id : null;
    }

    function weekFilterFromEntry(e) {
      if (!e || e.kind !== 'week' || !e.mon) return null;
      const start = ymdOf(e.mon);
      const end = ymdOf(new Date(e.mon.getTime() + 6 * 86400000));
      return { start, end };
    }

    function currentWeekRange() {
      if (state.weekFilter) return state.weekFilter;
      if (state.sourceId === 'weekly') {
        return weekFilterFromEntry(state.entries.find((x) => x.id === state.activeId));
      }
      return null;
    }

    // パンくず・weekFilter 用の親。展開 UI は treeOpen を見る。
    function navParent() {
      const f = state.navFocus;
      if (f === 'home') return 'home';
      if (f === 'category' || state.categorySlug) return 'category';
      if (f === 'daily' || f === 'weekly') return f;
      if (isChildId(f)) return state.weekFilter ? 'weekly' : 'daily';
      return 'daily';
    }

    function openTree(id) {
      if (!(id in state.treeOpen)) return;
      if (!state.treeOpen[id]) state.treeOpen[id] = true;
    }

    function toggleTree(id) {
      state.treeOpen[id] = !state.treeOpen[id];
      renderSourceTree();
    }

    function srcButton(opts) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'side-src' + (opts.active ? ' is-active' : '');
      b.dataset.nav = opts.nav;
      if (opts.from) b.dataset.from = opts.from;
      if (opts.slug) b.dataset.slug = opts.slug;
      b.textContent = opts.label;
      if (opts.active) b.setAttribute('aria-current', 'true');
      return b;
    }

    function appendSourceLeaves(host, from) {
      const lab = document.createElement('div');
      lab.className = 'side-subhead';
      lab.textContent = SOURCE_SUBHEAD;
      host.appendChild(lab);
      const nav = document.createElement('div');
      nav.className = 'side-children';
      nav.setAttribute('role', 'group');
      nav.setAttribute('aria-label', SOURCE_SUBHEAD);
      for (const s of SOURCES.filter((x) => x.group === 'source')) {
        nav.appendChild(srcButton({
          nav: s.id,
          from,
          label: s.name,
          active: state.navFocus === s.id && (
            from === 'weekly' ? !!state.weekFilter : !state.weekFilter
          ) && !state.categorySlug,
        }));
      }
      host.appendChild(nav);
    }

    function appendCategoryLeaves(host) {
      const nav = document.createElement('div');
      nav.className = 'side-children';
      nav.setAttribute('role', 'group');
      nav.setAttribute('aria-label', CATEGORY_TITLE);
      for (const c of CATEGORIES) {
        nav.appendChild(srcButton({
          nav: 'cat',
          slug: c.slug,
          label: c.name,
          active: state.categorySlug === c.slug,
        }));
      }
      host.appendChild(nav);
    }

    function appendBranch(wrap, opts) {
      const branch = document.createElement('div');
      branch.className = 'side-branch';
      const row = document.createElement('div');
      row.className = 'side-parent-row';
      const open = !!state.treeOpen[opts.id];
      const twist = document.createElement('button');
      twist.type = 'button';
      twist.className = 'side-twist';
      twist.dataset.twist = opts.id;
      twist.setAttribute('aria-expanded', String(open));
      twist.setAttribute('aria-label', open ? `${opts.label}を閉じる` : `${opts.label}を開く`);
      row.appendChild(twist);
      row.appendChild(srcButton({
        nav: opts.nav,
        label: opts.label,
        active: opts.active,
      }));
      branch.appendChild(row);
      if (open) {
        const nest = document.createElement('div');
        nest.className = 'side-nest';
        opts.fill(nest);
        branch.appendChild(nest);
      }
      wrap.appendChild(branch);
    }

    function renderSourceTree() {
      const tree = $('#source-tree');
      tree.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'side-group';
      wrap.setAttribute('role', 'navigation');
      wrap.setAttribute('aria-label', 'ソース');

      const homeRow = document.createElement('div');
      homeRow.className = 'side-parent-row';
      const homeGap = document.createElement('span');
      homeGap.setAttribute('aria-hidden', 'true');
      homeRow.appendChild(homeGap);
      homeRow.appendChild(srcButton({
        nav: 'home',
        label: 'ホーム',
        active: state.navFocus === 'home',
      }));
      wrap.appendChild(homeRow);

      appendBranch(wrap, {
        id: 'daily',
        nav: 'daily',
        label: srcOf('daily').name,
        active: state.navFocus === 'daily',
        fill: (nest) => appendSourceLeaves(nest, 'daily'),
      });
      appendBranch(wrap, {
        id: 'weekly',
        nav: 'weekly',
        label: srcOf('weekly').name,
        active: state.navFocus === 'weekly',
        fill: (nest) => appendSourceLeaves(nest, 'weekly'),
      });
      appendBranch(wrap, {
        id: 'category',
        nav: 'category',
        label: CATEGORY_TITLE,

    function crumbPart(text, cls) {
      const s = document.createElement('span');

    function crumbHomeLink() {
      const b = document.createElement('button');
      b.type = 'button';

    function syncBreadcrumb() {
      const crumb = $('#crumb');
      if (!crumb) return;
      const e = state.entries.find((x) => x.id === state.activeId);
      const dateLabel = !e || state.navFocus === 'home' ? ''
        : (e.kind === 'week' || e.kind === 'date') ? formatEntryWhen(e)
        : (e.fullLabel || e.label);
      const names = [];
      if (state.navFocus === 'home') {
        names.push('ホーム');
      } else if (state.navFocus === 'category' && !state.categorySlug) {
        names.push(CATEGORY_TITLE);
      } else if (state.categorySlug) {
        const cat = catOf(state.categorySlug);
        names.push(CATEGORY_TITLE);
        if (cat) names.push(cat.name);
      } else if (state.navFocus === 'daily' || state.navFocus === 'weekly') {
        names.push(srcOf(state.navFocus).name);
      } else if (isChildId(state.navFocus)) {
        names.push(srcOf(state.weekFilter ? 'weekly' : 'daily').name);
        names.push(srcOf(state.navFocus).name);
      } else {
        names.push(srcOf(state.sourceId).name);
      }
      crumb.replaceChildren();
      // ホーム以外では先頭の「ホーム」が戻り先。
      // モバイルは途中の階層だけ隠し、日付の直前（今日のまとめ、または話題名）は残す。
      if (state.navFocus !== 'home') {
        crumb.append(crumbHomeLink(), crumbPart('/', 'crumb-sep'));
      }
      names.forEach((name, i) => {
        const isLastName = i === names.length - 1;
        const isCurrent = isLastName && !dateLabel;
        if (i) crumb.append(crumbPart('/', 'crumb-sep crumb-sep-group'));
        let cls = 'crumb-item';
        if (isCurrent) cls += ' crumb-current';
        else if (!isLastName) cls += ' crumb-group';
        else cls += ' crumb-context';
        crumb.append(crumbPart(name, cls));
      });
      if (dateLabel) {
        crumb.append(
          crumbPart('/', 'crumb-sep'),
          crumbPart(dateLabel, 'crumb-item crumb-current'),
        );
      }
    }

    function clearJumpSpacer() {
      document.getElementById('nav-jump-spacer')?.remove();

    function scrollMainTo(el) {
      const main = $('.main');
      if (!main || !el) return;
      let spacer = document.getElementById('nav-jump-spacer');
      if (!spacer) {
        spacer = document.createElement('div');
        spacer.id = 'nav-jump-spacer';
        spacer.setAttribute('aria-hidden', 'true');
        $('#content').appendChild(spacer);
      }
      spacer.style.height = '0px';
      const topOf = () => el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
      const want = topOf();
      const max = main.scrollHeight - main.clientHeight;
      if (want > max) spacer.style.height = (want - max + 8) + 'px';
      main.scrollTop = topOf();
    }

    function clipCatTitle(s) {
      const t = String(s || '').replace(/\s+/g, ' ').trim();
      if (!t) return '';
      return t.length > CAT_TITLE_MAX ? t.slice(0, CAT_TITLE_MAX - 1) + '…' : t;
    }

    function catHighlightTitle(block) {
      const first = String(block || '').split('\n')[0].replace(/^#+\s*/, '');
      let t = first.replace(/^\d+\s*[.．、]\s*/, '');
      t = t.replace(/\s+[—–−\-]\s+.+$/, '');
      return clipCatTitle(t) || clipCatTitle(first) || '項目';
    }

    function catItemTitle(chunk) {
      const m = String(chunk || '').match(/\*\*([^*]+)\*\*/);
      if (m) {
        const t = clipCatTitle(m[1]);
        if (t) return t;
      }
      for (const raw of String(chunk || '').split('\n')) {
        const line = raw.replace(/^[-*]\s+/, '').replace(/^#+\s*/, '').replace(/\*\*/g, '').trim();
        if (line) return clipCatTitle(line) || '項目';
      }
      return '項目';
    }

    function fillCatBody(el, md) {
      if (typeof marked === 'undefined') {
        const pre = document.createElement('pre');
        pre.textContent = md;
        el.replaceChildren(pre);
        return;
      }
      el.innerHTML = marked.parse(md);
      try { decorate(el, { group: false }); } catch (err) { console.warn('装飾に失敗:', err); }
    }

    function catPieceNode(piece) {
      const art = document.createElement('article');
      art.className = 'cat-piece';
      const h = document.createElement('h3');
      h.className = 'cat-piece-t';
      h.textContent = piece.kind === 'hl' ? catHighlightTitle(piece.md) : catItemTitle(piece.md);
      art.appendChild(h);
      const body = document.createElement('div');
      let md = piece.md;
      if (piece.kind === 'hl') md = md.replace(/^###[^\n]*\n+/, '');
      fillCatBody(body, md);
      art.appendChild(body);
      return art;
    }
